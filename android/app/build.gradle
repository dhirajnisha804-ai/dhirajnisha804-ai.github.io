plugins { id 'com.android.application' }
def host = System.getenv("DRX_HOST") ?: "dhirajnisha804-ai.github.io"
android {
    namespace 'com.dermadesk.app'
    compileSdk 34
    defaultConfig {
        applicationId "in.dermrx.desk"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "2." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        buildConfigField "String", "APP_URL", "\"https://" + host + "/\""
        buildConfigField "String", "APP_HOST", "\"" + host + "\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv("DRX_KEYSTORE") ?: "../../keys/dermrx.jks")
            storePassword System.getenv("DRX_KEYPASS")
            keyAlias "dermrx"
            keyPassword System.getenv("DRX_KEYPASS")
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.13.1' }
