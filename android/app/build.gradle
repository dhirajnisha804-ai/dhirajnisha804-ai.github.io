plugins { id 'com.android.application' }
def host = System.getenv("DRX_HOST") ?: "example.github.io"
android {
    namespace 'in.dermrx.desk'
    compileSdk 34
    defaultConfig {
        applicationId "in.dermrx.desk"
        minSdk 21
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        resValue "string", "host", host
        resValue "string", "launch_url", "https://" + host + "/"
        resValue "string", "asset_statements", '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + host + '\\"}}]'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("DRX_KEYSTORE") ?: "../../keys/dermrx.jks")
            storePassword System.getenv("DRX_KEYPASS")
            keyAlias "dermrx"
            keyPassword System.getenv("DRX_KEYPASS")
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
