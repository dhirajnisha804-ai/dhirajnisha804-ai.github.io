<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Derma Desk – Case photo review</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--line:#d6dde5;--fg:#16222e;--muted:#5b6876;--accent:#1d5f8a;--accent-soft:#e3eef6;--ok:#2f7445;--ok-soft:#e4f2e8;--no:#a8455d;--no-soft:#f6e8ec;--nav:#14324d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1620;--surface:#17202b;--line:#2c3a48;--fg:#e4eaf0;--muted:#98a6b4;--accent:#6fb3e0;--accent-soft:#19324a;--ok:#86c99a;--ok-soft:#1a3022;--no:#e597aa;--no-soft:#38232b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--nav);color:#fff;padding:12px 16px;border-bottom:3px solid #2aa198}
header h1{margin:0;font-size:18px}header p{margin:2px 0 0;font-size:13px;opacity:.85}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.bar button,.bar select{font:inherit;font-size:13px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;padding:6px 12px}
.bar .prim{background:#2aa198;border-color:#2aa198;font-weight:600}
main{max-width:900px;margin:0 auto;padding:12px 16px 80px;display:flex;flex-direction:column;gap:12px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.case h2{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:center}
.case h2 .st{margin-left:auto;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.case.done-none h2 .st{background:var(--no-soft);color:var(--no)}.case.done-pick h2 .st{background:var(--ok-soft);color:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit}
.opt img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line);display:block}
.opt .cap{padding:6px 9px;font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.opt .cap b{color:var(--fg)}
.opt[aria-pressed="true"]{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.none{margin-top:8px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.none[aria-pressed="true"]{border-color:var(--no);color:var(--no);background:var(--no-soft)}
.miss{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:14px}
#out{position:fixed;inset:auto 16px 16px 16px;max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#out textarea{width:100%;height:120px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
#out .row{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}#out button{font:inherit;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
#out .prim{background:var(--accent);color:#fff;border-color:var(--accent)}
</style></head><body>
<header><h1>Case photo review</h1><p>Tap the photo you want for each disease, or "No photo". All photos are free-licence images from Wikimedia Commons; credits will show in the app.</p>
<div class="bar"><span id="count"></span><select id="flt"><option value="all">Show all</option><option value="pending">Show not yet decided</option></select><button class="prim" id="send">Copy my choices</button></div></header>
<main id="list"></main>
<div id="out" hidden><b>Paste this into the chat with Claude</b><textarea id="code" readonly></textarea><div class="row"><button id="close">Close</button><button class="prim" id="copy">Copy</button></div></div>

jpg", "th": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Candidiasis_%283679907460%29.jpg/330px-Candidiasis_%283679907460%29.jpg", "page": "https://commons.wikimedia.org/wiki/File:Candidiasis_%283679907460%29.jpg"}]}], MISSING=["Acrokeratosis verruciformis of Hopf", "Corn (clavus)", "Dowling–Degos disease", "Freckles (ephelides)", "Idiopathic guttate hypomelanosis", "Keratolysis exfoliativa", "Lichen planus pigmentosus", "Lichen spinulosus", "Linear and whorled nevoid hypermelanosis", "Nevus comedonicus", "Pityriasis alba", "Pyoderma faciale (rosacea fulminans)", "Reticulate acropigmentation of Kitamura", "Tattoo & tattoo reactions", "Yellow nail syndrome"];
let pick={}; try{pick=JSON.parse(localStorage.getItem('dd-picks')||'{}')}catch{}
const save=()=>{try{localStorage.setItem('dd-picks',JSON.stringify(pick))}catch{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 const f=document.getElementById('flt').value;
 const L=document.getElementById('list');
 L.innerHTML=DATA.filter(c=>f==='all'||!(c.id in pick)).map(c=>{const p=pick[c.id];const cls=p===undefined?'':p==='x'?'done-none':'done-pick';
  return `<section class="case ${cls}" id="${c.id}"><h2>${esc(c.n)}<span class="st">${p===undefined?'Not decided':p==='x'?'No photo':'Photo '+p}</span></h2>
  <div class="opts">${c.c.map((o,i)=>{const k='AB'[i];return `<button class="opt" data-id="${c.id}" data-k="${k}" aria-pressed="${p===k}"><img loading="lazy" src="${o.th}" onerror="this.onerror=null;this.src='${o.orig}'" alt="${esc(c.n)} option ${k}"><span class="cap"><b>Photo ${k}</b> · ${esc(o.l)} · ${esc(o.a)}</span></button>`}).join('')}</div>
  <button class="none" data-id="${c.id}" data-k="x" aria-pressed="${p==='x'}">No photo for this disease</button></section>`}).join('')+
  (f==='all'?`<div class="miss"><b>No free photo found for:</b> ${MISSING.map(esc).join(', ')}.</div>`:'');
 const n=Object.keys(pick).length; document.getElementById('count').textContent=`${n} of ${DATA.length} decided`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;pick[b.dataset.id]=b.dataset.k;save();const y=scrollY;render();scrollTo(0,y);});
document.getElementById('flt').onchange=render;
document.getElementById('send').onclick=()=>{const s=DATA.map((c,i)=>(i+1)+(pick[c.id]||'?')).join(' ');document.getElementById('code').value='PHOTOS '+s;document.getElementById('out').hidden=false;};
document.getElementById('close').onclick=()=>document.getElementById('out').hidden=true;
document.getElementById('copy').onclick=async()=>{const t=document.getElementById('code');try{await navigator.clipboard.writeText(t.value);document.getElementById('copy').textContent='Copied';}catch{t.select();}};
render();
</script></body></html>
