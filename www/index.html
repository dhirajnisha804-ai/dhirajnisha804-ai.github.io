<title>DermRx Desk</title>

<style>
/* Layout: one-column clinic desk — sticky header, view body, 5-tab bottom bar, full-screen sheets for consultation and editors, a second layer for pickers. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --sunk:#eceeea; --line:#d9ddd6;
  --fg:#1d2420; --muted:#5f6a63; --accent:#2f6b5a; --accent-ink:#ffffff; --accent-soft:#e1eee8;
  --rose:#a5476a; --rose-soft:#f6e4ea; --warn:#9a5b10; --warn-soft:#fbefdc; --danger:#b3261e; --danger-soft:#fbe5e3;
  --paper:#fffdf8; --paper-ink:#1f2421;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --sunk:#222a26; --line:#313b36;
  --fg:#e6ebe7; --muted:#9aa69f; --accent:#7cc3ab; --accent-ink:#0f1b16; --accent-soft:#1f332b;
  --rose:#e48aab; --rose-soft:#3a2129; --warn:#e8b062; --warn-soft:#352812; --danger:#f2867e; --danger-soft:#3a1c1a;
  --paper:#1d2320; --paper-ink:#e6ebe7; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --sunk:#222a26; --line:#313b36;
  --fg:#e6ebe7; --muted:#9aa69f; --accent:#7cc3ab; --accent-ink:#0f1b16; --accent-soft:#1f332b;
  --rose:#e48aab; --rose-soft:#3a2129; --warn:#e8b062; --warn-soft:#352812; --danger:#f2867e; --danger-soft:#3a1c1a;
  --paper:#1d2320; --paper-ink:#e6ebe7; color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brandmark{display:flex;flex-direction:column;min-width:0;flex:1}
.brandmark h1{font-family:var(--f-display);font-weight:650;font-size:20px;margin:0;letter-spacing:-.01em}
.brandmark h1 b{color:var(--rose);font-weight:650}
.brandmark small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--fg)}
.iconbtn svg{width:18px;height:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.viewhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:18px;flex-wrap:wrap}
.viewhead h2{font-family:var(--f-display);font-weight:650;font-size:24px;margin:0;text-wrap:balance}
.viewhead p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;color:var(--fg);text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.big{padding:14px 18px;font-size:16px;border-radius:14px;width:100%}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:default}
.search{margin-top:14px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:11px 0;width:100%;outline:none;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible;padding-top:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.add{border-style:dashed}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;margin-top:14px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.group{margin-top:20px}
.group h3,.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--fg)}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .aside{text-align:right;flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);font-weight:700;font-size:14px;flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .prod{font-weight:650;font-size:15px;line-height:1.3}
.card .brandn{color:var(--muted);font-size:13px}
.comp{font-size:12.5px;color:var(--muted);line-height:1.35}
.price{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.price small{font-family:var(--f-body);color:var(--muted);font-size:11.5px;display:block;max-width:120px;white-space:normal}
.star{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;color:var(--line);padding:2px}
.star[aria-pressed="true"]{color:#d99a1e}
.mr{display:flex;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-size:13px}
.mr .who{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .num{font-family:var(--f-mono);font-size:12.5px;user-select:all}
.mr.none{color:var(--warn)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted);margin-top:14px}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:18px;font-weight:650;margin-bottom:4px}
.empty .btn{margin-top:12px}
.banner{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13.5px}
/* Home */
.hello{padding-top:18px}
.hello h2{font-family:var(--f-display);font-weight:650;font-size:26px;margin:0}
.hello p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;color:var(--fg)}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:650;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:13px;color:var(--muted)}
.stat .d b{color:var(--fg)}
.stat.alert .v{color:var(--danger)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.quick button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--fg);text-align:left}
.quick svg{width:20px;height:20px;color:var(--accent);flex:none}
/* Patient profile */
.phead{padding-top:16px;display:flex;gap:14px;align-items:center}
.phead .avatar{width:54px;height:54px;font-size:20px}
.phead h2{font-family:var(--f-display);font-size:23px;margin:0;font-weight:650}
.phead .meta{color:var(--muted);font-size:13.5px}
.tabsline{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:14px;scrollbar-width:none}
.tabsline::-webkit-scrollbar{display:none}
.tabsline button{border:0;background:none;padding:10px 10px 9px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabsline button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap;min-width:0}
.tl{position:relative;margin-top:6px}
.tl .it{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--fg)}
.tl .it:first-child{border-top:0}
.tl .date{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.tl .t{font-weight:600}
.tl .s{font-size:13px;color:var(--muted)}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.l2{z-index:30}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet .bar .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.sheet .bar h2{flex:1;margin:0;font-family:var(--f-display);font-size:18px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{max-width:760px;margin:0 auto;padding:16px 16px 90px}
.sheet .foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.sheet .foot .in{max-width:760px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field select,.field textarea,.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.section > .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec > summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;font-weight:650}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .ltr{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
details.sec > summary .sum{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted);max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sec > summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;flex:none;transition:transform .15s}
details.sec[open] > summary::after{transform:rotate(-135deg)}
details.sec > .in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.sub{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:-6px}
.rxitem{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.rxitem:first-child{border-top:0;padding-top:2px}
.rxitem .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px}
.rxitem .d{font-weight:650}
.rxitem .g{font-size:12.5px;color:var(--muted)}
.rxitem .sig{font-size:13.5px}
.rxitem .ctl{display:flex;gap:2px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.mini svg{width:15px;height:15px}
.mini:hover{color:var(--fg)}
.mini.del:hover{color:var(--danger)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.x:hover{background:var(--sunk);color:var(--danger)}
.x svg{width:16px;height:16px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.item .hd{display:flex;align-items:center;gap:8px}
.item .hd b{flex:1;min-width:0}
.item input,.item select,.item textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.allergy{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 11px;font-size:13.5px;font-weight:600}
.pickres{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pick{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer;color:var(--fg);width:100%}
.pick .main{flex:1;min-width:0}
.pick .t{font-weight:650;display:block}
.pick .s{font-size:12.5px;color:var(--muted);display:block}
.qb{display:flex;gap:6px;flex-wrap:wrap}
/* Paper */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:22px 20px}
.paper .lh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:10px}
.paper .lh .dr{font-family:var(--f-display);font-size:20px;font-weight:650}
.paper .lh .q{font-size:13px;color:var(--muted)}
.paper .lh .addr{font-size:12.5px;color:var(--muted);text-align:right;max-width:46ch}
.paper .pt{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.paper .dx{padding:10px 0 4px;font-size:14px}
.paper .rxsym{font-family:var(--f-display);font-size:30px;font-weight:650;color:var(--accent);line-height:1;margin:10px 0 4px}
.paper ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.paper li .d{font-weight:650}
.paper li .g{color:var(--muted);font-size:13.5px}
.paper h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:16px 0 6px}
.paper .adv{white-space:pre-wrap;font-size:14px}
.paper ul.adv{white-space:normal;margin:0;padding-left:18px}
.paper .sig{margin-top:28px;text-align:right;font-size:13px;color:var(--muted)}
.paper .sig img{max-height:56px;max-width:180px;display:block;margin-left:auto}
.paper .sig b{display:block;color:var(--paper-ink);font-size:14px}
.privnote{margin-top:12px;padding:12px;background:var(--sunk);border-radius:8px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ph{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.ph img,.ph .ph-ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--sunk);display:block;cursor:zoom-in}
.ph .ph-ph{display:grid;place-items:center;font-size:12px;color:var(--muted);cursor:default;text-align:center;padding:6px}
.ph input,.ph select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;width:100%;min-width:0}
.ph .x{position:absolute;top:4px;right:4px;background:var(--surface);width:28px;height:28px;border:1px solid var(--line)}
.ph .cap{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebtn{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,12,11,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:6px}
.lightbox .lb-cap{color:#e9ece9;margin-top:10px;font-size:14px;text-align:center}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#fff;color:#111;border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.offscreen{position:fixed;left:-10000px;top:0;width:760px;background:#fff}
/* Case formats */
.case-head{padding-top:2px}
.case-title{font-family:var(--f-display);font-weight:650;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.case-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin:12px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--accent);flex:none}
.legend i.o{background:transparent;border:1.5px solid var(--muted)}
.csec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;margin-top:12px}
.csec h3{font-family:var(--f-display);font-weight:650;font-size:17px;margin:0 0 6px;color:var(--accent)}
.clist{margin:0;padding-left:20px}
.clist li{margin:5px 0;padding-left:2px}
.clist li::marker{color:var(--accent)}
.clist li.add{list-style-type:circle;color:var(--muted)}
.clist li.add::marker{color:var(--muted)}
.casenav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* Rx table: medicine · brand available · cost */
.rxt{display:flex;flex-direction:column}
.rxt-head{display:none}
.rxt-row{display:grid;grid-template-columns:22px 1fr auto;gap:6px 8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.rxt-head+.rxt-row{border-top:0}
.rxt-row .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px;grid-row:1}
.rxt-row .med{grid-column:2;grid-row:1;min-width:0;display:flex;flex-direction:column}
.rxt-row .med .d{font-weight:650}
.rxt-row .med .g,.rxt-row .med .sig{font-size:12.5px;color:var(--muted)}
.rxt-row .ctl{grid-column:3;grid-row:1;display:flex;gap:2px}
.rxt-row .rb{grid-column:2;grid-row:2}
.rxt-row .rc{grid-column:3;grid-row:2;width:92px}
.rxt-row .inp{padding:8px 9px;font-size:14px}
.rxt-total{text-align:right;font-size:13.5px;color:var(--muted);padding-top:8px;border-top:1px solid var(--line)}
.rxt-total b{color:var(--fg);font-family:var(--f-mono)}
@media (min-width:640px){
  .rxt-head{display:grid;grid-template-columns:22px minmax(0,1.4fr) minmax(0,1fr) 92px 70px;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
  .rxt-row{grid-template-columns:22px minmax(0,1.4fr) minmax(0,1fr) 92px 70px;align-items:center}
  .rxt-head+.rxt-row{border-top:0}
  .rxt-row .rb{grid-column:3;grid-row:1}.rxt-row .rc{grid-column:4;grid-row:1;width:auto}.rxt-row .ctl{grid-column:5;justify-content:flex-end}
}
.addrow .t{color:var(--accent)!important}
@media (min-width:700px){.viewhead h2,.hello h2{font-size:28px}.stats{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Colour layer ===== */
:root{
  --bg:#fbf5f7; --sunk:#f3e9ee; --line:#ead9e1; --accent:#b0336a; --accent-soft:#fbe3ee;
  --grad:linear-gradient(120deg,#7b2a6e 0%,#b0336a 48%,#ef7a4f 100%); --gradtext:linear-gradient(100deg,#7b2a6e,#b0336a 55%,#e0602f); --kink:#fff;
  --c0:#c2185b; --c0s:#fde4ee; --c1:#6d3fc0; --c1s:#ece4fb; --c2:#00897b; --c2s:#dcf3ef; --c3:#b26a00; --c3s:#fdf0d8;
  --c4:#1e66c8; --c4s:#e1ecfb; --c5:#2e8b3a; --c5s:#e2f4e4; --c6:#d84a1b; --c6s:#fde6dc; --c7:#9c27b0; --c7s:#f6e2f9;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151216; --surface:#1f1a20; --sunk:#29222a; --line:#3a2f3a; --accent:#f27aa9; --accent-soft:#3b2130;
  --grad:linear-gradient(120deg,#4c1a45 0%,#7d2450 50%,#9c4a2e 100%); --gradtext:linear-gradient(100deg,#e7a6e0,#f48fb1 55%,#ffb38a); --kink:#1f1a20;
  --c0:#f48fb1; --c0s:#3d1f2b; --c1:#b39ddb; --c1s:#2c2440; --c2:#5fd3c4; --c2s:#16332f; --c3:#f0b75e; --c3s:#3a2c14;
  --c4:#8ab4f8; --c4s:#1b2a40; --c5:#81c995; --c5s:#1b3221; --c6:#ff9e7a; --c6s:#3d2219; --c7:#e1a0f0; --c7s:#38203d;}}
:root[data-theme="dark"]{
  --bg:#151216; --surface:#1f1a20; --sunk:#29222a; --line:#3a2f3a; --accent:#f27aa9; --accent-soft:#3b2130;
  --grad:linear-gradient(120deg,#4c1a45 0%,#7d2450 50%,#9c4a2e 100%); --gradtext:linear-gradient(100deg,#e7a6e0,#f48fb1 55%,#ffb38a); --kink:#1f1a20;
  --c0:#f48fb1; --c0s:#3d1f2b; --c1:#b39ddb; --c1s:#2c2440; --c2:#5fd3c4; --c2s:#16332f; --c3:#f0b75e; --c3s:#3a2c14;
  --c4:#8ab4f8; --c4s:#1b2a40; --c5:#81c995; --c5s:#1b3221; --c6:#ff9e7a; --c6s:#3d2219; --c7:#e1a0f0; --c7s:#38203d;}
.c0{--h:var(--c0);--hs:var(--c0s)}.c1{--h:var(--c1);--hs:var(--c1s)}.c2{--h:var(--c2);--hs:var(--c2s)}.c3{--h:var(--c3);--hs:var(--c3s)}
.c4{--h:var(--c4);--hs:var(--c4s)}.c5{--h:var(--c5);--hs:var(--c5s)}.c6{--h:var(--c6);--hs:var(--c6s)}.c7{--h:var(--c7);--hs:var(--c7s)}
header.top{background:var(--grad);border-bottom:0;box-shadow:0 2px 12px rgba(123,42,110,.25)}
header.top .brandmark h1,header.top .brandmark h1 b{color:#fff}
header.top .brandmark h1 b{color:#ffd3a8}
header.top .brandmark small{color:rgba(255,255,255,.82)}
header.top .iconbtn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.viewhead h2{background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent}
.viewhead{position:relative;padding-bottom:4px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(176,51,106,.28)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.hc{border-color:color-mix(in srgb,var(--h) 35%,var(--line));color:var(--h);background:var(--hs)}
.chip.hc[aria-pressed="true"]{background:var(--h);color:#fff;border-color:var(--h)}
.search{border-width:1.5px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* tabs */
nav.tabs .t1{--tc:var(--c0);--ts:var(--c0s)} nav.tabs .t2{--tc:var(--c4);--ts:var(--c4s)} nav.tabs .t3{--tc:var(--c2);--ts:var(--c2s)} nav.tabs .t4{--tc:var(--c1);--ts:var(--c1s)} nav.tabs .t5{--tc:var(--c3);--ts:var(--c3s)}
nav.tabs button svg{padding:3px 12px;width:46px;height:28px;border-radius:999px;box-sizing:border-box;transition:background .15s}
nav.tabs button[aria-selected="true"]{color:var(--tc)}
nav.tabs button[aria-selected="true"] svg{background:var(--ts)}
/* groups */
details.grp{border-left:5px solid var(--h);overflow:hidden}
details.grp > summary .gdot{width:10px;height:10px;border-radius:50%;background:var(--h);flex:none}
details.grp[open] > summary{background:var(--hs);color:var(--h)}
details.grp .row .t{color:var(--fg)}
details.grp .addrow .t{color:var(--h)!important}
/* avatars */
.avatar.c0,.avatar.c1,.avatar.c2,.avatar.c3,.avatar.c4,.avatar.c5,.avatar.c6,.avatar.c7{background:var(--hs);color:var(--h)}
/* medicine cards */
.mcard{border-top:4px solid var(--h)}
.mcard .pill.cat{background:var(--hs);color:var(--h)}
.mcard .price{color:var(--h);font-weight:500}
/* case detail sections */
.csec{border-left:5px solid var(--sc);background:linear-gradient(90deg,var(--ss),var(--surface) 55%)}
.csec h3{color:var(--sc);display:flex;align-items:center;gap:8px}
.csec .kico{width:24px;height:24px;border-radius:50%;background:var(--sc);color:var(--kink);display:grid;place-items:center;font-family:var(--f-body);font-size:12.5px;font-weight:700;flex:none}
.csec .clist li::marker{color:var(--sc)}
.csec .clist li.add::marker{color:var(--muted)}
.k-cc{--sc:var(--c0);--ss:var(--c0s)} .k-hx{--sc:var(--c1);--ss:var(--c1s)} .k-ddx{--sc:var(--c3);--ss:var(--c3s)} .k-ex{--sc:var(--c2);--ss:var(--c2s)} .k-fmt{--sc:var(--c4);--ss:var(--c4s)}
.case-title{background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent}
/* patient page sections */
.sheet .section{border-top:3px solid var(--accent-soft)}
.sheet .section .field label,.sheet .section > .lbl{color:var(--accent)}
.rxt-head{color:var(--accent)}
.rxt-total b{color:var(--accent)}
.sheet .bar{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.sheet .bar h2{color:var(--accent)}

/* ===== Severity scores ===== */
.pnl{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.pnl-bg{position:absolute;inset:0;background:rgba(30,12,28,.45)}
.pnl-box{position:relative;background:var(--bg);width:100%;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 34px rgba(0,0,0,.28);animation:pnlUp .22s ease-out;overflow:hidden}
.pnl-grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.pnl-head{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;border-bottom:1px solid var(--line);flex:none}
.pnl-head h2{flex:1;margin:0;font-family:var(--f-display);font-size:19px;font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent}
.pnl-body{overflow-y:auto;padding:14px 16px 20px;flex:1;min-height:0;overscroll-behavior:contain}
.pnl-foot{border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);flex:none;display:flex;flex-direction:column;gap:8px}
@keyframes pnlUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pnlIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:760px){.pnl{justify-content:flex-end;align-items:stretch}.pnl-box{width:470px;max-height:none;height:100%;border-radius:20px 0 0 20px;animation:pnlIn .22s ease-out;box-shadow:-10px 0 34px rgba(0,0,0,.22)}.pnl-grab{display:none}.pnl-head{padding-top:14px}}
.calc-full{margin:0 0 4px;color:var(--muted);font-size:13.5px}
.howto{background:var(--c4s);border:1px solid color-mix(in srgb,var(--c4) 30%,transparent);border-radius:10px;padding:8px 12px;margin:8px 0 4px}
.howto summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--c4);list-style:none;display:flex;align-items:center;gap:6px}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"ⓘ";font-size:14px}
.howto summary::after{content:"▾";margin-left:auto;transition:transform .15s}
.howto:not([open]) summary::after{transform:rotate(-90deg)}
.howto ol{margin:6px 0 2px;padding-left:18px;font-size:13px;line-height:1.45;color:var(--fg)}
.howto li{margin:3px 0}.howto li::marker{color:var(--c4);font-weight:700}

.sreg{border:1px solid var(--line);border-left:4px solid var(--h);border-radius:10px;padding:10px 12px;background:var(--surface);margin-top:10px}
.sreg-h{display:flex;align-items:baseline;gap:8px;font-weight:650;color:var(--h)}
.sreg-h small{color:var(--muted);font-weight:500;font-size:12px}
.sreg-v{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--fg)}
.sreg-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:8px}
.sreg-h+.sreg-g{margin-top:8px}.sreg > .sreg-g:first-child{margin-top:0}
.sfld{display:flex;flex-direction:column;gap:3px;min-width:0}
.sfld span{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.sfld .inp{padding:8px 9px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;width:100%}
.sblk{margin-top:14px}.sblk:first-child{margin-top:4px}
.sblk-h{font-family:var(--f-display);font-weight:650;font-size:16px;color:var(--accent)}
.sblk-h small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.hint .seg{margin:6px 0 0;display:inline-grid}
.uas{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.uas-r{display:grid;grid-template-columns:54px 1fr 1fr 28px;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.uas-r .inp{padding:7px 8px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.uas-v{font-family:var(--f-mono);text-align:right;color:var(--accent)}
.iga{display:flex;flex-direction:column;gap:8px}
.iga-o{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;cursor:pointer;color:var(--fg)}
.iga-o b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--hs);color:var(--h);font-size:15px;flex:none}
.iga-o strong{display:block}.iga-o small{color:var(--muted);font-size:12.5px}
.iga-o[aria-pressed="true"]{border-color:var(--h);background:var(--hs)}
.iga-o[aria-pressed="true"] b{background:var(--h);color:var(--kink)}
.sres{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sres-v{display:flex;align-items:baseline;gap:6px}
.sres-v b{font-family:var(--f-display);font-size:32px;line-height:1;font-weight:650;background:var(--gradtext);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.sres-v span{color:var(--muted);font-size:13px}
.sres-act{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.sres-act .sfld:not([style]){width:150px}
.ssug{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ssug > span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.gdot{width:10px;height:10px;border-radius:50%;flex:none}
.viewhead .btn.sm{align-self:flex-end}
.scard{border:1px solid var(--line);border-top:4px solid var(--h);border-radius:12px;padding:12px;margin-top:10px;background:var(--surface)}
.scard-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scard-n{font-family:var(--f-display);font-weight:650;font-size:17px;color:var(--h);margin-bottom:4px}
.scard-v{text-align:right}.scard-v b{font-family:var(--f-display);font-size:28px;line-height:1;display:block;font-variant-numeric:tabular-nums}.scard-v small{color:var(--muted);font-size:12px}
.scard-d{font-size:13.5px;color:var(--muted);margin-top:8px}.scard-d b{color:var(--fg)}
.scard-d b.imp{color:var(--c5)}.scard-d b.wor{color:var(--danger)}
.rbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rbadge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted)}
.rbadge.on{border:1.5px solid var(--c5);background:var(--c5s);color:var(--c5)}
.trendwrap{position:relative;margin-top:10px;max-width:480px}
.trend{width:100%;height:auto;display:block;overflow:visible}
.trend .tg{stroke:var(--line);stroke-width:1}
.trend .tb{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.trend .tl{fill:none;stroke:var(--h);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.trend .tp{fill:var(--h);stroke:var(--surface);stroke-width:2}
.trend .th{fill:transparent;cursor:pointer;outline:none}
.trend .ta{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.trend .tv{fill:var(--fg);font-size:11px;font-weight:700;font-family:var(--f-body)}
.ttip{position:absolute;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;pointer-events:none;z-index:2}
.slist{margin-top:8px;border-top:1px solid var(--line)}
.slist-r{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.slist-r span:first-child{color:var(--muted);flex:1}
.slist-r b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.slist-r .x{width:28px;height:28px}.slist-r .x.armed{background:var(--danger-soft);color:var(--danger)}

/* ===== Drug safety ===== */
.dsbtn{color:var(--c6);border-color:color-mix(in srgb,var(--c6) 40%,var(--line));background:var(--c6s)}
.dsbanner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.45}
.dsbanner b{color:inherit}
.np{font-size:10.5px;letter-spacing:.04em;background:var(--sunk);color:var(--muted);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.dsf{border:1px solid var(--line);border-left:5px solid var(--lvc);border-radius:10px;background:var(--surface);margin-top:8px;overflow:hidden}
.dsf.lv-warn{--lvc:var(--c3);--lvs:var(--c3s)} .dsf.lv-danger{--lvc:var(--danger);--lvs:var(--danger-soft)}
.dsf > summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:10px 12px}
.dsf > summary::-webkit-details-marker{display:none}
.dsf > summary::after{content:"▾";color:var(--muted);margin-left:auto;padding-left:6px;transition:transform .15s}
.dsf:not([open]) > summary::after{transform:rotate(-90deg)}
.dsf[open] > summary{background:var(--lvs)}
.dsf-dot{width:10px;height:10px;border-radius:50%;background:var(--lvc);flex:none;margin-top:6px}
.dsf-m{min-width:0;flex:1}
.dsf-m b{font-weight:700}.dsf-m small{color:var(--muted);font-weight:500}
.dsf-s{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsf[open] .dsf-s{white-space:normal}
.dsf-s em{font-style:normal;font-weight:700;color:var(--lvc)}
.dsf-b{padding:4px 12px 12px}
.dsal{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column;gap:5px}
.dsal li{padding:6px 10px;border-radius:8px;font-size:13.5px;font-weight:600}
.dsal .al-danger{background:var(--danger-soft);color:var(--danger)}
.dsal .al-danger::before{content:"⛔ "}
.dsal .al-warn{background:var(--warn-soft);color:var(--warn)}
.dsal .al-warn::before{content:"⚠ "}
.dsal .al-info{background:var(--c4s);color:var(--c4);font-weight:500}
.dsal .al-info::before{content:"ⓘ "}
.dsx{margin-top:10px}

chycardia, poikilothermia, hypotension, tachypnoea)","Erythema and scaling >90% BSA: distribution over face, neck, trunk, limbs; amount (minimal/copious), colour (white/brown), adherent or shedding","Acute: large crusted scales; chronic: small dry scales","Flexural accentuation, oozing, raw areas","Tenderness (TEN, secondary syphilis); Nikolsky's sign (pemphigus foliaceus)","Sparing of nose and paranasal area (Pavithran's sign); sparing of abdominal folds — deck-chair sign (papuloerythroderma of Ofuji); islands of sparing (PRP)","Clues to cause: psoriatic nails, PRP keratoderma, flexural lichenification, cornflake scales with mousy odour (pemphigus foliaceus), hyperkeratotic crusts (Norwegian scabies)","Eyes: ectropion, entropion; oral and genital mucosa","Hair loss (scalp, axillary, pubic); palms and soles (keratoderma, fissures)","Nails: thickening, ridging, Beau's lines, shoreline nails (drug-induced), shiny ebonised nails","Lymph nodes (dermatopathic vs malignant, secondary syphilis); gynaecomastia, testicular sensation","Systemic: CVS (raised JVP, high-output failure), RS, abdomen (hepatosplenomegaly), CNS"],"fmt":["Erythroderma secondary to ___ with ___ metabolic complications"]},{"n":"Genital ulcer disease","g":"Sexually transmitted infections","t":"Long case","cc":["Genital sore / raw area since ___","Groin swelling since ___","Urethral / vaginal discharge since ___","Urinary complaints","Skin rash, joint pains, fever, red eye (associated)"],"hx":["Genital sore: number, site, size, pain, discharge, colour; how it started (papule, vesicle, pustule); preceding fluid-filled lesions; change in size/morphology","Preceding drug intake (FDE); application of medicines; trauma","Mucosal involvement: oral, rectal, conjunctival","Groin swelling: unilateral/bilateral, number, size, pain, overlying skin, discharge, associated ulcer","Urethral discharge: amount, colour, smell, blood, threads, relation to intercourse; vaginal discharge: amount, colour, odour, itching, relation to menses","Exposure: first and last exposure (protected or not; sex worker or known partner); peno-vaginal, oral, anal; condom use and breakage; multiple partners; days since last exposure","Systemic: fever, arthralgia, myalgia, eye complaints, abdominal pain, headache, weight loss, loss of appetite, generalised itching","Complications: inability to retract prepuce, swelling of penis/scrotum, bleeding, non-healing ulcer, foul black discharge (phagedena)","Clues — Syphilis: painless ulcer, shotty nodes; rash, oral lesions (secondary); neurological/CVS symptoms (tertiary)","Clues — Chancroid: painful, multiple ulcers, extragenital lesions, painful bubo","Clues — LGV: swelling of scrotum/vulva/leg/groin, ribbon-like stools, rectal fissures/ulcers, eye complaints","Clues — Donovanosis: beefy red, chronic, painless ulcer","Itching in groin with crawling sensation (scabies, pediculosis)","Past STD: type, treated or not; known HIV status; weight loss, chronic diarrhoea, recurrent URTI, herpes zoster, TB","IV drug use, blood transfusion, needle-prick, jaundice (HBV)","TB/DM/HT/IHD/asthma/drug allergy","Sexual history: marital status, extramarital contact, number of partners, contraception","Females: menstrual irregularity, intermenstrual bleeding, dyspareunia; obstetric history (abortions, stillbirths, infertility)","Spouse: similar complaints, blood transfusion, obstetric history; family itching (scabies)"],"ddx":["Primary syphilis (painless, indurated, clean base; bilateral shotty nodes)","Chancroid (painful, soft, ragged undermined edge; unilateral tender suppurative bubo)","Genital herpes (grouped vesicles, painful erosions, recurrent)","Lymphogranuloma venereum (transient ulcer, then groove sign / bubo)","Donovanosis (beefy-red, painless, bleeds on touch, pseudobubo)","Non-STD: fixed drug eruption, squamous cell carcinoma, Behçet's disease, Crohn's disease, trauma","Donovanosis mimics: SCC, amoebiasis, TB, deep fungal infection, pyoderma vegetans / gangrenosum"], plications — men: pain or swelling of testis (epididymitis), perineal pain (prostatitis), phimosis/paraphimosis, poor stream (stricture, 'watering-can perineum'); women: lower abdominal pain, fever (PID / salpingitis), painful labial swelling (Bartholinitis), infertility","Disseminated infection: fever, joint pains, painful tendons, pustules on hands/feet (arthritis–dermatitis syndrome); right upper abdominal pain (Fitz-Hugh–Curtis)","Risk factors for dissemination: menstruation, complement (C5–C9) deficiency, SLE","Red sticky eyes (gonococcal ophthalmia)","Pregnancy (abortion, PROM, preterm delivery, ophthalmia neonatorum)","In children: sexual abuse is the commonest cause","Previous STI and treatment; antibiotics taken; partner symptoms and treatment"],"ddx":["Non-gonococcal urethritis: Chlamydia, Ureaplasma, Mycoplasma genitalium, Trichomonas, Gardnerella, HSV, adenovirus, enteric bacteria","Trauma, foreign body, stricture","Intra-urethral ulcer: chancre, chancroid, herpes","Benign or malignant neoplasm","Tuberculosis (rare)"],"ex":["Urethral meatus: discharge (colour, amount, consistency), meatal redness/oedema; milk the urethra if no discharge seen","Retract prepuce: balanoposthitis, phimosis/paraphimosis","Inguinal lymph nodes","Scrotum: epididymis and testis tenderness/swelling; per-rectal prostate examination when indicated","Women: speculum — mucopurulent endocervical discharge (yellow swab sign), friable cervix; Bartholin's gland swelling with pus on pressure; bimanual exam for adnexal / cervical motion tenderness","Perianal / proctoscopy for rectal discharge; throat","Skin: acral haemorrhagic pustules, tenosynovitis, swollen joints (DGI); eyes: purulent conjunctivitis","Look for other STIs (ulcers, warts, rash of syphilis)"]},{"n":"Hansen's disease (leprosy)","g":"Leprosy & mycobacterial","t":"Long case","cc":["Light-coloured patches since ___ (I / TT / BT)","Stuffiness of nose / sensation of ants crawling / glove-and-stocking anaesthesia / swelling of fe     const max=1600, k=Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.85));
  }catch{ return file; }
}
async function uploadFile(file){
  if(!S.assets){ toast("Uploads aren’t available in this view"); return null; }
  try{
    const blob = await shrinkImage(file);
    const res = await S.assets.upload(blob, blob.type ? undefined : {type:file.type||"application/pdf"});
    return {id:res.id, type:res.contentType};
  }catch(err){
    toast(err?.code==="too_large"?"That file is too large (max 20 MB)":err?.code==="quota_or_state"?"Storage is full. Delete old photos to add more.":err?.code==="unsupported_type"?"Use a JPG, PNG or PDF file":"Couldn’t upload. Try again.");
    return null;
  }
}

const CASES = (() => { try{ return JSON.parse(document.getElementById("casesData").textContent); }catch{ return []; } })();
CASES.forEach((c,i)=>{ c.i=i; c.hay=[c.n,c.g,c.t,...(c.cc||[]),...(c.hx||[]),...(c.ddx||[]),...(c.ex||[])].join(" ").toLowerCase(); });
const CASE_SECS=[["cc","Chief complaints"],["hx","History to ask"],["ddx","Differentials"],["ex","Relevant examination findings"],["fmt","How to present the diagnosis"]];
const isAddedLine = s => /^\+ /.test(s);
const cleanLine = s => String(s).replace(/^\+ /,"");
const caseKind = c => c.t==="Long case" ? "Long case" : c.t==="Short case" ? "Short case" : "Added";
function searchCases(q, filter="All"){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);
  let arr=CASES.filter(c=>filter==="All"||caseKind(c)===filter);
  if(words.length){
    arr=arr.filter(c=>words.every(w=>c.hay.includes(w)));
    const ql=words.join(" "); const nm=c=>{ const n=c.n.toLowerCase(); return n===ql?0 : n.startsWith(ql)?1 : n.split(/[^a-z]+/).some(x=>x.startsWith(words[0]))&&words.every(w=>n.includes(w))?2 : words.every(w=>n.includes(w))?3 : 4; };
    arr.sort((a,b)=>nm(a)-nm(b)||a.n.localeCompare(b.n));
  }
  return arr;
}
function caseDetailHTML(c){
  const added = caseKind(c)==="Added";
  return `<div class="case-head"><h2 class="case-title">${esc(c.n)}</h2>
    <div class="case-meta"><span class="pill">${esc(c.g)}</span><span class="pill ${c.t==="Long case"?"rose":added?"warn":""}">${esc(added?"Not in DYP guide":c.t)}</span></div></div>
    ${scoreSuggestHTML(c.n)}
    <p class="hint legend"><span><i></i>From DYP survival guide</span><span><i class="o"></i>Added from general dermatology knowledge — cross-check</span></p>
    ${CASE_SECS.filter(([k])=>(c[k]||[]).length).map(([k,l])=>`<section class="csec k-${k}"><h3><span class="kico">${({cc:"1",hx:"2",ddx:"3",ex:"4",fmt:"✓"})[k]}</span>${esc(l)}</h3><ul class="clist">${c[k].map(s=>`<li class="${isAddedLine(s)?"add":""}">${esc(cleanLine(s))}</li>`).join("")}</ul></section>`).join("")}`;
}
function caseRowsHTML(arr, grouped, open){
  const row = c => `<button class="row" data-case="${c.i}"><span class="main"><span class="t">${esc(c.n)}</span><span class="s">${esc(cleanLine((c.cc||[])[0]||""))}</span></span><span class="aside">${c.t==="Long case"?`<span class="pill rose">Long</span>`:caseKind(c)==="Added"?`<span class="pill warn">Added</span>`:""}</span></button>`;
  if(!grouped) return `<div class="list" style="margin-top:10px">${arr.map(row).join("")}</div>`;
  const by={}; arr.forEach(c=>(by[c.g] ||= []).push(c));
  return Object.keys(by).sort().map(g=>`<details class="sec grp ${hueOf(g)}" style="margin-top:10px" ${open?"open":""}><summary><span class="gdot"></span>${esc(g)}<span class="sum">${by[g].length}</span></summary><div class="in" style="padding:0"><div class="list" style="border:0;border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r)">${by[g].sort((a,b)=>a.n.localeCompare(b.n)).map(row).join("")}</div></div></details>`).join("");
}

function assetsOfVisit(v){ return [...(v.photos||[]).map(x=>x.id), ...(v.derm||[]).map(d=>d.photoId), ...(v.inv||[]).map(x=>x.reportId)].filter(Boolean); }

/* ---------- PATIENT RECORD (single page) ---------- */

  const isNew = !p;

    name:p?.name||"", age:p?.age||"", sex:p?.sex||"", date:v?.date||today(),
    complaint: v ? [v.complaint, v.duration?"× "+v.duration:""].filter(Boolean).join(" ") : "",

      <div class="field" style="grid-column:1/-1"><label for="ppCom">Comorbidities</label><input id="ppCom" value="${esc(p?.comorb||"")}" placeholder="e.g. Diabetes, hypertension, hepatitis B, G6PD deficiency"></div>

  const safeCtx = () => ({age:$("#ppAge").value, sex:$("#ppSex").value, weight:$("#ppWt").value, preg:$("#ppSex").value==="Male"?"":$("#ppPreg").value, comorb:$("#ppCom").value, meds:$("#ppMeds").value, history:$("#ppHx").value});
  const drawSafe = () => { const el=$("#ppSafeBody"); if(!el) return; const open=[...el.querySelectorAll("details[open]")].map(x=>x.dataset.k); el.innerHTML=safetyForRx(W.rx, safeCtx()); open.forEach(k=>el.querySelector(`details[data-k="${CSS.escape(k)}"]`)?.setAttribute("open","")); $("#ppPregF").hidden = $("#ppSex").value==="Male"; };
  const drawRx = () => { $("#ppRx").innerHTML = rxTableHTML(W.rx); drawSafe(); };
  wireRxTable($("#ppRx"), () => W.rx, drawRx); drawRx();
  ["#ppAge","#ppWt","#ppCom","#ppMeds","#ppHx"].forEach(sel=>$(sel).addEventListener("input", drawSafe));
  ["#ppSex","#ppPreg"].forEach(sel=>$(sel).addEventListener("change", drawSafe));
  $("#ppSafeBody").addEventListener("click", e=>{ const b=e.target.closest("[data-dsedit]"); if(b){ e.preventDefault(); e.stopPropagation(); openDsEditor(b.dataset.dsedit, null); } });
  $("#ppSafeAll").onclick = () => openDrugSafety();

  const doSave = async () => {

    const pidN = p?.id || newId("people");

    if(!(await save("people", pidN, pd))) return null;
    const vidN = v?.id || newId("visits");
    const {id:_v, ...vBase} = v||{};

    if(!(await save("visits", vidN, vd))) return null;

/* rx table shared by patient record and template editor: medicine · brand available · cost */
function rxTableHTML(list){
  if(!list.length) return `<p class="hint" style="margin:0">No medicines yet. Use a template or add a medicine.</p>`;
  const total = list.reduce((n,r)=>{ const c=parseFloat(String(r.cost??"").replace(/[^\d.]/g,"")); return n+(isNaN(c)?0:c); },0);
  return `<div class="rxt"><div class="rxt-head"><span></span><span>Medicine</span><span>Brand available</span><span>Cost (₹)</span><span></span></div>
  ${list.map((r,i)=>`<div class="rxt-row"><span class="n">${i+1}.</span><span class="med"><span class="d">${esc(r.drug)}</span>${r.generic?`<span class="g">${esc(r.generic)}</span>`:""}<span class="sig">${esc(sigOf(r))||'<span class="hint">Tap edit to add dose and timing</span>'}</span></span>
    <input class="inp rb" data-rxb="${i}" value="${esc(r.brand||"")}" placeholder="Brand available" aria-label="Brand available for ${esc(r.drug)}">
    <input class="inp rc" data-rxc="${i}" value="${esc(r.cost??"")}" placeholder="Cost ₹" inputmode="decimal" aria-label="Cost for ${esc(r.drug)}">
    <span class="ctl"><button class="mini" type="button" data-rxed="${i}" aria-label="Edit">${ICON.edit}</button><button class="mini del" type="button" data-rxrm="${i}" aria-label="Remove">${ICON.x}</button></span></div>`).join("")}
  ${total?`<div class="rxt-total">Approx. total <b>${rupee(Math.round(total))}</b></div>`:""}</div>`;
}
function wireRxTable(box, getList, redraw){
  box.addEventListener("click", e=>{
    const L=getList(); const b=e.target.closest("[data-rxed],[data-rxrm]"); if(!b) return;
    if(b.dataset.rxrm){ L.splice(+b.dataset.rxrm,1); redraw(); }
    else { const i=+b.dataset.rxed; openDrugDetails(L[i], item=>{ L[i]=item; redraw(); }); }
  });
  box.addEventListener("input", e=>{ const L=getList(); const ib=e.target.dataset.rxb, ic=e.target.dataset.rxc; if(ib!=null) L[+ib].brand=e.target.value; if(ic!=null) L[+ic].cost=e.target.value; });
  box.addEventListener("change", e=>{ if(e.target.dataset.rxc!=null) redraw(); });
}

/* ---------- medicine picker & drug details ---------- */
function brandSearch(q, skincareOnly){
  q=q.toLowerCase().trim(); const words=q.split(/\s+/).filter(Boolean);
  let arr=S.brands.filter(b=> skincareOnly ? SKINCARE.has(catOf(b)) : true);
  if(words.length) arr=arr.filter(b=>{ const h=[b.product,b.composition,b.brand,b.company,catOf(b)].join(" ").toLowerCase(); return words.every(w=>h.includes(w)); });
  return arr.sort((a,b)=> (b.preferred?1:0)-(a.preferred?1:0) || (a.product||"").localeCompare(b.product||""));
}
function openMedPicker(_, onDone, {skincare=false}={}){
  openSheet2(skincare?"Add skincare product":"Add medicine", `
    <label class="search" style="margin-top:0">${ICON.search}<input id="mpQ" type="search" placeholder="${skincare?"Search sunscreen, moisturizer, brand…":"Search generic or brand, e.g. tretinoin"}" autocomplete="off" aria-label="Search"></label>
    <div id="mpRes" class="pickres"></div>`);
  const draw = () => {
    const q=$("#mpQ").value; const res=brandSearch(q, skincare).slice(0,40);
    const typed=q.trim();
    // group by composition when searching
    let html="";
    if(typed && !skincare) html += `<button class="pick" data-mpfree="1"><span class="main"><span class="t">Use “${esc(typed)}”</span><span class="s">Prescribe by generic name, without a brand</span></span></button>`;
    if(typed){
      const groups={}; res.forEach(b=>{ const k=(b.composition||b.product||"").trim(); (groups[k] ||= []).push(b); });
      html += Object.entries(groups).map(([k,arr])=>`<div class="lbl" style="margin:8px 0 0">${esc(k)}</div>${arr.map(b=>pickRow(b)).join("")}`).join("");
    } else html += res.map(b=>pickRow(b)).join("");
    $("#mpRes").innerHTML = html || `<div class="empty">No match. Type the full name to prescribe it as written.</div>`;
  };
  const pickRow = b => `<button class="pick" data-mpb="${esc(b.id)}"><span class="main"><span class="t">${b.preferred?"★ ":""}${esc(b.product)}</span><span class="s">${esc([b.composition, b.brand].filter(Boolean).join(" · "))}</span></span><span class="price">${rupee(b.price)}${b.pack?`<small>${esc(b.pack)}</small>`:""}</span></button>`;
  draw(); $("#mpQ").addEventListener("input", draw); setTimeout(()=>$("#mpQ")?.focus(),50);
  $("#mpRes").addEventListener("click", e=>{
    const f=e.target.closest("[data-mpfree]"); if(f){ openDrugDetails({drug:$("#mpQ").value.trim()}, onDone); return; }
    const b=e.target.closest("[data-mpb]"); if(!b) return; const br=S.brands.find(x=>x.id===b.dataset.mpb); if(!br) return;
    const cat=catOf(br); const oral=/oral|Antihistamine|Oral|Supplement|Tofacitinib|Methotrexate|Psoralen/.test(cat) && !/topical/i.test(cat);
    const base={drug:br.composition||br.product, generic:"", brandId:br.id, brand:[br.product, br.brand&&!String(br.product).includes(br.brand)?"("+br.brand+")":""].filter(Boolean).join(" "), cost:br.price??"", route: oral?"Oral":"Topical"};
    if(skincare){ onDone(normRx(base)); closeSheet2(); return; }
    openDrugDetails(base, onDone);
  });
}

function rxText(v,p){

let pdfLib=null;
function loadPdfLib(){
  if(window.html2pdf) return Promise.resolve(window.html2pdf);
  if(pdfLib) return pdfLib;
  const tryLoad = src => new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=()=>window.html2pdf?res(window.html2pdf):rej(); s.onerror=rej; document.head.appendChild(s); });
  pdfLib = tryLoad("vendor/html2pdf.bundle.min.js").catch(()=>tryLoad("https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js").catch(()=>tryLoad("https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js")));
  pdfLib.catch(()=>{ pdfLib=null; });
  return pdfLib;
}
async function savePdf(v,p){
  const dl=S.downloads; if(!dl){ toast("Downloads aren’t available in this view"); return; }
  const name=`Rx-${(p?.name||"patient").replace(/[^\w]+/g,"-")}-${v.date}`;
  toast("Preparing PDF…");
  try{
    const lib=await loadPdfLib();
    const box=$("#offscreen"); box.innerHTML=paperHTML(v,p,{light:true});
    await Promise.all([...box.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
    const blob=await lib().set({margin:8, image:{type:"jpeg",quality:0.95}, html2canvas:{scale:2, useCORS:true, backgroundColor:"#ffffff"}, jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(box.firstElementChild).outputPdf("blob");
    box.innerHTML="";
    const r=await dl.save({filename:name+".pdf", data:blob}); toast(r.status==="saved"?"PDF saved. Open it to print.":"PDF sent");
  }catch(e){
    if(e?.code==="declined") return;
    try{ const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(name)}</title></head><body style="margin:0">${paperHTML(v,p,{light:true})}</body></html>`; await dl.save({filename:name+".html", data:html}); toast("Saved as a page you can open and print"); }
    catch(e2){ if(e2?.code!=="declined") toast("Couldn’t create the file"); }
  }
}

/* ---------- SEVERITY SCORES ---------- */
const AREA6=[[0,"0 · none"],[1,"1 · <10%"],[2,"2 · 10–29%"],[3,"3 · 30–49%"],[4,"4 · 50–69%"],[5,"5 · 70–89%"],[6,"6 · 90–100%"]];
const SEV4=[[0,"0 · none"],[1,"1 · slight"],[2,"2 · moderate"],[3,"3 · marked"],[4,"4 · very marked"]];
const SEV3=[[0,"0 · none"],[1,"1 · mild"],[2,"2 · moderate"],[3,"3 · severe"]];
const EASI_SEV=[[0,"0 · none"],[0.5,"0.5"],[1,"1 · mild"],[1.5,"1.5"],[2,"2 · moderate"],[2.5,"2.5"],[3,"3 · severe"]];
const DARK4=[[0,"0 · absent"],[1,"1 · slight"],[2,"2 · mild"],[3,"3 · marked"],[4,"4 · severe"]];
const HOMO4=[[0,"0 · minimal"],[1,"1 · slight"],[2,"2 · mild"],[3,"3 · marked"],[4,"4 · maximum"]];
const DEPIG=[[0,"0% · none"],[10,"10% · specks of depigmentation"],[25,"25% · pigmented > depigmented"],[50,"50% · equal"],[75,"75% · depigmented > pigmented"],[90,"90% · specks of pigment"],[100,"100% · complete"]];
const scNum = (st,k,max=Infinity) => { const x=parseFloat(st[k]); return isNaN(x)?0:Math.min(Math.max(x,0),max); };
const r1 = x => Math.round(x*10)/10;
const fmtScore = v => (v==null||isNaN(v)) ? "—" : (Math.round(v*10)/10).toLocaleString("en-IN",{maximumFractionDigits:1});
const bandOf = (v, bands) => bands ? (bands.find(b=>v<=b[0]) || bands[bands.length-1]) : null;

/* region-card form: rows of components per region, subtotal shown live */
function regionForm(regs, comps, st, extraFor){
  return regs.map((r,i)=>`<div class="sreg c${i%8}"><div class="sreg-h"><span>${esc(r.l)}${r.w!=null?` <small>× ${r.w}</small>`:""}${r.note?` <small>${esc(r.note)}</small>`:""}</span><b class="sreg-v" data-rv="${r.k}"></b></div>
    <div class="sreg-g">${comps.map(c=>`<label class="sfld"><span>${esc(c.l)}</span>${c.num?scNumIn(r.k+"_"+c.k, st, c.num):scSel(r.k+"_"+c.k, c.opts, st, `${r.l} ${c.l}`)}</label>`).join("")}${extraFor?extraFor(r):""}</div></div>`).join("");
}
function scSel(id, opts, st, aria){ const v=st[id]??opts[0][0]; return `<select class="inp" data-sk="${id}" aria-label="${esc(aria||id)}">${opts.map(([val,l])=>`<option value="${val}" ${String(val)===String(v)?"selected":""}>${esc(l)}</option>`).join("")}</select>`; }
function scNumIn(id, st, {max=100,step=1,ph="0"}={}){ return `<input class="inp" type="number" inputmode="decimal" min="0" max="${max}" step="${step}" data-sk="${id}" value="${esc(st[id]??"")}" placeholder="${esc(ph)}">`; }
function scToggle(id, opts, st){ const v=st[id]??opts[0][0]; return `<div class="seg" role="group">${opts.map(([val,l])=>`<button type="button" data-skt="${id}" data-v="${val}" aria-pressed="${String(v)===String(val)}">${esc(l)}</button>`).join("")}</div>`; }

const PASI_R=[{k:"h",l:"Head & neck",w:0.1},{k:"u",l:"Upper limbs",w:0.2},{k:"t",l:"Trunk",w:0.3},{k:"l",l:"Lower limbs",w:0.4}];
const EASI_R=[{k:"h",l:"Head & neck"},{k:"u",l:"Upper limbs"},{k:"t",l:"Trunk"},{k:"l",l:"Lower limbs"}];
const SCORAD_R=[{k:"hn",l:"Head & neck",a:9,c:17},{k:"ul",l:"Upper limbs (both)",a:18,c:18},{k:"at",l:"Front of trunk",a:18,c:18},{k:"bk",l:"Back",a:18,c:18},{k:"ll",l:"Lower limbs (both)",a:36,c:24},{k:"gn",l:"Genitals",a:1,c:1}];
const SCORAD_I=[{k:"er",l:"Erythema"},{k:"oe",l:"Oedema / papulation"},{k:"oz",l:"Oozing / crusts"},{k:"ex",l:"Excoriation"},{k:"li",l:"Lichenification"},{k:"dr",l:"Dryness (uninvolved skin)"}];
const VASI_R=[{k:"ha",l:"Hands"},{k:"ul",l:"Upper limbs (excl. hands)"},{k:"tr",l:"Trunk"},{k:"ll",l:"Lower limbs (excl. feet)"},{k:"fe",l:"Feet"},{k:"hn",l:"Head & neck"}];
const MASI_R=[{k:"f",l:"Forehead",w:0.3},{k:"rm",l:"Right malar",w:0.3},{k:"lm",l:"Left malar",w:0.3},{k:"c",l:"Chin",w:0.1}];
const SALT_R=[{k:"v",l:"Vertex (top)",w:0.40},{k:"r",l:"Right side",w:0.18},{k:"l",l:"Left side",w:0.18},{k:"p",l:"Back (posterior)",w:0.24}];
const BSA_R=[{k:"hn",l:"Head & neck",m:9},{k:"ul",l:"Upper limbs",m:18},{k:"tr",l:"Trunk (front + back)",m:36},{k:"ll",l:"Lower limbs",m:36},{k:"gn",l:"Genitals",m:1}];
const GAGS_R=[{k:"fh",l:"Forehead",w:2},{k:"rc",l:"Right cheek",w:2},{k:"lc",l:"Left cheek",w:2},{k:"no",l:"Nose",w:1},{k:"ch",l:"Chin",w:1},{k:"cb",l:"Chest & upper back",w:3}];
const GAGS_G=[[0,"0 · no lesions"],[1,"1 · comedones"],[2,"2 · papules"],[3,"3 · pustules"],[4,"4 · nodules"]];
const IGA=[[0,"Clear","No inflammatory or non-inflammatory lesions."],[1,"Almost clear","Rare non-inflammatory lesions; no more than one small inflammatory lesion."],[2,"Mild","Some non-inflammatory lesions; no more than a few inflammatory lesions (papules / pustules only, no nodules)."],[3,"Moderate","Many non-inflammatory lesions; may have some inflammatory lesions, but no more than one small nodule."],[4,"Severe","Up to many non-inflammatory and inflammatory lesions, but no more than a few nodules."]];

const OK="ok", WARN="warn", BAD="danger";
const CALCS = {
  PASI:{name:"PASI", full:"Psoriasis Area and Severity Index", max:72, desc:"Erythema, induration, scaling 0–4 and area 0–6 in four regions",
    bands:[[0,"Clear",OK],[4.9,"Mild",OK],[10,"Moderate",WARN],[72,"Severe (> 10)",BAD]],
    form:st=>`<p class="hint">Score each region: erythema, induration and scaling 0–4; area involved 0–6. Region weights 0.1 / 0.2 / 0.3 / 0.4.</p>`+regionForm(PASI_R,[{k:"e",l:"Erythema",opts:SEV4},{k:"i",l:"Induration",opts:SEV4},{k:"s",l:"Scaling",opts:SEV4},{k:"a",l:"Area",opts:AREA6}],st),
    calc:st=>{ const sub={}; let t=0; PASI_R.forEach(r=>{ const v=(scNum(st,r.k+"_e")+scNum(st,r.k+"_i")+scNum(st,r.k+"_s"))*scNum(st,r.k+"_a")*r.w; sub[r.k]=v; t+=v; }); return {values:{PASI:r1(t)}, sub}; }},
  BSA:{name:"BSA", full:"Body Surface Area involved", max:100, unit:"%", desc:"Patient's palm (with fingers) ≈ 1% of body surface",
    bands:[[0,"Clear",OK],[2.99,"Mild (< 3%)",OK],[10,"Moderate (3–10%)",WARN],[100,"Severe (> 10%)",BAD]],
    form:st=>`<p class="hint">Count how many of the patient’s own palms (including fingers) would cover the lesions in each region. One palm ≈ 1% BSA.</p>`+regionForm(BSA_R.map(r=>({...r,note:`max ${r.m}%`})),[{k:"p",l:"Palms (≈ %)",num:{max:100,step:0.5}}],st),
    calc:st=>{ const sub={}; let t=0; BSA_R.forEach(r=>{ const v=scNum(st,r.k+"_p",r.m); sub[r.k]=v; t+=v; }); return {values:{BSA:r1(Math.min(t,100))}, sub}; }},
  SCORAD:{name:"SCORAD", full:"SCORing Atopic Dermatitis (with objective SCORAD)", max:103, desc:"Extent (A), intensity (B) and subjective symptoms (C)",
    records:[["SCORAD","SCORAD (A/5 + 7B/2 + C)"],["oSCORAD","Objective SCORAD (A/5 + 7B/2)"]],
    bandsFor:{SCORAD:[[24.99,"Mild (< 25)",OK],[50,"Moderate (25–50)",WARN],[103,"Severe (> 50)",BAD]], oSCORAD:[[14.99,"Mild (< 15)",OK],[40,"Moderate (15–40)",WARN],[83,"Severe (> 40)",BAD]]},
    form:st=>`<div class="sblk"><div class="sblk-h">A · Extent</div><p class="hint">% of each region affected (0–100). ${scToggle("age",[["a","Adult / ≥ 2 yrs"],["c","Child < 2 yrs"]],st)}</p>
      ${regionForm(SCORAD_R.map(r=>({...r,note:`${(st.age==="c"?r.c:r.a)}% of body`})),[{k:"p",l:"% of region",num:{max:100}}],st)}</div>
      <div class="sblk"><div class="sblk-h">B · Intensity <small>score an average area, 0–3 each</small></div><div class="sreg c1"><div class="sreg-g">${SCORAD_I.map(x=>`<label class="sfld"><span>${esc(x.l)}</span>${scSel("i_"+x.k,SEV3,st,x.l)}</label>`).join("")}</div></div></div>
      <div class="sblk"><div class="sblk-h">C · Subjective <small>average of last 3 days / nights, 0–10</small></div><div class="sreg c4"><div class="sreg-g"><label class="sfld"><span>Pruritus</span>${scNumIn("c_pr",st,{max:10,step:0.5})}</label><label class="sfld"><span>Sleep loss</span>${scNumIn("c_sl",st,{max:10,step:0.5})}</label></div></div></div>`,
    calc:st=>{ const sub={}; let A=0; SCORAD_R.forEach(r=>{ const w=st.age==="c"?r.c:r.a; const v=scNum(st,r.k+"_p",100)/100*w; sub[r.k]=v; A+=v; }); A=Math.min(A,100);
      const B=SCORAD_I.reduce((n,x)=>n+scNum(st,"i_"+x.k,3),0); const C=scNum(st,"c_pr",10)+scNum(st,"c_sl",10);
      const o=A/5+3.5*B; return {values:{SCORAD:r1(o+C), oSCORAD:r1(o)}, sub, parts:`A ${fmtScore(A)}% · B ${fmtScore(B)}/18 · C ${fmtScore(C)}/20`}; }},

const HOW_TO = {"PASI": ["Divide the body into head & neck, upper limbs, trunk and lower limbs.", "In each region grade erythema (E), induration (I) and scaling (S) 0–4, and the % area involved as 0–6 (0 none, 1 <10%, 2 10–29%, 3 30–49%, 4 50–69%, 5 70–89%, 6 90–100%).", "Region score = (E + I + S) × area × weight (head 0.1, upper limbs 0.2, trunk 0.3, lower limbs 0.4).", "PASI = sum of the four regions (0–72). PASI 75 = ≥ 75% fall from baseline."], "BSA": ["The patient’s own palm with fingers ≈ 1% of body surface.", "Count palms needed to cover the lesions in each region (head & neck max 9%, upper limbs 18%, trunk 36%, lower limbs 36%, genitals 1%).", "BSA % = sum of all regions. < 3% mild, 3–10% moderate, > 10% severe."], "SCORAD": ["A · Extent: % of each region affected × region size by rule of nines (adult: head 9, upper limbs 18, front trunk 18, back 18, lower limbs 36, genitals 1; child < 2 yrs: head 17, lower limbs 24). Sum = A (0–100).", "B · Intensity: pick a representative area and grade erythema, oedema/papulation, oozing/crusts, excoriation, lichenification and dryness 0–3 each (0–18).", "C · Subjective: pruritus + sleep loss, each 0–10, averaged over the last 3 days/nights (0–20).", "SCORAD = A/5 + 7B/2 + C (0–103). Objective SCORAD = A/5 + 7B/2 (0–83)."], "EASI": ["Same four regions as PASI.", "In each region grade erythema, oedema/papulation, excoriation and lichenification 0–3 (half points allowed) and area 0–6.", "Region score = (sum of 4 signs) × area × weight. Weights ≥ 8 yrs: head 0.1, upper limbs 0.2, trunk 0.3, lower limbs 0.4; 0–7 yrs: head 0.2, lower limbs 0.3.", "EASI = sum of regions (0–72). EASI 75 = ≥ 75% fall from baseline."], "VASI": ["Divide the body into hands, upper limbs, trunk, lower limbs, feet and head & neck.", "Measure involvement in hand units (patient’s palm + fingers ≈ 1 hand unit ≈ 1% BSA).", "Estimate residual depigmentation: 100% complete, 90% specks of pigment, 75% depigmented > pigmented, 50% equal, 25% pigmented > depigmented, 10% specks of depigmentation.", "VASI = Σ (hand units × depigmentation) across regions (0–100)."], "MASI": ["Four facial areas: forehead (0.3), right malar (0.3), left malar (0.3), chin (0.1).", "Grade area A 0–6, darkness D 0–4 and homogeneity H 0–4 in each.", "MASI = Σ weight × A × (D + H) (0–48).", "mMASI = Σ weight × A × D, homogeneity dropped (0–24); more reliable and now preferred."], "SALT": ["Look at the scalp in four views: vertex/top (40% of scalp), right side (18%), left side (18%), back (24%).", "Estimate % hair loss within each view.", "SALT = 0.40 × top + 0.18 × right + 0.18 × left + 0.24 × back (0–100).", "SALT ≤ 20 is the common treatment-success target."], "UAS7": ["Patient records once daily for 7 consecutive days.", "Wheals: 0 none, 1 < 20 / 24 h, 2 20–50, 3 > 50 or large confluent areas. Itch: 0 none, 1 mild, 2 moderate, 3 intense.", "Daily score = wheals + itch (0–6). UAS7 = sum of 7 days (0–42).", "0 urticaria-free · 1–6 well controlled · 7–15 mild · 16–27 moderate · 28–42 severe."], "IGA": ["Look at the whole face and give one overall grade, judged mainly by the most severe lesions.", "0 clear · 1 almost clear · 2 mild · 3 moderate · 4 severe (see descriptions).", "Treatment success is usually IGA 0 or 1 with at least a 2-grade improvement."], "GAGS": ["Six areas with factors: forehead × 2, right cheek × 2, left cheek × 2, nose × 1, chin × 1, chest & upper back × 3.", "Grade the most severe lesion in each area: 0 none, 1 comedone, 2 papule, 3 pustule, 4 nodule.", "Local score = factor × grade. GAGS = sum (0–44): 1–18 mild, 19–30 moderate, 31–38 severe, ≥ 39 very severe."], "DLQI": ["Patient answers 10 questions about the last week (symptoms, embarrassment, daily activities, clothing, social/leisure, sport, work/study, relationships, sex, treatment).", "Each scored 0 (not at all / not relevant) to 3 (very much). Total = sum (0–30).", "0–1 no effect · 2–5 small · 6–10 moderate · 11–20 very large · 21–30 extremely large. A change of ≥ 4 points is clinically meaningful."]};
function easiW(k, st){ const child=st.age==="c"; return ({h:child?0.2:0.1, u:0.2, t:0.3, l:child?0.3:0.4})[k]; }
/* record types saved per patient */
const SCORE_TYPES = {PASI:{n:"PASI",max:72,c:"PASI"}, BSA:{n:"BSA %",max:100,c:"BSA"}, SCORAD:{n:"SCORAD",max:103,c:"SCORAD"}, oSCORAD:{n:"Objective SCORAD",max:83,c:"SCORAD"}, EASI:{n:"EASI",max:72,c:"EASI"}, VASI:{n:"VASI",max:100,c:"VASI"}, mMASI:{n:"mMASI",max:24,c:"MASI"}, MASI:{n:"MASI",max:48,c:"MASI"}, SALT:{n:"SALT",max:100,c:"SALT"}, UAS7:{n:"UAS7",max:42,c:"UAS7"}, IGA:{n:"Acne IGA",max:4,c:"IGA"}, GAGS:{n:"GAGS",max:44,c:"GAGS"}, DLQI:{n:"DLQI",max:30,c:"DLQI"}};
const SCORE_ORDER = Object.keys(SCORE_TYPES);
const bandsForType = t => { const c=CALCS[SCORE_TYPES[t]?.c]; return c?.bandsFor?.[t] || c?.bands || null; };
const SUGGEST = [[/psoria/i,["PASI","BSA","DLQI"]],[/atopic|eczema/i,["SCORAD","EASI","DLQI"]],[/vitiligo/i,["VASI","DLQI"]],[/melasma/i,["MASI","DLQI"]],[/alopecia areata|\balopecia\b(?!.*androgen)/i,["SALT"]],[/urticaria|angioedema/i,["UAS7","DLQI"]],[/\bacne\b(?!.*excori)/i,["IGA","GAGS","DLQI"]]];
function suggestScores(dx){ const out=[]; SUGGEST.forEach(([re,ks])=>{ if(re.test(dx||"")) ks.forEach(k=>{ if(!out.includes(k)) out.push(k); }); }); return out; }
function scoreSuggestHTML(dx, extra=""){ const ks=suggestScores(dx); return ks.length?`<div class="ssug"><span>Suggested score${ks.length>1?"s":""}</span>${ks.map(k=>`<button type="button" class="chip hc ${hueOf(k)}" data-scoreopen="${k}" ${extra}>+ ${esc(CALCS[k].name)}</button>`).join("")}</div>`:""; }

/* ---------- score panel: side panel on desktop, bottom sheet on phone ---------- */
const P = { open:false, ctx:{}, key:null, st:{}, rec:null, res:null };
function panelOpen(title, bodyHTML, footHTML="", {back}={}){
  const el=$("#pnl"); el.hidden=false; P.open=true; document.body.style.overflow="hidden";
  $("#pnlTitle").textContent=title; $("#pnlBack").hidden=!back; P.back=back||null;
  const ob=$("#pnlBody"), nb=ob.cloneNode(false); ob.replaceWith(nb); nb.innerHTML=bodyHTML; nb.scrollTop=0;
  $("#pnlFoot").innerHTML=footHTML; $("#pnlFoot").hidden=!footHTML;
  setTimeout(()=>$("#pnlClose")?.focus({preventScroll:true}),30);
  return nb;
}
function panelClose(){ $("#pnl").hidden=true; P.open=false; if($("#sheet").hidden && $("#sheet2").hidden) document.body.style.overflow=""; }
function openScoreList(ctx={}){
  P.ctx=ctx; const sug=suggestScores(ctx.dx||"");
  const row=k=>`<button class="row" data-calc="${k}"><span class="gdot ${hueOf(k)}" style="background:var(--h)"></span><span class="main"><span class="t">${esc(CALCS[k].name)} <span style="color:var(--muted);font-weight:500">· 0–${CALCS[k].max}${CALCS[k].unit||""}</span></span><span class="s">${esc(CALCS[k].full)}</span></span></button>`;
  const body=panelOpen(ctx.pname?`Score · ${ctx.pname}`:"Severity scores", `${sug.length?`<div class="group" style="margin-top:0"><h3>Suggested for ${esc(ctx.dx)}</h3><div class="list">${sug.map(row).join("")}</div></div>`:""}
    <div class="group" style="${sug.length?"":"margin-top:0"}"><h3>${sug.length?"All scores":"Choose a score"}</h3><div class="list">${Object.keys(CALCS).filter(k=>!sug.includes(k)).map(row).join("")}</div></div>`);
  body.addEventListener("click", e=>{ const b=e.target.closest("[data-calc]"); if(b) openCalc(b.dataset.calc, P.ctx, {fromList:true}); });
}
function openCalc(key, ctx={}, {fromList=false}={}){
  const def=CALCS[key]; if(!def) return;
  P.ctx=ctx; P.key=key; P.st={}; P.rec=def.records?def.records[0][0]:key; P.date=today();
  const recSel = def.records ? `<label class="sfld" style="min-width:0;flex:1"><span>Record as</span><select class="inp" id="srRec">${def.records.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select></label>` : "";
  const saveLbl = ctx.pid ? `Save for ${ctx.pname||"patient"}` : "Save to a patient";
  const body=panelOpen(def.name, `<p class="calc-full">${esc(def.full)}</p>${HOW_TO[key]?`<details class="howto" open><summary>How it is calculated</summary><ol>${HOW_TO[key].map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`:""}<div id="calcForm">${def.form(P.st)}</div>`,
    `<div class="sres"><div class="sres-v"><b id="srV">0</b><span id="srMax">/ ${def.max}${def.unit||""}</span></div><span class="pill" id="srB" hidden></span><span class="hint" id="srP"></span></div>
     <div class="sres-act">${recSel}<label class="sfld"><span>Date</span><input class="inp" type="date" id="srDate" value="${P.date}"></label></div>
     <div class="sres-act"><button class="btn sm" type="button" id="srReset">Reset</button><button class="btn primary" type="button" id="srSave" style="margin-left:auto">${esc(saveLbl)}</button></div>`,
    {back: fromList ? ()=>openScoreList(ctx) : null});
  const rerenderForm = () => { const f=$("#calcForm"); f.innerHTML=def.form(P.st); recompute(); };
  body.addEventListener("input", e=>{ const k=e.target.dataset.sk; if(k!=null){ P.st[k]=e.target.value; recompute(); } });
  body.addEventListener("change", e=>{ const k=e.target.dataset.sk; if(k!=null){ P.st[k]=e.target.value; recompute(); } });
  body.addEventListener("click", e=>{ const b=e.target.closest("[data-skt]"); if(!b) return; P.st[b.dataset.skt]=b.dataset.v; rerenderForm(); });
  $("#srRec")?.addEventListener("change", e=>{ P.rec=e.target.value; recompute(); });
  $("#srDate").addEventListener("change", e=>{ P.date=e.target.value||today(); });
  $("#srReset").onclick = () => { P.st={}; rerenderForm(); };
  $("#srSave").onclick = () => { if(ctx.pid) saveScore(ctx.pid); else pickPatientForScore(); };
  recompute();
}
function recompute(){
  const def=CALCS[P.key]; if(!def) return; const res=def.calc(P.st); P.res=res;
  const v=res.values[P.rec]; const max=SCORE_TYPES[P.rec]?.max ?? def.max;
  $("#srV").textContent=fmtScore(v); $("#srMax").textContent=`/ ${max}${def.unit||""}`;
  const b=bandOf(v, bandsForType(P.rec)); const pill=$("#srB");
  if(b){ pill.hidden=false; pill.textContent=b[1]; pill.className="pill "+(b[2]===OK?"":b[2]); } else pill.hidden=true;
  $("#srP").textContent = res.parts || "";
  if(res.sub) document.querySelectorAll("#pnlBody [data-rv]").forEach(el=>{ const x=res.sub[el.dataset.rv]; el.textContent = x==null?"":fmtScore(x); });
}
function pickPatientForScore(){
  const keep={key:P.key, st:P.st, rec:P.rec, date:P.date, res:P.res, ctx:P.ctx};
  const body=panelOpen("Save score to…", `<p class="hint" style="margin-top:0">${esc(SCORE_TYPES[keep.rec].n)} ${fmtScore(keep.res.values[keep.rec])} on ${esc(fmtDate(keep.date))}</p><label class="search" style="margin-top:0">${ICON.search}<input id="spQ" type="search" placeholder="Search patients" autocomplete="off" aria-label="Search patients"></label><div id="spRes"></div>`, "",
    {back:()=>{ openCalc(keep.key, keep.ctx); P.st=keep.st; P.rec=keep.rec; P.date=keep.date; $("#calcForm").innerHTML=CALCS[keep.key].form(P.st); if($("#srRec")) $("#srRec").value=P.rec; $("#srDate").value=P.date; recompute(); }});
  const draw=()=>{ const q=$("#spQ").value.trim(); const arr=(q?searchPeople(q):S.people.slice().sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0))).slice(0,40);
    $("#spRes").innerHTML = arr.length?`<div class="list" style="margin-top:10px">${arr.map(p=>`<button class="row" data-spp="${esc(p.id)}"><span class="avatar ${hueOf(p.name)}">${esc((p.name||"?")[0].toUpperCase())}</span><span class="main"><span class="t">${esc(p.name)}</span><span class="s">${esc([ageSex(p), latestVisit(p.id)?.dx].filter(Boolean).join(" · "))}</span></span></button>`).join("")}</div>`:`<div class="empty">${S.people.length?"No patient matches.":"No patients yet. Add a patient first."}</div>`; };
  draw(); $("#spQ").addEventListener("input", draw);
  body.addEventListener("click", async e=>{ const b=e.target.closest("[data-spp]"); if(!b) return; Object.assign(P, {key:keep.key, st:keep.st, rec:keep.rec, date:keep.date, res:keep.res}); await saveScore(b.dataset.spp); });
}
async function saveScore(pid){
  const v=P.res?.values?.[P.rec]; if(v==null||isNaN(v)){ toast("Nothing to save yet"); return; }
  const d={patientId:pid, type:P.rec, value:v, date:P.date||today(), detail:{...P.st}, calc:P.key, createdAt:Date.now()};
  if(await save("scores", newId("scores"), d)){ const p=personById(pid); toast(`${SCORE_TYPES[P.rec].n} ${fmtScore(v)} saved${p?" for "+p.name:""}`); panelClose(); }
}

$("#pnlBg").addEventListener("click", panelClose);
