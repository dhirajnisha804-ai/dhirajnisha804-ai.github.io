/* ===== Colour layer ===== */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf2; --line:#d6dde5; --fg:#16222e; --muted:#5b6876;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#e3eef6; --rose:#a8455d; --rose-soft:#f6e6ea;
  --grad:linear-gradient(180deg,#173a59 0%,#123049 100%); --gradtext:linear-gradient(#16222e,#16222e); --kink:#fff; --hdr-accent:#2aa198;
  --c0:#a8455d; --c0s:#f6e8ec; --c1:#57509e; --c1s:#ecebf7; --c2:#1b7a7f; --c2s:#e1f1f1; --c3:#9a620f; --c3s:#f8eedd;
  --c4:#1f5fa0; --c4s:#e3edf8; --c5:#2f7445; --c5s:#e4f2e8; --c6:#ad5328; --c6s:#f8e9e0; --c7:#76508f; --c7s:#f1e9f5;
}

  --accent:#6fb3e0; --accent-ink:#0b1824; --accent-soft:#19324a; --rose:#e597aa; --rose-soft:#3a2230;
  --grad:linear-gradient(180deg,#14304a 0%,#0f263b 100%); --gradtext:linear-gradient(#e4eaf0,#e4eaf0); --kink:#17202b; --hdr-accent:#3cbfb4;
  --c0:#e597aa; --c0s:#38232b; --c1:#a9a3e6; --c1s:#25243d; --c2:#6ccfcf; --c2s:#16302f; --c3:#e6b56a; --c3s:#382b15;
  --c4:#8ab8ee; --c4s:#1a2c42; --c5:#86c99a; --c5s:#1a3022; --c6:#f0a07c; --c6s:#3a241a; --c7:#c9a6e0; --c7s:#30233b;}}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#17202b; --sunk:#1e2935; --line:#2c3a48; --fg:#e4eaf0; --muted:#98a6b4;
  --accent:#6fb3e0; --accent-ink:#0b1824; --accent-soft:#19324a; --rose:#e597aa; --rose-soft:#3a2230;

  --c0:#e597aa; --c0s:#38232b; --c1:#a9a3e6; --c1s:#25243d; --c2:#6ccfcf; --c2s:#16302f; --c3:#e6b56a; --c3s:#382b15;
  --c4:#8ab8ee; --c4s:#1a2c42; --c5:#86c99a; --c5s:#1a3022; --c6:#f0a07c; --c6s:#3a241a; --c7:#c9a6e0; --c7s:#30233b;}
.c0{--h:var(--c0);--hs:var(--c0s)}.c1{--h:var(--c1);--hs:var(--c1s)}.c2{--h:var(--c2);--hs:var(--c2s)}.c3{--h:var(--c3);--hs:var(--c3s)}
.c4{--h:var(--c4);--hs:var(--c4s)}.c5{--h:var(--c5);--hs:var(--c5s)}.c6{--h:var(--c6);--hs:var(--c6s)}.c7{--h:var(--c7);--hs:var(--c7s)}

ap smear / cervical screening in women","Gram stain / NAAT of discharge if present"],"ddx":[["Condyloma lata (secondary syphilis)","Moist flat-topped papules; positive serology"],["Molluscum contagiosum","Umbilicated pearly papules"],["Pearly penile papules / vestibular papillomatosis","Uniform, symmetrical, normal variant"],["Fordyce spots","Small yellowish papules on shaft or labia"],["Seborrhoeic keratosis / skin tags","Stuck-on or soft pedunculated, older patients"],["Bowenoid papulosis / SCC","Pigmented flat papules or indurated ulcerated growth — biopsy"],["Buschke–Löwenstein tumour","Giant locally destructive condyloma"]],"fmt":"A ___-year-old ___ with anogenital warts (condyloma acuminata) at ___, number ___, keratinised / non-keratinised, with / without other STIs, HIV status ___.","pearls":["Screen every patient for syphilis and HIV; examine and counsel partners.","Podophyllin and podophyllotoxin are contraindicated in pregnancy.","Biopsy pigmented, indurated or treatment-resistant warts."]},{"n":"Chancroid","g":"Sexually transmitted infections","t":"Long case","cc":["Painful ulcer(s) on genitals for ___ days","Painful swelling in the groin for ___ days"],"hx":[{"h":"Ulcer","i":[["Date of last sexual exposure","Short incubation (3–10 days) favours chancroid over syphilis or donovanosis"],["How it began — papule, then pustule, then ulcer","Typical evolution of chancroid; vesicles first suggest herpes"],["Number of ulcers; new ones appearing beside old ones","Multiple ulcers and 'kissing' ulcers from autoinoculation are typical"],["Pain, bleeding, pus, foul smell","Painful, dirty, easily bleeding ulcers favour chancroid; painless favours syphilis or donovanosis"],["Lesions on fingers, lips, breasts, eyelids","Extragenital autoinoculation can occur"]]},{"h":"Groin swelling","i":[["One side or both; painful; red skin over it","Unilateral tender bubo in about half of cases"],["Did it burst or discharge pus?","Ruptured bubo can form a chancroidal ulcer or sinus"]]},{"h":"Risk factors","i":[["Commercial sex, multiple partners, migrant work, alcohol or drug use","Chancroid clusters in core transmitter groups"],["Circumcision status","Uncircumcised men are at higher risk and heal more slowly"],["Condom use and breakage","Assess ongoing risk and counselling needs"]]},{"h":"Co-infection and complications","i":[["Previous STIs, known HIV status","Chancroid increases HIV transmission; HIV slows healing"],["Painless ulcer or rash earlier","Mixed infection with syphilis is common"],["Unable to retract foreskin, swelling of penis","Phimosis, paraphimosis or balanoposthitis"],["Rapidly spreading ulcer with black slough","Phagedenic change from superinfection"]]},{"h":"Treatment and partner","i":[["Antibiotics or creams already used","Partial treatment alters appearance; some creams cause fixed drug eruption"],["Partner's symptoms","Partners need treatment even if asymptomatic"]]},{"h":"General","i":[["Fever, malaise","Usually absent — systemic features suggest another diagnosis or complication"]]}],"ex":[{"h":"Ulcer","i":["Number, site (prepuce, frenulum, corona, glans; fourchette, labia in women)","Soft (non-indurated), tender, ragged undermined edge, dirty yellow-grey necrotic base, bleeds easily","Kissing ulcers on opposing surfaces","Variants: dwarf, giant, follicular, transient, serpiginous, phagedenic, mixed with syphilis"]},{"h":"Lymph nodes","i":["Tender, matted, usually unilateral inguinal nodes; fluctuation; overlying redness; sinus or ruptured bubo"]},{"h":"Complications","i":["Phimosis, paraphimosis, balanoposthitis, urethral fistula, tissue destruction"]},{"h":"Extragenital and rest","i":["Extragenital ulcers on fingers, lips, breasts, thighs (autoinoculation)","Whole skin and mucosae for other STIs — chancre, vesicles, warts, secondary syphilis rash","Signs of HIV: oral candida, wasting, generalised nodes"]}],"inv":["Gram stain of ulcer smear — Gram-negative coccobacilli in 'school of fish' pattern","Culture / PCR for H. ducreyi where available","Dark-ground microscopy and syphilis serology","Tzanck smear / HSV PCR","HIV test; repeat syphilis and HIV serology at 3 months"],"ddx":[["Primary syphilis","Painless, indurated, clean base; rubbery bilateral nodes"],["Genital herpes","Grouped vesicles then shallow painful erosions; recurrent"],["Lymphogranuloma venereum","Transient painless ulcer, later large nodes with groove sign"],["Donovanosis","Painless beefy-red bleeding granulation; pseudobubo"],["Fixed drug eruption","Drug history, recurs at same site"],["Trauma / carcinoma","History of injury; indurated non-healing ulcer in older patient"]],"fmt":"A ___-year-old ___ with chancroid — ___ ulcers on ___ — with / without suppurative bubo and complications ___; syphilis and HIV status ___.","pearls":["Mixed infection with syphilis and herpes is common — always test.","Aspirate fluctuant buboes rather than incising them.","Treat partners from the preceding 10 days."]},{"n":"Dermatomyositis","g":"Connective tissue diseases","t":"Long case","cc":["Weakness of shoulders / thighs for ___","Swelling and purplish colour around eyes for ___","Itchy purplish rash on face, upper back, knuckles for ___","Rash worse after sun exposure"],"hx":[{"h":"Muscle","i":[["Difficulty getting up from squatting or a chair, climbing stairs, combing hair, lifting arms","Defines symmetric proximal weakness — the hallmark of myositis"],["Speed of onset; progression","Acute onset suggests aggressive disease or drug or infective myositis"],["Muscle pain or tenderness","Present in some; severe pain suggests infective or other myopathy"],["Shoulder or hip pain before weakness","Bursitis or arthralgia can precede myositis"],["Difficulty swallowing, nasal voice, choking","Pharyngeal muscle involvement — aspiration risk and a sign of severity"],["Neck weakness — difficulty lifting head","Neck flexor weakness is common and often missed"]]},{"h":"Skin","i":[["Eyelid swelling and purplish colour; present all day?","Heliot le DM"],["Strenuous exercise or stress before onset","Can trigger flares and raise CK"]]},{"h":"Treatment history","i":[["Steroids and steroid-sparing drugs — dose, duration, response","Guides further treatment"],["Weakness worsening after improving on steroids","Consider steroid myopathy rather than relapse"],["Side effects: diabetes, BP, weight, fractures, cataract, infections","Long-term steroid toxicity"]]},{"h":"Background","i":[["Past TB, diabetes, hypertension, heart disease","Affect choice and safety of immunosuppression"],["Family history of similar illness or autoimmune disease","Shared autoimmune predisposition"],["Menstrual and obstetric history; contraception","Drug choice (methotrexate, MMF, cyclophosphamide) and pregnancy planning"],["Sleep, appetite, bowel, bladder","General health and disease burden"],["Impact on work, daily activities, relationships, mood","Disability and quality of life guide rehabilitation"]]}],"ex":[{"h":"General","i":["Look for pallor, jaundice, cyanosis, swelling of feet, enlarged nodes; record vitals and BMI","Breathing pattern, oxygen saturation"]},{"h":"Skin","i":["Heliotrope rash — violaceous erythema and oedema of upper eyelids","Flat-topped violet papules over the knuckles and other bony points (Gottron's papules); flat redness running along extensor tendons (Gottron's sign)","V-sign, shawl sign, holster sign; poikiloderma (atrophy, telangiectasia, dyspigmentation)","Nail folds: ragged cuticles, dilated capillary loops, periungual erythema","Mechanic's hands; calcinosis over bony points; flagellate erythema; scalp scaling; hypertrichosis","Ulceration (suggests anti-MDA5 or malignancy); oral and genital mucosa"]},{"h":"Muscles","i":["Power by MRC grade: neck flexors, shoulder abductors, hip flexors; proximal vs distal","Muscle tenderness, wasting; Gowers' sign; ability to rise from squat","Swallowing, voice"]},{"h":"Systems","i":["Chest: fine basal crackles (ILD)","CVS: rhythm, signs of failure","Joints","Malignancy: breast, lymph nodes, abdomen; pelvic and rectal examination (refer as appropriate)"]}],"inv":["CK, aldolase, LDH, AST/ALT","Myositis-specific antibodies (anti-Mi-2, MDA5, TIF1-γ, NXP2, Jo-1); ANA","Skin biopsy; muscle MRI / EMG / muscle biopsy","Chest HRCT, PFTs, ECG, echo","Malignancy screen: CT chest/abdomen/pelvis, mammogram, CA-125, stool occult blood, nasopharyngeal exam (age- and risk-based)","Barium swallow if dysphagia"],"ddx":[["SLE","Rash between knuckles, spares them; renal disease; less itch"],["Systemic sclerosis / overlap","Sclerodactyly, Raynaud's, skin tightening"],["MCTD","Puffy hands, anti-U1-RNP"],["Other myopathies","Steroid, statin, hypothyroid, hypokalaemic — no skin signs"],["Psoriasis / seborrhoeic dermatitis","Scaly plaques without poikiloderma or weakness"],["Periorbital oedema of other causes","Angioedema, nephrotic syndrome, contact dermatitis, erysipelas"]],"fmt":"A ___-year-old ___ with classic / amyopathic / juvenile dermatomyositis of ___ duration, with proximal muscle weakness (grade ___), heliotrope rash, Gottron's papules and ___ signs, with / without ILD, dysphagia, calcinosis or associated malignancy ___.","pearls":["In adults, search for an underlying cancer — risk is highest in the first 3 years.","Anti-MDA5 predicts rapidly progressive ILD and skin ulcers; anti-TIF1-γ predicts malignancy.","Skin disease often persists after muscles recover — treat it separately (sun protection, HCQ, topical therapy)."]},{"n":"Erythroderma","g":"Papulosquamous & erythroderma","t":"Long case","cc":["Redness and scaling of almost the whole body for ___","Itching for ___","Fever / feeling cold for ___","Swelling of feet for ___"],"hx":[{"h":"Onset and spread","i":[["Where it began and how fast it spread","Sudden onset suggests drugs or steroid withdrawal; slow suggests lymphoma, PRP or eczema"],["Direction of spread — head downwards?","Cephalocaudal spread is typical of PRP"],["Areas that stayed normal","Islands of sparing suggest PRP; sparing of folds suggests papuloerythroderma of Ofuji"],["Type and amount of scaling — fine, large sheets, handfuls in bed","Scale volume reflects protein loss; scale type hints at cause"],["Itching intensity","Intractable itch suggests eczema, scabies or Sézary syndrome"]]},{"h":"Clues to the underlying cause","i":[["Earlier red raised scaly patches on scalp, elbows, knees; joint pains; nail pits","Psoriasis — the most common cause in India"],["Childhood itchy flexural rash, asthma, rhinitis","Atopic dermatitis"],["Rash on face, neck, hands worse in summer; exposure to Parthenium (congress grass)","Airborne contact dermatitis / photodermatitis"],["Earlier blisters or raw crusted areas","Pemphigus foliaceus"],["Orange-red palms and soles, rough follicular bumps","Pityriasis rubra pilaris"],["Itching in family members","Crusted scabies"],["Weight loss, night sweats, fever, lumps","Lymphoma, Sézary syndrome or other malignancy"],["Muscle weakness, purplish eyelids, malar rash","Dermatomyositis or lupus"],["Varicose veins, itchy oozing legs","Stasis eczema with autosensitisation"],["Sexual exposure, urethral discharge, diarrhoea","HIV, secondary syphilis, reactive arthritis"]]},{"h":"Drugs and treatment","i":[["Every drug in the 8 weeks before onset — anticonvulsants, allopurinol, antitubercular drugs, sulphonamides, β-lactams, vancomycin, NSAIDs, ayurvedic medicines","Drug-induced erythroderma or DRESS"],["Stopping oral or potent topical steroids","Common precipitant of erythrodermic psoriasis"],["Strong topicals — tar, dithranol, salicylic acid; phototherapy","Irritation can precipitate erythroderma"],["Response to previous treatment","Guides next step"]]},{"h":"Complications","i":[["Shivering, feeling cold","Hypothermia from heat loss through dilated vessels"],["Breathlessness, tiredness, swelling of feet","High-output cardiac failure and hypoalbuminaemia"],["Thirst, dizziness, low urine output","Dehydration and prerenal kidney injury"],["Muscle cramps","Electrolyte imbalance (hyp ng case","cc":["Genital sore / raw area for ___","Groin swelling for ___","Urethral / vaginal discharge for ___","Associated rash, joint pains, fever, red eyes"],"hx":[{"h":"The sore","i":[["How it started — papule, blister, pustule, or injury","Vesicles suggest herpes; pustule suggests chancroid; papule suggests syphilis or donovanosis"],["Number, site, size; change over time","Single vs multiple helps separate syphilis from herpes and chancroid"],["Painful or painless","Painful — herpes, chancroid; painless — syphilis, LGV, donovanosis"],["Discharge, bleeding on touch, smell","Bleeding beefy ulcer suggests donovanosis; foul necrotic one suggests chancroid or phagedena"],["Recurrences at the same site","Herpes or fixed drug eruption"],["Drug taken or cream applied before the sore","Fixed drug eruption; medicament dermatitis"],["Injury, zipper, bite","Traumatic ulcer"],["Oral, anal or eye lesions","Behçet's disease, herpes, syphilis, Crohn's"]]},{"h":"Groin swelling","i":[["One or both sides, painful, overlying skin red or bluish, discharge","Tender unilateral bubo — chancroid; groove sign — LGV; painless rubbery nodes — syphilis"],["Timing in relation to the ulcer","LGV nodes appear after the ulcer has healed"]]},{"h":"Discharge and urinary symptoms","i":[["Urethral discharge — amount, colour, blood, relation to intercourse","Co-existing gonococcal or non-gonococcal urethritis"],["Vaginal discharge — colour, smell, itching, relation to menses","Vaginitis or cervicitis co-infection"]]},{"h":"Sexual exposure","i":[["First and last exposure; with sex worker or known partner; protected?","Incubation period helps identify the likely organism"],["Type — vaginal, oral, anal","Guides examination of mouth, rectum (proctoscopy)"],["Number of partners; condom use and breakage","Risk assessment and counselling"],["Days since last exposure","Syphilis 9–90 days; herpes 2–12 days; chancroid 3–10 days"]]},{"h":"Systemic and specific clues","i":[["Fever, body aches, joint pains, red eyes, headache","Primary herpes, secondary syphilis, reactive arthritis, Behçet's"],["Rash on body, palms, soles; hair loss; mouth patches","Secondary syphilis"],["Leg / genital swelling, rectal pain, ribbon-like stools","Late LGV"],["Groin itching with crawling sensation","Scabies or pubic lice"]]},{"h":"HIV and blood-borne risk","i":[["Previous STIs and treatment","Recurrent STIs mark ongoing high risk"],["Known HIV status; weight loss, chronic diarrhoea, recurrent infections, shingles, TB","Genital ulcers greatly increase HIV transmission"],["Injecting drugs, blood transfusion, needle injury, past jaundice","Hepatitis B and C risk"]]},{"h":"Women","i":[["Irregular or intermenstrual bleeding, dyspareunia, lower abdominal pain","Cervicitis or PID"],["Obstetric history — abortions, stillbirths, infertility","Untreated syphilis and PID"]]},{"h":"Partner and family","i":[["Spouse's symptoms, transfusion, obstetric history","Source of infection and partner treatment"],["Itching in family members","Scabies"]]},{"h":"Background","i":[["TB, diabetes, hypertension, drug allergy (especially penicillin)","Treatment choice — penicillin allergy matters for syphilis"]]}],"ex":[{"h":"General","i":["Weight, vitals, pallor, icterus, clubbing, wasting, oedema","Generalised lymphadenopathy including epitrochlear nodes"]},{"h":"Skin and mucosa","i":["Rash (copper-coloured papules on palms and soles), moth-eaten alopecia, oral mucous patches","Herpes zoster scars, oral thrush (HIV)","Pubic hair: nits, burrows, folliculitis"]},{"h":"Ulcer","i":["Number, site, shape, size, edge (rolled, undermined, ragged), floor, base","Induration (button-like in syphilis), tenderness, bleeding on touch, discharge, smell","Chancre: usually one painless ulcer, cartilage-like firmness, clean base; the indurated prepuce flips over as a unit (Dory flop)","Chancroid: several tender, soft ulcers with ragged overhanging edges and a dirty base","Herpes: grouped vesicles or polycyclic superficial erosions","Donovanosis: beefy-red, exuberant, bleeds easily; pseudobubo from subcutaneous granulation","LGV: small transient papule or erosion, often already healed","Fixed drug eruption: dusky erosion with surrounding violaceous halo; Behçet's: punched-out ulcers on scrotum or labia"]},{"h":"Lymph nodes","i":["Note side, size, whether separate or stuck together, tenderness, softening, feel (firm-rubbery vs hard), skin over them, sinuses and the groove sign"]},{"h":"Genitals","i":["Retract prepuce — oedema, phimosis; urethral meatus — discharge (milk the urethra); scrotum, testes, epididymis","Women: vulva, Bartholin's glands, speculum (vagina, cervix), bimanual pelvic examination","Perianal region; proctoscopy if receptive anal sex"]},{"h":"Systems","i":["Liver, spleen (secondary syphilis, HIV)","CVS: aortic regurgitation murmur (late syphilis)","CNS: pupils, reflexes, posterior column sensation, cognition (neurosyphilis)","Eyes: uveitis (syphilis, Behçet's, reactive arthritis)","Joints: arthritis, enthesitis (reactive arthritis)"]}],"inv":["Dark-ground microscopy of serum from ulcer","Gram stain (chancroid), Tzanck smear (herpes), crushed tissue smear for Donovan bodies","VDRL / RPR and TPHA","HIV, HBsAg, HCV (with consent)","NAAT / culture for gonorrhoea and chlamydia if discharge","Repeat syphilis and HIV serology at 3 months if negative initially"],"ddx":[["Primary syphilis","Painless, indurated, clean base; bilateral rubbery nodes"],["Chancroid","Painful, soft, ragged undermined edge; tender unilateral suppurative bubo"],["Genital herpes","Shallow multiple tender erosions after vesicles; tends to recur at same site"],["Lymphogranuloma venereum","Transient ulcer, then large nodes with groove sign"],["Donovanosis","Painless beefy-red bleeding ulcer; pseudobubo"],["Non-STI causes","Fixed drug eruption, Behçet's, Crohn's, trauma, SCC"]],"fmt":"A ___-year-old ___ with genital ulcer disease — probable ___ — with / without inguinal lymphadenopathy and co-existing STI ___; VDRL / HIV / HBV status ___.","pearls":["Clinical diagnosis alone is unreliable — test for syphilis, herpes and HIV in every patient.","Use syndromic management where labs are not available, as per national guidelines.","Notify and treat partners; counsel on condoms."]},{"n":"Gonorrhoea / urethral discharge","g":"Sexually transmitted infections","t":"Long case","cc":["Discharge from urethra for ___ days (men)","Burning while passing urine","Increased vaginal discharge, bleeding between periods, pain during intercourse (women)"],"hx":[{"h":"Discharge","i":[["Date of last sexual exposure","Gonorrhoea appears in 2–7 days; non-gonococcal urethritis takes 1–3 weeks"],["Thick yellow-green and profuse vs thin, scanty, mucoid","Purulent discharge favours gonorrhoea; mucoid favours chlamydia and other NGU"],["Blood, threads in urine, morning drop","Severity and chronicity of urethritis"],["Burning, frequency, urgency","Urethritis vs urinary tract infection"]]},{"h":"Exposure","i":[["Vaginal, anal or oral sex; condom use","Rectal and throat infections need separate sampling and are often silent"],["Number of partners, sex worker contact, MSM","Risk of other STIs and HIV"],["Rectal discharge, pain, tenesmus; sore throat","Gonococcal proctitis and pharyngitis"]]},{"h":"Local complications — men","i":[["Painful swollen testis","Epididymo-orchitis"],["Perineal pain, painful ejaculation","Prostatitis"],["Tight foreskin, swollen glans","Balanoposthitis, phimosis, paraphimosis"],["Thin stream, straining; multiple openings on perineum","Urethral stricture or periurethral abscess and fistulae (old untreated infection)"]]},{"h":"Local complications — women","i":[["Lower abdominal pain, fever, painful intercourse","Pelvic inflammatory disease"],["Painful swelling at vaginal opening","Bartholin's abscess"],["Difficulty conceiving, ectopic pregnancy","Tubal damage from previous PID"],["Bleeding between periods or after sex, heavy periods","Cervicitis and endometritis"],["Burning on passing urin isease","Causes of trophic ulcers"]]},{"h":"Systemic / inflammatory","i":[["Fever, joint pains, mouth ulcers, malar rash, Raynaud's","Vasculitis or connective tissue disease"],["Bowel symptoms, arthritis, ulcer started after minor trauma and spread quickly","Pyoderma gangrenosum (IBD association)"],["Recurrent miscarriages, clots","Antiphospholipid syndrome"],["Sickle cell disease, polycythaemia, spherocytosis","Haematological ulcers"],["Cough, weight loss, TB contact","Tuberculous ulcer or erythema induratum"],["Sexual exposure","Gumma of tertiary syphilis"],["Severe hypertension","Martorell's hypertensive ulcer"]]},{"h":"Treatment and life","i":[["Dressings, antibiotics, compression, surgery; what helped","Guides management; compression is dangerous in arterial disease"],["Hydroxyurea, nicorandil, methotrexate","Drug-induced ulcers"],["Mobility, occupation, smoking, alcohol","Healing and recurrence"],["Family history of similar ulcers","Hereditary haemolytic anaemias, venous disease"]]}],"ex":[{"h":"General","i":["Pallor, clubbing, cyanosis, icterus, oedema, lymph nodes, BMI, BP","Stigmata of syphilis, diabetes, CTD"]},{"h":"Ulcer","i":["Number, size, site: medial gaiter area (venous), toes / heel / pressure points (arterial), sole and ball of foot (neuropathic), shin (gumma, PG, Martorell)","Shape: oval/crescentic (TB), serpiginous (syphilis), irregular (malignancy)","Edge: sloping (venous / healing), punched-out (arterial, gumma, trophic), undermined (TB, PG with violaceous rim), rolled pearly (BCC), everted (SCC)","Floor: healthy red granulation, pale, slough (wash-leather in gumma), exposed tendon or bone, black (melanoma, necrosis)","Base: induration (malignancy), fixity, bleeding on touch, depth, tenderness","Discharge: amount, colour (green — Pseudomonas), smell"]},{"h":"Surrounding skin and limb","i":["Varicose veins, oedema, haemosiderin pigmentation, stasis eczema, lipodermatosclerosis, atrophie blanche","Thin shiny hairless cold skin, pallor on elevation, delayed capillary refill (arterial)","Peripheral pulses (femoral to dorsalis pedis), ABPI, bruits","Sensation (monofilament), thickened nerves, deformity, callus","Regional lymph nodes; compare both limbs"]}],"inv":["ABPI (before compression); arterial and venous Doppler","CBC, ESR, blood sugar, HbA1c, lipids, RFT","Swab culture only if clinically infected","Biopsy from edge if atypical or not healing in 3 months","ANA, ANCA, antiphospholipid antibodies, cryoglobulins, hepatitis B/C when vasculitis suspected","VDRL, Mantoux / IGRA; X-ray for osteomyelitis"],"ddx":[["Venous ulcer","Gaiter area, sloping edge, oedema, pigmentation, lipodermatosclerosis"],["Arterial ulcer","Toes / pressure points, punched-out, painful, absent pulses, low ABPI"],["Neuropathic ulcer","Sole pressure points, painless, callus rim, sensory loss"],["Pyoderma gangrenosum","Rapid, violaceous undermined edge, very painful, pathergy"],["Vasculitic / Martorell","Multiple, purpura, livedo; or severe hypertension, very painful"],["Infective","Tuberculous, gumma, deep fungal, ecthyma"],["Malignant","SCC (Marjolin's), BCC, melanoma — rolled or everted edge, induration"]],"fmt":"A ___-year-old ___ with a ___ cm venous / arterial / neuropathic / mixed / ___ ulcer over ___ of ___ duration, ABPI ___, with / without infection, secondary to ___.","pearls":["Check ABPI before compression — compression is unsafe if ABPI < 0.8.","Biopsy any ulcer that is atypical or not healing after 3 months.","Pyoderma gangrenosum worsens with debridement (pathergy)."]},{"n":"Lymphogranuloma venereum","g":"Sexually transmitted infections","t":"Long case","cc":["Swelling in the groin for ___","Small painless genital sore that healed by itself (often unnoticed)","Rectal discharge, pain, bleeding (anorectal disease)","Swelling of genitals (late)"],"hx":[{"h":"Primary stage","i":[["Date of exposure","Incubation is 3–30 days"],["Small painless papule, blister or erosion that healed without scar","Primary lesion is transient and s; lupus is episodic"]]},{"h":"The 4 Ds","i":[["Loose stools — how long, how often, any blood or mucus","GI mucosal inflammation from niacin deficiency"],["Burning mouth, pain eating spicy food, red tongue","Glossitis and stomatitis"],["Sleeplessness, anxiety, memory loss, confusion, tremor, depression","Neuropsychiatric involvement — can progress to dementia"],["Severe illness, inability to eat","Untreated pellagra can be fatal"]]},{"h":"Cause","i":[["Diet: staple (maize or jowar), skipped meals, vegetables, pulses, eggs, meat; food fads","Maize-based diets lack available niacin and tryptophan"],["Alcohol intake","Commonest cause in adults — poor intake and absorption"],["Bloating, weight loss, greasy stools, symptoms after wheat; GI surgery","Malabsorption, coeliac disease, bariatric surgery"],["Isoniazid, anticonvulsants, 5-FU, 6-MP, azathioprine","Drugs that interfere with niacin metabolism"],["Flushing, wheeze, palpitations after cheese or chocolate","Carcinoid diverts tryptophan to serotonin"],["Unsteady gait, swaying, family history, childhood onset","Hartnup disease (tryptophan transport defect)"],["Anorexia, eating disorder, poverty, homelessness","Nutritional deprivation"]]},{"h":"Rule out mimics","i":[["Mouth ulcers, joint pains, malar rash","Lupus"],["Skin that blisters with knocks, extra facial hair","Porphyria cutanea tarda"],["Weight loss with good appetite, heat intolerance","Thyrotoxicosis can aggravate deficiency"]]},{"h":"Background","i":[["Pregnancy, lactation","Increased requirement"],["Socioeconomic status, family members with similar rash","Dietary deficiency affecting household"],["Smoking, recreational drugs","General health and nutrition"]]}],"ex":[{"h":"General","i":["Dehydration (pulse, BP, cold extremities), pallor, icterus, clubbing, oedema, BMI","Signs of chronic liver disease: flap, spider naevi"]},{"h":"Skin","i":["Bilaterally symmetrical, sharply demarcated erythema or dusky brown, thickened, scaly plaques on photo-exposed sites","Acute phase: vesicles, bullae (wet pellagra)","Backs of hands — gauntlet / glove; feet — boot; front of neck — Casal's necklace; face — butterfly","Look at perineal and genital skin for redness and raw areas","Nasolabial dyssebacea"]},{"h":"Mouth","i":["Dry cracked lips, angular cheilitis, red swollen tongue with atrophic papillae, oral ulcers, gingivitis"]},{"h":"Neuro and systems","i":["Level of consciousness, orientation, memory, mood, insight","Tremor, rigidity, ataxia, incoordination, cerebellar signs","Peripheral neuropathy: glove-and-stocking sensory loss, reflexes","Abdomen: hepatomegaly, ascites (alcohol-related liver disease)","CVS, RS"]},{"h":"Other deficiencies","i":["Pallor, koilonychia (iron); angular cheilitis and magenta tongue (riboflavin); Bitot's spots, phrynoderma (vitamin A); bleeding gums (vitamin C)"]}],"inv":["Urinary N-methylnicotinamide (if available) — low","CBC, serum proteins, albumin","LFT; other vitamin levels (B1, B2, B6, B12, zinc)","Stool examination; coeliac serology if malabsorption","Urinary 5-HIAA if carcinoid suspected; urine amino acids for Hartnup","Therapeutic trial — rapid response to niacinamide supports the diagnosis"],"ddx":[["Porphyria cutanea tarda / variegate porphyria","Blisters, scars, milia, hypertrichosis"],["Hartnup disease","Childhood onset, ataxia, family history"],["Drug-induced pellagroid reaction","Isoniazid, anticonvulsants"],["Phototoxic / photoallergic dermatitis","Exposure history, no systemic features"],["Lupus erythematosus","Malar rash, systemic and serological features"],["Chronic actinic / airborne contact dermatitis","Itchy lichenified eczema, Parthenium exposure"]],"fmt":"A ___-year-old ___ with pellagra (primary / secondary to ___) with dermatitis, diarrhoea, and neuropsychiatric features ___.","pearls":["Rapid improvement on niacinamide confirms the diagnosis.","Rarely isolated — look for and replace other B-vitamins and protein.","Always ask about alcohol and isoniazid."]},{"n":"Psoriasis","g":"Papulosquamous & erythroderma","t":"Long case","cc":["Red raised scaly plaques on ___ (knees, elbows, scalp) for ___ years; flare for ___ days","Itching (usually mild; can be marked in scalp, flexures or during flares)","Joint pain / swelling / stiffness for ___ (ask in every case)","Nail changes or dandruff-like scalp scaling (often not volunteered)"],"hx":[{"h":"Disease story","i":[["Age at first lesion","Onset before 40 (type I) has stronger family link and more severe course"],["Size and site of first lesion; how it spread","Drop-like lesions over days suggest guttate; slowly enlarging plaques suggest chronic plaque type"],["Course — continuous, waxing and waning, seasonal","Most worsen in winter; summer flares suggest photosensitive psoriasis"],["Healed lesions leaving pale areas","Post-inflammatory hypopigmentation and Woronoff's ring are typical"],["Current phase — new lesions, enlarging, or settling","Unstable (progressive) disease changes treatment choice"],["Scale — amount, loose or stuck, any smell","Thick adherent scale supports psoriasis; greasy scale suggests seborrhoeic dermatitis"]]},{"h":"Itch","i":[["Continuous or intermittent; mild, moderate, severe","Severe itch is more common in scalp, flexural and erythrodermic disease, and affects quality of life"]]},{"h":"Red flags","i":[["Redness spreading to whole body","Erythrodermic psoriasis — needs admission"],["Crops of pus spots with fever and chills","Generalised pustular psoriasis — an emergency"],["Flare soon after stopping steroids","Classic trigger for pustular or erythrodermic change"]]},{"h":"Triggers","i":[["New lesions at sites of scratches, injections, surgery, tattoos","Koebner phenomenon — sign of active disease"],["Sore throat or fever 2–3 weeks before a flare","Streptococcal infection triggers guttate psoriasis"],["Dental, skin or urinary infection; HIV risk factors","Infections trigger flares; HIV causes sudden severe psoriasis"],["Drugs — lithium, β-blockers, antimalarials (HCQ), ACE inhibitors, NSAIDs, terbinafine, interferon, oral hypoglycaemics","Drug-provoked or drug-aggravated psoriasis"],["Stress, alcohol, smoking","Worsen disease and reduce treatment response"],["Pregnancy, postpartum","Usually improves in pregnancy; can flare postpartum; pustular psoriasis of pregnancy"]]},{"h":"Mimics to rule out","i":[["Sexual exposure, urethral discharge, diarrhoea, red eyes","Reactive arthritis and secondary syphilis can mimic psoriasis"],["Rash worse in sun, mouth ulcers","Subacute cutaneous lupus can look psoriasiform"]]},{"h":"Joints","i":[["Pain in fingers, toes, wrists, knees, heels, lower back","Psoriatic arthritis can be peripheral, axial or enthesitic"],["Morning stiffness > 30 minutes; improves with activity","Inflammatory rather than mechanical joint pain"],["Swollen whole finger or toe (sausage digit)","Dactylitis — strongly suggests psoriatic arthritis"],["Difficulty with daily tasks, deformity","Indicates erosive disease needing systemic therapy"]]},{"h":"Comorbidities","i":[["Weight gain, diabetes, hypertension, high cholesterol, chest pain, palpitations","Psoriasis is linked to metabolic syndrome and heart disease"],["Fatty liver, alcohol use","Matters before methotrexate"],["Abdominal pain, bloating, diarrhoea, blood in stools","Inflammatory bowel disease association"],["Red painful eye, blurred vision","Uveitis"],["Low mood, poor sleep","Depression is common and affects adherence"]]},{"h":"Treatment history","i":[["Topicals: steroid potency, duration, amount; coal tar, salicylic acid, calcipotriol","Steroid overuse leads to rebound and tachyphylaxis"],["Systemics: methotrexate, acitretin, cyclosporine, biologics, apremilast — dose, duration, response, side effects","Guides next step"],["Phototherapy: type, number of sessions, response","Cumulative dose and skin cancer risk"],["Ayurvedic or unlabelled medicines","Often contain steroids"]]},{"h":"Background","i":[["Earlier attacks; any other skin conditions","Recurrence pattern"],["TB, e, non-erosive, unlike RA"]]},{"h":"Skin","i":[["Facial redness over cheeks and nose after sun","Malar rash — spares nasolabial folds"],["Burning, itching, blistering after sun; time since onset","Photosensitivity is a key criterion"],["Scaly patches leaving scars and pigment change on face, scalp, ears","Discoid lesions (DLE)"],["Ring-shaped scaly red patches on upper body","Subacute cutaneous lupus"],["Fingers turning white–blue–red in cold; finger ulcers","Raynaud's phenomenon and vasculopathy"],["Red spots or bruises on legs; hives lasting > 24 h","Vasculitis and urticarial vasculitis"],["Diffuse hair thinning, broken hairs at front","Non-scarring alopecia — 'lupus hair'"]]},{"h":"Mucosa","i":[["Mouth or nose ulcers — painful or painless; difficulty eating","Painless palatal ulcers are typical of SLE"]]},{"h":"Systems","i":[["Fever, weight loss, fatigue, body aches","Constitutional features of active disease"],["Chest pain on breathing, breathlessness","Pleuritis or pericarditis (serositis)"],["Palpitations, breathlessness on exertion","Myocarditis, pulmonary hypertension"],["Swelling of face or feet, frothy or red urine, reduced urine","Lupus nephritis — often silent until advanced"],["Seizures, psychosis, mood change, headache, stroke, numbness","Neuropsychiatric lupus"],["Pallor, bleeding, recurrent infections","Haemolytic anaemia, low platelets, low white cells"],["Abdominal pain, vomiting, diarrhoea","Serositis, mesenteric vasculitis or pancreatitis"]]},{"h":"Drugs and overlap","i":[["Hydralazine, procainamide, isoniazid, minocycline, anti-TNF, terbinafine before onset","Drug-induced lupus resolves on stopping the drug"],["Dry eyes and mouth","Sjögren's overlap"],["Skin tightening, difficulty swallowing","Scleroderma overlap / MCTD"],["Proximal weakness, purplish eyelids","Dermatomyositis overlap"]]},{"h":"Treatment","i":[["HCQ, steroids, immunosuppressants — dose, duration, response","Treatment response and current activity"],["Eye check on HCQ; steroid si rent contraception","Pregnancy planning on immunosuppressants"],["Effect on eating, work, family; days lost","Quality of life"]]}],"ex":[{"h":"General","i":["Pallor, icterus, oedema, lymph nodes; weight, BMI","Temperature, pulse, BP, hydration (sepsis, fluid loss)","Cushingoid features, signs of steroid side effects"]},{"h":"Skin","i":["Distribution and % BSA; areas spared (palms, soles)","Vesicles / bullae: flaccid or tense; clear, turbid or haemorrhagic fluid; on normal or erythematous / urticarial base","Erosions — size, tendency to extend; crusts (cornflake in foliaceus); vegetative plaques in flexures (vegetans)","Healing with pigmentation; scarring and milia","Smell (secondary infection)"]},{"h":"Signs","i":["Nikolsky sign — direct and marginal","Bulla-spread (Asboe-Hansen) sign","Pseudo-Nikolsky (bullous drug eruptions, TEN)"]},{"h":"Mucosa and appendages","i":["Oral: buccal, palate, gingiva, tongue — erosions with slough; desquamative gingivitis","Eyes: conjunctival erosions, symblepharon (MMP)","Genital and anal erosions","Nails: paronychia, shedding; scalp erosions","Oral hygiene, dental state, oral candidiasis (on steroids)"]},{"h":"Scoring","i":["Record a lesion count (blisters, erosions, crusts) at every visit to track activity","PDAI (pemphigus) or BPDAI (pemphigoid)","Unrelated findings: nevi, vitiligo, striae, steroid acne, purpura"]}],"inv":["Tzanck smear — acantholytic cells (pemphigus)","Biopsy of fresh blister for H&E; perilesional biopsy for DIF","Salt-split skin IIF; ELISA for Dsg1, Dsg3, BP180, BP230","CBC, sugar, LFT, RFT, electrolytes, albumin","Before immunosuppression: TB screen, chest X-ray, HBsAg, HCV, HIV, bone density, eye exam","Swab culture if infected; CT for malignancy if paraneoplastic suspected"],"ddx":[["Pemphigus vulgaris","Oral erosions first, flaccid bullae, Nikolsky +, intraepidermal acantholysis"],["Pemphigus foliaceus / erythematosus","Superficial crusts, seborrhoeic distribution, no mucosal lesions"],["Bullous pemphigoid" const CASES = (() => { try{ return JSON.parse(document.getElementById("casesData").textContent); }catch{ return []; } })();
CASES.forEach((c,i)=>{ c.i=i; const fl=a=>(a||[]).flatMap(x=>typeof x==="string"?[x]:Array.isArray(x)?x.flat(2):[x.h||"",...(x.i||[]).flat(2)]); c.hay=[c.n,c.g,c.t,...fl(c.cc),...fl(c.hx),...fl(c.ddx),...fl(c.ex),c.fmt||"",...fl(c.pearls),...fl(c.inv)].join(" ").toLowerCase(); });
const CASE_SECS=[["cc","Chief complaints"],["hx","History to ask"],["ddx","Differentials"],["ex","Relevant examination findings"],["fmt","How to present the diagnosis"]];
const isAddedLine = s => /^\+ /.test(s);
const cleanLine = s => String(s).replace(/^\+ /,"");
const caseKind = c => c.t==="Long case" ? "Long case" : "Short case";
function searchCases(q, filter="All"){
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);
  let arr=CASES.filter(c=>filter==="All"||caseKind(c)===filter);
  if(words.length){
    arr=arr.filter(c=>words.every(w=>c.hay.includes(w)));
    const ql=words.join(" "); const nm=c=>{ const n=c.n.toLowerCase(); return n===ql?0 : n.startsWith(ql)?1 : n.split(/[^a-z]+/).some(x=>x.startsWith(words[0]))&&words.every(w=>n.includes(w))?2 : words.every(w=>n.includes(w))?3 : 4; };
    arr.sort((a,b)=>nm(a)-nm(b)||a.n.localeCompare(b.n));
  }
  return arr;
}
function caseDetailHTML(c){
  const secs=a=>(a||[]).map(x=>typeof x==="string"?{h:"",i:[x]}:x);
  const list=(k,label,ico,arr)=>{ const ss=secs(arr); if(!ss.length) return "";
    return `<section class="csec k-${k}"><h3><span class="kico">${ico}</span>${esc(label)}</h3>${ss.map(x=>`${x.h?`<h4 class="csub">${esc(x.h)}</h4>`:""}<ul class="clist">${x.i.map(t=>Array.isArray(t)?`<li>${esc(t[0])}${t[1]?`<span class="cwhy"><b>Why ask:</b> ${esc(t[1])}</span>`:""}</li>`:`<li>${esc(t)}</li>`).join("")}</ul>`).join("")}</section>`; };
  const ddx=(c.ddx||[]).length?`<section class="csec k-ddx"><h3><span class="kico">${(c.inv||[]).length?5:4}</span>Differential diagnosis</h3><div class="ddxt">${c.ddx.map(d=>Array.isArray(d)?`<div class="ddxr"><b>${esc(d[0])}</b><span>${esc(d[1]||"")}</span></div>`:`<div class="ddxr"><b>${esc(d)}</b><span></span></div>`).join("")}</div></section>`:"";
  const fmt=c.fmt?`<section class="csec k-fmt"><h3><span class="kico">✓</span>How to present the case</h3><blockquote class="cfmt">${esc(Array.isArray(c.fmt)?c.fmt.join(" "):c.fmt)}</blockquote></section>`:"";
  const pearls=(c.pearls||[]).length?`<section class="csec k-pearl"><h3><span class="kico">★</span>Viva pearls</h3><ul class="clist">${c.pearls.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></section>`:"";
  return `<div class="case-head"><h2 class="case-title">${esc(c.n)}</h2>
    <div class="case-meta"><span class="pill">${esc(c.g)}</span><span class="pill ${c.t==="Long case"?"rose":""}">${esc(c.t)}</span></div></div>
    ${ladderFor(c.n)?`<button class="btn primary sm txbtn" type="button" data-txcase="${esc(c.n)}">💊 Treatment · 1st / 2nd / 3rd line</button>`:(!hasFull()&&S.templates.length?`<button class="btn sm txbtn" type="button" data-act="acct">🔒 Treatment guide · verified doctors</button>`:"")}
    ${scoreSuggestHTML(c.n)}
    ${list("cc","Presenting complaints","1",c.cc)}${list("hx","History to ask","2",c.hx)}${list("ex","Examination","3",c.ex)}${(c.inv||[]).length?list("inv","Investigations","4",c.inv):""}${ddx}${fmt}${pearls}`;
}
function caseRowsHTML(arr, grouped, open){
  const row = c => `<button class="row" data-case="${c.i}"><span class="main"><span class="t">${esc(c.n)}</span><span class="s">${esc(cleanLine((c.cc||[])[0]||""))}</span></span><span class="aside">${c.t==="Long case"?`<span class="pill rose">Long</span>`:""}</span></button>`;
  if(!grouped) return `<div class="list" style="margin-top:10px">${arr.map(row).join("")}</div>`;
  const by={}; arr.forEach(c=>(by[c.g] ||= []).push(c));

}

WT_DOSE.forEach(e=>{ try{ e.re=new RegExp(e.match,"i"); }catch{ e.re=null; } });
const wtFor = text => { const t=String(text||""); return t ? WT_DOSE.filter(e=>e.re && e.re.test(t)) : []; };
const wr1 = x => x==null||isNaN(x) ? "" : (Math.abs(x)>=100?Math.round(x):Math.abs(x)>=10?Math.round(x*10)/10:Math.round(x*100)/100).toString();
function wtPractical(target, strengths){
  // nearest dose using up to 2 tablets of one strength, or one each of two strengths
  if(!strengths?.length || !target) return null;
  const c=new Set(); strengths.forEach(a=>{ c.add(a); c.add(2*a); c.add(a/2); strengths.forEach(b=>c.add(a+b)); });
  let best=null; c.forEach(v=>{ if(v>0 && (best==null || Math.abs(v-target)<Math.abs(best-target))) best=v; }); return best;
}
function wtCompute(e, w, hcm, age){
  const out={warn:[], lines:[]}; const u=e.unit; const per={day:"/day",dose:"per dose",week:"/week",course:"total course"}[e.per]||"";
  if(e.minAge && age!=="" && !isNaN(age) && +age<e.minAge) out.warn.push(`Not for under ${e.minAge} years`);
  if(e.pop==="child" && age!=="" && +age>=18) out.warn.push("This is a children's dose");
  if(e.pop==="adult" && age!=="" && +age<12) out.warn.push("This is an adult dose");
  let lo=null, hi=null;
  if(e.basis==="band"){
    if(!w){ out.need="weight"; return out; }
    const b=e.bands.find(b=>w>=b.min && w<b.max) || e.bands.find(b=>w>=b.min&&w<=b.max);
    out.band = b ? b.dose : (w<e.bands[0]?.min ? `Below ${e.bands[0].min} kg — not covered; check a paediatric reference` : "Weight outside the listed bands");
    return out;
  }
  if(e.basis==="fixed"){ lo=e.lo; hi=e.hi; }
  else if(e.basis==="kg"){ if(!w){ out.need="weight"; return out; } lo=e.lo!=null?e.lo*w:null; hi=e.hi!=null?e.hi*w:null; out.basisTxt=`${e.lo!=null&&e.lo!==e.hi?e.lo+"–":(e.lo==null?"up to ":"")}${e.hi} ${u}/kg ${per}`; }
  else if(e.basis==="m2"){ if(!w||!hcm){ out.need="height"; return out; } const bsa=Math.sqrt(w*hcm/3600); out.bsa=bsa; lo=e.lo!=null?e.lo*bsa:null; hi=e.hi!=null?e.hi*bsa:null; out.basisTxt=`${e.lo!=null&&e.lo!==e.hi?e.lo+"–":""}${e.hi} ${u}/m² ${per} · BSA ${wr1(bsa)} m²`; }
  if(e.max!=null && (e.maxPer===e.per || !e.maxPer)){ if(hi!=null && hi>e.max){ hi=e.max; out.capped=true; } if(lo!=null && lo>e.max) lo=e.max; }
  out.lo=lo; out.hi=hi; out.per=per;
  const rng = (a,b) => a!=null && b!=null && wr1(a)!==wr1(b) ? `${wr1(a)}–${wr1(b)} ${u}` : `${b!=null?(a==null?"up to ":"")+wr1(b):wr1(a)} ${u}`;
  out.lines.push(`${rng(lo,hi)} ${per}${out.capped?` (capped at max ${e.max} ${u})`:""}`);
  if(e.per==="day" && e.div && e.div>1){ out.lines.push(`= ${rng(lo!=null?lo/e.div:null, hi!=null?hi/e.div:null)} per dose × ${e.div} doses a day`); out.perDose=[lo!=null?lo/e.div:null, hi!=null?hi/e.div:null]; }
  else out.perDose=[lo,hi];
  const tgt = out.perDose[0]!=null && out.perDose[1]!=null ? (out.perDose[0]+out.perDose[1])/2 : (out.perDose[1] ?? out.perDose[0]);
  if(e.per!=="course"){ const p=wtPractical(tgt, e.strengths); if(p) out.practical=p; }
  const lq=String(e.liquid||"").match(/([\d.]+)\s*mg\s*(?:\+[^/]*)?\/\s*([\d.]+)\s*mL/i);
  if(lq && e.per!=="course" && tgt){ const mgPerMl=+lq[1]/+lq[2]; out.liquidTxt=`Liquid ${lq[0]}: ≈ ${wr1(tgt/mgPerMl)} mL per dose`; }
  if(e.max!=null && e.maxPer && e.maxPer!==e.per) out.lines.push(`Max ${e.max} ${u} ${({day:"/day",dose:"per dose",week:"/week",course:"per course"})[e.maxPer]||""}`);
  return out;
}
function wtCalcHTML(list, d){
  const opts=list.map((e,i)=>`<option value="${i}">${esc(e.drug)} — ${esc(e.ind)}${e.pop==="child"?" (child)":e.pop==="adult"?" (adult)":""}</option>`).join("");
  return `<div class="stack wtc">
    <div class="grid" style="gap:8px"><div class="field"><label for="wtW">Weight (kg)</label><input id="wtW" type="number" inputmode="decimal" min="1" max="300" step="0.1" value="${esc(d.w||"")}"></div>
      <div class="field"><label for="wtA">Age (years)</label><input id="wtA" type="number" inputmode="decimal" min="0" max="120" value="${esc(d.age||"")}"></div>
      <div class="field"><label for="wtH">Height (cm) <small class="hint">for m² doses</small></label><input id="wtH" type="number" inputmode="decimal" min="40" max="230" value="${esc(d.h||"")}"></div></div>
    ${list.length>8?`<input id="wtQ" class="inp" type="search" placeholder="Filter drugs, e.g. griseofulvin" autocomplete="off">`:""}
    <div class="field"><label for="wtSel">Drug and indication</label><select id="wtSel" class="inp">${opts}</select></div>
    <div id="wtOut"></div></div>`;
}
function wireWtCalc(root, list, onUse){
  const sel=root.querySelector("#wtSel"), out=root.querySelector("#wtOut"); let shown=list.map((e,i)=>i);
  const draw=()=>{
    const e=list[+sel.value]; if(!e){ out.innerHTML=""; return; }
    const w=parseFloat(root.querySelector("#wtW").value)||0, h=parseFloat(root.querySelector("#wtH").value)||0, a=root.querySelector("#wtA").value;
    const r=wtCompute(e,w,h,a);
    const main = r.need==="weight" ? `<p class="hint" style="margin:0">Enter the weight.</p>` : r.need==="height" ? `<p class="hint" style="margin:0">This dose is per m² of body surface — enter weight and height.</p>`
      : r.band ? `<div class="wtres"><b>${esc(r.band)}</b></div>`
      : `<div class="wtres"><b>${esc(r.lines[0])}</b>${r.lines.slice(1).map(l=>`<div>${esc(l)}</div>`).join("")}${r.practical?`<div>Practical: <b>${wr1(r.practical)} ${esc(e.unit)}</b> per dose${e.strengths?.length?` <span class="hint">(strengths ${esc(e.strengths.join(", "))} ${esc(e.unit)})</span>`:""}</div>`:""}${r.liquidTxt?`<div>${esc(r.liquidTxt)}</div>`:""}</div>`;
    out.innerHTML = `${r.warn.map(x=>`<p class="wtwarn">⚠ ${esc(x)}</p>`).join("")}${main}
      <p class="hint" style="margin:6px 0 0">${r.basisTxt?esc(r.basisTxt)+" · ":""}${esc([e.freq, e.dur].filter(Boolean).join(" · "))}</p>
      ${e.note?`<p class="hint" style="margin:4px 0 0">${esc(e.note)}</p>`:""}
      <p class="hint" style="margin:4px 0 0;font-size:11.5px">${reviewBadge("wt:"+e.id)} Check the dose yourself before prescribing.</p>
      ${onUse && !r.need?`<div class="actions" style="margin-top:8px"><button class="btn primary sm" type="button" id="wtUse">Use this dose</button></div>`:""}`;
    out.querySelector("#wtUse")?.addEventListener("click",()=>{
      let dose; if(r.band) dose=r.band; else { const pd=r.practical?`${wr1(r.practical)} ${e.unit}`:(r.perDose[1]!=null?`${wr1(r.perDose[0]??r.perDose[1])}${r.perDose[0]!=null&&wr1(r.perDose[0])!==wr1(r.perDose[1])?"–"+wr1(r.perDose[1]):""} ${e.unit}`:""); dose=pd; }
      const instr=[w?`${w} kg`:"", r.lines[0]&&!r.band?`(${r.lines[0]})`:"", e.note].filter(Boolean).join(" ");
      onUse({drug:e.drug, dose, freq:e.freq||"", dur:e.dur||"", instr, route:/\b(IV|pulse|IVIG|rituximab|injection)\b/i.test(e.drug+" "+e.ind)?"Injection":"Oral", weight:w, age:a, h});
    });
  };
  sel.addEventListener("change",draw); ["#wtW","#wtA","#wtH"].forEach(s=>root.querySelector(s).addEventListener("input",draw));
  root.querySelector("#wtQ")?.addEventListener("input",ev=>{ const q=ev.target.value.toLowerCase().trim(); const cur=sel.value; shown=list.map((e,i)=>i).filter(i=>!q||(list[i].drug+" "+list[i].ind).toLowerCase().includes(q)); sel.innerHTML=shown.map(i=>`<option value="${i}">${esc(list[i].drug)} — ${esc(list[i].ind)}${list[i].pop==="child"?" (child)":list[i].pop==="adult"?" (adult)":""}</option>`).join(""); if(shown.includes(+cur)) sel.value=cur; draw(); });
  // default: pick child/adult entry matching age
  const pickByAge=()=>{ const a=parseFloat(root.querySelector("#wtA").value); if(isNaN(a)) return; const i=[...sel.options].map(o=>+o.value).find(i=>list[i].pop===(a<18?"child":"adult")); if(i!=null && list.length<=8) sel.value=i; };
  pickByAge(); draw();
}
function patientCtx(){ return {w:$("#ppWt")?.value||"", age:$("#ppAge")?.value||"", h:""}; }
function openWtCalc(onUse, filterText, main){
  const list = filterText ? wtFor(filterText) : WT_DOSE; const L=list.length?list:WT_DOSE;
  (main?openSheet:openSheet2)("Dose by weight", wtCalcHTML(L, patientCtx()) + `<p class="hint">Doses from standard dermatology references, WHO, BNF for Children and IADVL. Always confirm before prescribing, especially for children.</p>`);
  wireWtCalc($(main?"#sheetBody":"#sheet2Body"), L, onUse ? v=>{ onUse(v); closeSheet2(); } : null);
}

raindicated combination; choose terbinafine or another antipsychotic.","ref":"Wolverton 4e ch 10 p.109 (PDF 139); Wolverton 4e ch 10 p.111 (PDF 141)"},{"a":"itraconazole","b":"qt-drugs","sev":"serious","effect":"Additive QT prolongation and raised levels of several QT drugs (quinidine, dofetilide, methadone).","action":"Avoid with quinidine/dofetilide/disopyramide/methadone; otherwise baseline ECG and correct K/Mg.","ref":"Wolverton 4e ch 10 p.109 (PDF 139); Wolverton 4e ch 10 p.111 (PDF 141)"},{"a":"itraconazole","b":"domperidone","sev":"contra","effect":"Domperidone levels rise; QT prolongation and arrhythmia risk.","action":"Do not co-prescribe; use a non-QT antiemetic/prokinetic.","ref":"label"},{"a":"itraconazole","b":"dapsone","sev":"serious","effect":"Higher dapsone exposure; more haemolysis and methaemoglobinaemia.","action":"Monitor haemoglobin and symptoms of methaemoglobinaemia; consider lower dapsone dose.","ref":"Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"itraconazole","b":"vka","sev":"serious","effect":"Anticoagulant effect increased; bleeding risk.","action":"Check INR within 5-7 days of starting and stopping; adjust dose.","ref":"Wolverton 4e ch 10 p.112 (PDF 142); Wolverton 4e ch 66 p.740 (PDF 961)"},{"a":"itraconazole","b":"doacs","sev":"contra","effect":"Strong CYP3A4 + P-gp inhibition raises DOAC levels; major bleeding risk.","action":"Avoid together; choose terbinafine or seek cardiology advice.","ref":"label"},{"a":"itraconazole","b":"colchicine","sev":"contra","effect":"Colchicine accumulates (CYP3A4 + P-gp); potentially fatal toxicity.","action":"Avoid; if unavoidable cut colchicine dose and stop both at GI or muscle symptoms.","ref":"Wolverton 4e ch 66 p.738 (PDF 959); Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"itraconazole","b":"ccb-dhp","sev":"monitor","effect":"Raised dihydropyridine levels; ankle oedema, hypotension, flushing.","action":"Watch BP and oedema; felodipine and nisoldipine best avoided.","ref":"Wolverton 4e ch 66 p.737 (PDF 958)"},{"a":"itraconazole","b":"ccb-ndhp","sev":"serious","effect":"Higher diltiazem/verapamil levels plus additive negative inotropy; bradycardia, heart failure.","action":"Avoid if heart failure; otherwise monitor pulse, BP and oedema.","ref":"Wolverton 4e ch 10 p.112 (PDF 142); label"},{"a":"itraconazole","b":"digoxin","sev":"serious","effect":"P-glycoprotein inhibition can raise digoxin 2-4 fold; toxicity.","action":"Check digoxin level and pulse; reduce digoxin dose as needed.","ref":"Wolverton 4e ch 66 p.729 (PDF 950)"},{"a":"itraconazole","b":"ppi-h2","sev":"monitor","effect":"Reduced gastric acid lowers capsule absorption; possible treatment failure.","action":"Take capsule with acidic drink/food, consider SB formulation or terbinafine.","ref":"Wolverton 4e ch 66 p.727 (PDF 948); Wolverton 4e ch 66 p.737 (PDF 958)"},{"a":"itraconazole","b":"antacids-minerals","sev":"monitor","effect":"Antacids impair itraconazole capsule absorption.","action":"Give itraconazole at least 2 hours before antacids.","ref":"Wolverton 4e ch 66 p.731 (PDF 952)"},{"a":"itraconazole","b":"rifampicin","sev":"serious","effect":"Rifampicin induction slashes itraconazole levels; likely treatment failure.","action":"Avoid relying on itraconazole; choose an alternative antifungal.","ref":"Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"itraconazole","b":"aed-inducers","sev":"monitor","effect":"Inducers lower itraconazole levels; itraconazole may raise carbamazepine levels.","action":"Expect reduced antifungal efficacy; monitor anticonvulsant levels/toxicity.","ref":"Wolverton 4e ch 10 p.112 (PDF 142); Wolverton 4e ch 10 p.109 (PDF 139); Wolverton 4e ch 10 p.111 (PDF 141)"},{"a":"itraconazole","b":"ritonavir","sev":"serious","effect":"Mutual CYP3A4 inhibition; raised levels of both drugs.","action":"Limit itraconazole dose and coordinate with HIV physician.","ref":"Wolverton 4e ch 66 p.728 (PDF 949); label"},{"a":"itraconazole","b":"steroids","sev":"serious","effect":"Raised levels of methylprednisolone/dexamethasone; more steroid side effects.","action":"Use lowest steroid dose; watch glucose, BP and Cushingoid effects.","ref":"Wolverton 4e ch 13 p.152 (PDF 191)"},{"a":"itraconazole","b":"tofacitinib","sev":"serious","effect":"Potent CYP3A4 inhibition raises tofacitinib exposure.","action":"Limit tofacitinib to 5 mg once daily during the azole course.","ref":"Wolverton 4e ch 18 p.206 (PDF 264); label"},{"a":"itraconazole","b":"upadacitinib","sev":"serious","effect":"Strong CYP3A4 inhibition raises upadacitinib exposure; more infections/cytopenias.","action":"Use lowest upadacitinib dose (15 mg) and monitor.","ref":"label"},{"a":"itraconazole","b":"dapoxetine","sev":"contra","effect":"Strong CYP3A4 inhibitor markedly raises dapoxetine; syncope risk.","action":"Contraindicated; stop dapoxetine during and 2 weeks after itraconazole.","ref":"label"},{"a":"itraconazole","b":"ebastine-rupatadine","sev":"serious","effect":"Raised ebastine/rupatadine levels; QT prolongation risk.","action":"Switch to cetirizine, levocetirizine, fexofenadine or bilastine.","ref":"Wolverton 4e ch 10 p.112 (PDF 142); label"},{"a":"fluconazole","b":"vka","sev":"serious","effect":"CYP2C9 inhibition can double or triple INR, even after a single dose.","action":"Check INR within 3-5 days; reduce warfarin or use topical/terbinafine.","ref":"Wolverton 4e ch 66 p.732 (PDF 953); Wolverton 4e ch 66 p.737 (PDF 958); Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"fluconazole","b":"phenytoin","sev":"serious","effect":"Phenytoin clearance falls; toxicity (ataxia, nystagmus).","action":"Monitor phenytoin level and symptoms; reduce dose if needed.","ref":"Wolverton 4e ch 66 p.737 (PDF 958); Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"fluconazole","b":"valproate","sev":"serious","effect":"Valproate levels may rise; toxicity.","action":"Monitor clinically and with levels if prolonged course.","ref":"Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"fluconazole","b":"sulfonylureas","sev":"monitor","effect":"CYP2C9 inhibition raises sulfonylurea levels; hypoglycaemia.","action":"Increase glucose monitoring; warn patient.","ref":"Wolverton 4e ch 10 p.109 (PDF 139); Wolverton 4e ch 10 p.111 (PDF 141); label"},{"a":"fluconazole","b":"statins-2c9","sev":"serious","effect":"Rosuvastatin/fluvastatin/pitavastatin exposure rises; myopathy.","action":"Pause or reduce statin during longer courses; report muscle pain.","ref":"Wolverton 4e ch 39 p.441 (PDF 573); Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"fluconazole","b":"statins-simva-lova","sev":"serious","effect":"At doses above 200 mg/day CYP3A4 inhibition raises statin levels; myopathy.","action":"Avoid with high-dose fluconazole; pause statin.","ref":"Wolverton 4e ch 39 p.441 (PDF 573)"},{"a":"fluconazole","b":"cyclosporine","sev":"serious","effect":"Cyclosporine levels rise, especially at fluconazole ≥200-300 mg/day.","action":"Check cyclosporine trough and creatinine.","ref":"Wolverton 4e ch 10 p.109 (PDF 139); Wolverton 4e ch 10 p.111 (PDF 141); Wolverton 4e ch 17 p.194 (PDF 249)"},{"a":"fluconazole","b":"tacrolimus-oral","sev":"serious","effect":"Tacrolimus levels rise; nephrotoxicity.","action":"Monitor tacrolimus trough and creatinine.","ref":"Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"fluconazole","b":"pimozide","sev":"contra","effect":"QT prolongation and torsades.","action":"Contraindicated combination.","ref":"Wolverton 4e ch 10 p.109 (PDF 139); Wolverton 4e ch 10 p.111 (PDF 141)"},{"a":"fluconazole","b":"clarithro-erythro","sev":"contra","effect":"Erythromycin with fluconazole risks QT prolongation and sudden cardiac death.","action":"Contraindicated (erythromycin); prefer azithromycin or non-macrolide with ECG caution.","ref":"Wolverton 4e ch 10 p.109 (PDF 139); Wolverton 4e ch 10 p.111 (PDF 141)"},{"a":"fluconazole","b":"qt-drugs","sev":"serious","effect":"Additive QT prolongation; torsades risk.","action":"Avoid where possible; ECG and electrolytes if combined.","ref":"Wolverton 4e ch 10 p.109 (PDF 139); Wolverton 4e ch 10 p.111 (PDF 141)"},{"a":"fluconazole","b":"tca","sev":"serious","effect":"Raised doxepin/amitriptyline levels; sedation, QT prolongation.","action":"Use lower TCA dose; monitor sedation and ECG.","ref":"Wolverton 4e ch 10 p.112 (PDF 142)"},{"a":"fluconazole","b":"tofacitinib","sev":"serious","effect":"Fluconazole (CYP3A4 + 2C19) raises tofacitinib exposure.","action":"Limit tofacitinib to 5 mg once daily.","ref":"Wolverton 4e ch 18 p.206 (PDF 264); label"},{"a":"fluconazole","b":"abrocitinib","sev":"serious","effect":"Strong CYP2C19 inhibition raises abrocitinib exposure.","action":"Halve the abrocitinib dose during fluconazole.","ref":"label"},{"a":"fluconazole","b":"domperidone","sev":"serious","effect":"Raised domperidone levels plus additive QT effect.","action":"Avoid; choose another antiemetic.","ref":"label"},{"a":"ketoconazole","b":"statins-simva-lova","sev":"contra","effect":"Potent CYP3A4 inhibition; rhabdomyolysis.","action":"Contraindicated; withhold statin.","ref":"Wolverton 4e ch 66 p.739 (PDF 960)"},{"a":"ketoconazole","b":"cyclosporine","sev":"serious","effect":"Can cut cyclosporine needs by 60-80%; toxicity if unadjusted.","action":"Avoid; if combined, frequent levels and creatinine.","ref":"Wolverton 4e ch 66 p.738 (PDF 959); Wolverton 4e ch 17 p.194 (PDF 249)"},{"a":"ketoconazole","b":"benzos-3a4","sev":"contra","effect":"Profound prolonged sedation with oral midazolam/triazolam/alprazolam.","action":"Contraindicated.","ref":"Wolverton 4e ch 66 p.737 (PDF 958); label"},{"a":"ketoconazole","b":"pimozide","sev":"contra","effect":"QT prolongation and fatal arrhythmia.","action":"Contraindicated.","ref":"Wolverton 4e ch 66 p.740 (PDF 961); label"},{"a":"ketoconazole","b":"qt-drugs","sev":"contra","effect":"Raised levels of QT-prolonging CYP3A4 substrates; torsades.","action":"Contraindicated with quinidine, dofetilide, methadone, disopyramide; avoid others.","ref":"label"},{"a":"ketoconazole","b":"domperidone","sev":"contra","effect":"Domperidone levels rise markedly; QT prolongation.","action":"Contraindicated.","ref":"label"},{"a":"ketoconazole","b":"colchicine","sev":"contra","effect":"Colchicine toxicity, potentially fatal.","action":"Avoid.","ref":"Wolverton 4e ch 40 p.452 (PDF 587); Wolverton 4e ch 66 p.738 (PDF 959)"},{"a":"ketoconazole","b":"doacs","sev":"contra","effect":"Large rise in DOAC levels; bleeding.","action":"Avoid combination.","ref":"label"},{"a":"terbinafine","b":"tca","sev":"serious","effect":"Strong CYP2D6 inhibition raises doxepin/amitriptyline; sedation, anticholinergic and cardiac toxicity, lasting weeks.","action":"Lower TCA dose or monitor closely during and for weeks after terbinafine.","ref":"Wolverton 4e ch 10 p.110 (PDF 140); Wolverton 4e ch 66 p.738 (PDF 959)"},{"a":"terbinafine","b":"beta-blockers","sev":"serious","effect":"CYP2D6 inhibition raises propranolol/metoprolol; bradycardia, hypotension.","action":"Check pulse and BP; reduce beta-blocker dose if needed.","ref":"Wolverton 4e ch 10 p.110 (PDF 140); Wolverton 4e ch 66 p.736 (PDF 957)"},{"a":"terbinafine","b":"ssri-2d6","sev":"serious","effect":"Fluoxetine/paroxetine and terbinafine raise each other's levels via CYP2D6.","action":"Monitor for serotonergic and other adverse effects; consider dose reduction.","ref":"Wolverton 4e ch 10 p.110 (PDF 140)"},{"a":"terbinafine","b":"pimozide","sev":"serious","effect":"Raised pimozide levels; QT prolongation.","action":"Avoid if possible; ECG monitoring if combined.","ref":"Wolverton 4e ch 10 p.110 (PDF 140)"},{"a":"terbinafine","b":"opioids","sev":"serious","effect":"CYP2D6 block: codeine/tramadol lose analgesic effect; other opioids may accumulate.","action":"Prefer non-CYP2D6 analgesics; monitor pain control.","ref":"Wolverton 4e ch 10 p.110 (PDF 140); Wolverton 4e ch 66 p.738 (PDF 959)"},{"a":"griseofulvin","b":"coc","sev":"serious","effect":"Enzyme induction lowers hormone levels; contraceptive failure (griseofulvin is also teratogenic).","action":"Add barrier contraception during and for one cycle after.","ref":"Wolverton 4e ch 66 p.740 (PDF 961); Wolverton 4e ch 34 p.381 (PDF 496)"},{"a":"griseofulvin","b":"vka","sev":"monitor","effect":"Induction reduces warfarin effect.","action":"Check INR after starting and stopping.","ref":"Wolverton 4e ch 66 p.731 (PDF 952)"},{"a":"griseofulvin","b":"alcohol","sev":"monitor","effect":"Can intensify alcohol effects; flushing, tachycardia.","action":"Advise avoiding alcohol during treatment.","ref":"label"},{"a":"griseofulvin","b":"thalidomide","sev":"serious","effect":"Induction may undermine hormonal contraception during teratogenic thalidomide therapy.","action":"Avoid combination or use non-hormonal contraception.","ref":"Wolverton 4e ch 40 p.461 (PDF 596)"},{"a":"griseofulvin","b":"isotretinoin","sev":"monitor","effect":"May lower retinoid levels and weaken hormonal contraception.","action":"Ensure two contraceptive methods, one non-hormonal.","ref":"Wolverton 4e ch 22 p.258 (PDF 332)"},{"a":"clarithro-erythro","b":"statins-simva-lova","sev":"contra","effect":"CYP3A4 inhibition; myopathy, rhabdomyolysis.","action":"Contraindicated; pause statin or use azithromycin.","ref":"Wolverton 4e ch 9 p.80 (PDF 97); Wolverton 4e ch 66 p.740 (PDF 961); label"},{"a":"clarithro-erythro","b":"atorvastatin","sev":"serious","effect":"Raised atorvastatin; myopathy.","action":"Pause or limit atorvastatin; consider azithromycin.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"cyclosporine","sev":"serious","effect":"Cyclosporine levels rise; nephrotoxicity, hypertension.","action":"Prefer azithromycin; otherwise monitor levels and creatinine.","ref":"Wolverton 4e ch 9 p.80 (PDF 97); Wolverton 4e ch 17 p.194 (PDF 249)"},{"a":"clarithro-erythro","b":"tacrolimus-oral","sev":"serious","effect":"Tacrolimus levels rise; toxicity.","action":"Prefer azithromycin; monitor trough levels.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"benzos-3a4","sev":"serious","effect":"Raised midazolam/triazolam/alprazolam; excessive sedation.","action":"Avoid or reduce benzodiazepine dose.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"ccb-ndhp","sev":"serious","effect":"Raised diltiazem/verapamil; hypotension, bradycardia.","action":"Prefer azithromycin; monitor BP and pulse.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"dapsone","sev":"serious","effect":"Raised dapsone exposure; haemolysis, agranulocytosis risk.","action":"Monitor CBC and methaemoglobinaemia symptoms.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"vka","sev":"serious","effect":"Enhanced anticoagulation; bleeding.","action":"Check INR within 5-7 days.","ref":"Wolverton 4e ch 9 p.80 (PDF 97); Wolverton 4e ch 66 p.740 (PDF 961)"},{"a":"clarithro-erythro","b":"doacs","sev":"serious","effect":"Higher DOAC exposure; bleeding.","action":"Prefer azithromycin; monitor for bleeding.","ref":"label"},{"a":"clarithro-erythro","b":"colchicine","sev":"contra","effect":"Colchicine toxicity (CYP3A4 + P-gp), fatalities reported.","action":"Avoid; use azithromycin or withhold colchicine.","ref":"Wolverton 4e ch 40 p.452 (PDF 587); Wolverton 4e ch 66 p.738 (PDF 959); label"},{"a":"clarithro-erythro","b":"qt-drugs","sev":"serious","effect":"Additive QT prolongation; torsades.","action":"Avoid; choose a non-QT antibiotic.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"pimozide","sev":"contra","effect":"Fatal arrhythmias reported from raised pimozide.","action":"Contraindicated.","ref":"Wolverton 4e ch 66 p.740 (PDF 961); label"},{"a":"clarithro-erythro","b":"tca","sev":"serious","effect":"Additive QT prolongation; raised TCA levels.","action":"Avoid or monitor ECG.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"aed-inducers","sev":"serious","effect":"Raised carbamazepine/phenytoin levels; inducers also lower macrolide levels.","action":"Prefer azithromycin; monitor anticonvulsant levels.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"theophylline","sev":"serious","effect":"Theophylline levels rise; nausea, arrhythmia, seizures.","action":"Prefer azithromycin; monitor theophylline level.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"clarithro-erythro","b":"digoxin","sev":"serious","effect":"Digoxin toxicity via gut flora/P-gp effects.","action":"Check digoxin level and symptoms.","ref":"Wolverton 4e ch 9 p.81 (PDF 98)"},{"a":"clarithro-erythro","b":"steroids","sev":"serious","effect":"Raised methylprednisolone/dexamethasone levels; steroid toxicity.","action":"Monitor glucose, BP; consider dose reduction.","ref":"Wolverton 4e ch 13 p.152 (PDF 191)"},{"a":"clarithro-erythro","b":"hydroxyzine","sev":"serious","effect":"Additive QT prolongation.","action":"Use a non-sedating, non-QT antihistamine.","ref":"label"},{"a":"clarithro-erythro","b":"ebastine-rupatadine","sev":"serious","effect":"Raised ebastine/rupatadine levels; QT risk.","action":"Switch to cetirizine/levocetirizine/fexofenadine.","ref":"Wolverton 4e ch 9 p.80 (PDF 97); label"},{"a":"clarithro-erythro","b":"hcq","sev":"serious","effect":"Additive QT prolongation.","action":"Prefer non-macrolide; ECG if combined.","ref":"Wolverton 4e ch 21 p.243 (PDF 313)"},{"a":"clarithro-erythro","b":"domperidone","sev":"contra","effect":"Raised domperidone plus QT effect.","action":"Contraindicated.","ref":"label"},{"a":"clarithro-erythro","b":"dapoxetine","sev":"contra","effect":"Clarithromycin markedly raises dapoxetine.","action":"Contraindicated.","ref":"label"},{"a":"clarithro-erythro","b":"upadacitinib","sev":"serious","effect":"Strong CYP3A4 inhibition raises upadacitinib.","action":"Use 15 mg dose and monitor.","ref":"label"},{"a":"azithromycin","b":"qt-drugs","sev":"serious","effect":"Additive QT prolongation; torsades.","action":"Avoid where possible; ECG if high risk.","ref":"Wolverton 4e ch 9 p.80 (PDF 97)"},{"a":"azithromycin","b":"hcq","sev":"serious","effect":"Additive QT prolongation.","action":"Baseline ECG in at-risk patients.","ref":"Wolverton 4e ch 21 p.243 (PDF 313); label"},{"a":"azithromycin","b":"hydroxyzine","sev":"serious","effect":"Additive QT prolongation.","action":"Prefer non-QT antihistamine.","ref":"label"},{"a":"azithromycin","b":"pimozide","sev":"contra","effect":"QT-prolonging combination.","action":"Contraindicated.","ref":"label"},{"a":"azithromycin","b":"vka","sev":"monitor","effect":"Occasional INR rises reported.","action":"Check INR within a week.","ref":"Wolverton 4e ch 66 p.740 (PDF 961); Wolverton 4e ch 9 p.81 (PDF 98)"},{"a":"azithromycin","b":"cyclosporine","sev":"monitor","effect":"Isolated reports of cyclosporine toxicity.","action":"Monitor creatinine/levels.","ref":"Wolverton 4e ch 9 p.81 (PDF 98); Wolverton 4e ch 17 p.194 (PDF 249)"},{"a":"fluoroquinolones","b":"theophylline","sev":"serious","effect":"Ciprofloxacin blocks CYP1A2; theophylline toxicity, seizures.","action":"Avoid ciprofloxacin; monitor levels or choose levofloxacin.","ref":"Wolverton 4e ch 9 p.83 (PDF 100)"},{"a":"fluoroquinolones","b":"vka","sev":"serious","effect":"Increased INR and bleeding.","action":"Check INR frequently.","ref":"Wolverton 4e ch 9 p.83 (PDF 100); Wolverton 4e ch 66 p.740 (PDF 961)"},{"a":"fluoroquinolones","b":"qt-drugs","sev":"serious","effect":"Additive QT prolongation.","action":"Avoid; ECG if unavoidable.","ref":"Wolverton 4e ch 9 p.83 (PDF 100)"},{"a":"fluoroquinolones","b":"antidiabetics","sev":"serious","effect":"Severe hypo- or hyperglycaemia, especially elderly.","action":"Monitor glucose closely.","ref":"Wolverton 4e ch 9 p.83 (PDF 100)"},{"a":"fluoroquinolones","b":"steroids","sev":"serious","effect":"Higher risk of tendinitis and tendon rupture.","action":"Avoid if possible; stop at tendon pain.","ref":"Wolverton 4e ch 9 p.83 (PDF 100); Wolverton 4e ch 9 p.81 (PDF 98)"},{"a":"fluoroquinolones","b":"antacids-minerals","sev":"monitor","effect":"Cations chelate quinolones; absorption falls sharply.","action":"Give quinolone 2 h before or 6 h after.","ref":"Wolverton 4e ch 9 p.83 (PDF 100); Wolverton 4e ch 66 p.727 (PDF 948)"},{"a":"fluoroquinolones","b":"cyclosporine","sev":"serious","effect":"Ciprofloxacin may raise cyclosporine levels and nephrotoxicity.","action":"Monitor creatinine and levels.","ref":"Wolverton 4e ch 17 p.194 (PDF 249)"},{"a":"fluoroquinolones","b":"hcq","sev":"serious","effect":"Additive QT prolongation; seizure threshold lowered.","action":"ECG in at-risk patients.","ref":"Wolverton 4e ch 9 p.83 (PDF 100)"},{"a":"fluoroquinolones","b":"hydroxyzine","sev":"serious","effect":"Additive QT prolongation.","action":"Prefer non-QT antihistamine.","ref":"label"},{"a":"fluoroquinolones","b":"pimozide","sev":"contra","effect":"QT-prolonging combination; ciprofloxacin also raises pimozide.","action":"Contraindicated.","ref":"Wolverton 4e ch 66 p.740 (PDF 961); label"},{"a":"fluoroquinolones","b":"methotrexate","sev":"monitor","effect":"Ciprofloxacin reduces methotrexate excretion.","action":"Monitor CBC; more relevant at high MTX doses.","ref":"Wolverton 4e ch 66 p.740 (PDF 961)"},{"a":"tetracyclines","b":"isotretinoin","sev":"contra","effect":"Additive risk of pseudotumor cerebri.","action":"Avoid co-administration; stop tetracycline before isotretinoin.","ref":"Wolverton 4e ch 22 p.258 (PDF 332); Wolverton 4e ch 9 p.89 (PDF 106)"},{"a":"tetracyclines","b":"acitretin","sev":"contra","effect":"Additive risk of pseudotumor cerebri.","action":"Avoid co-administration.","ref":"Wolverton 4e ch 22 p.258 (PDF 332); Wolverton 4e ch 9 p.89 (PDF 106)"},{"a":"tetracyclines","b":"vka","sev":"serious","effect":"Anticoagulant effect enhanced.","action":"Check INR about 1 week after starting.","ref":"Wolverton 4e ch 9 p.90 (PDF 107)"},{"a":"tetracyclines","b":"digoxin","sev":"serious","effect":"Digoxin levels rise in some patients.","action":"Monitor digoxin level/symptoms.","ref":"Wolverton 4e ch 9 p.90 (PDF 107)"},{"a":"tetracyclines","b":"theophylline","sev":"serious","effect":"Theophylline toxicity possible.","action":"Monitor theophylline levels.","ref":"Wolverton 4e ch 9 p.90 (PDF 107)"},{"a":"tetracyclines","b":"lithium","sev":"serious","effect":"Lithium levels may rise.","action":"Check lithium level.","ref":"Wolverton 4e ch 9 p.90 (PDF 107)"},{"a":"tetracyclines","b":"methotrexate","sev":"monitor","effect":"May raise methotrexate levels.","action":"Monitor CBC/LFT.","ref":"Wolverton 4e ch 14 p.158 (PDF 201)"},{"a":"tetracyclines","b":"antacids-minerals","sev":"monitor","effect":"Calcium, iron, zinc, magnesium chelate tetracyclines; absorption drops.","action":"Separate doses by 2-3 hours; avoid with milk.","ref":"Wolverton 4e ch 9 p.90 (PDF 107)"},{"a":"tetracyclines","b":"methoxsalen","sev":"monitor","effect":"Additive photosensitivity (doxycycline > minocycline).","action":"Strict photoprotection; adjust UVA dose.","ref":"Wolverton 4e ch 9 p.90 (PDF 107)"},{"a":"cotrimoxazole","b":"methotrexate","sev":"contra","effect":"Combined folate antagonism; pancytopenia, fatalities reported.","action":"Avoid; choose another antibiotic.","ref":"Wolverton 4e ch 14 p.158 (PDF 201); Wolverton 4e ch 14 p.163 (PDF 206); Wolverton 4e ch 14 p.164 (PDF 207)"},{"a":"cotrimoxazole","b":"dapsone","sev":"serious","effect":"Raises dapsone levels and adds folate antagonism; haemolysis, methaemoglobinaemia.","action":"Monitor CBC and methaemoglobin symptoms.","ref":"Wolverton 4e ch 9 p.95 (PDF 112); Wolverton 4e ch 20 p.232 (PDF 298)"},{"a":"cotrimoxazole","b":"vka","sev":"serious","effect":"Warfarin metabolism inhibited; bleeding.","action":"Check INR within 3-5 days.","ref":"Wolverton 4e ch 9 p.95 (PDF 112)"},{"a":"cotrimoxazole","b":"phenytoin","sev":"serious","effect":"Phenytoin levels rise; toxicity.","action":"Monitor phenytoin level.","ref":"Wolverton 4e ch 9 p.95 (PDF 112)"},{"a":"cotrimoxazole","b":"ace-arb","sev":"serious","effect":"Trimethoprim adds to hyperkalaemia; sudden deaths reported.","action":"Check IX.drugs.forEach(d=>{ try{ d.re=new RegExp(d.match,"i"); }catch{ d.re=null; } });
const IX_BY = {}; IX.drugs.forEach(d=>IX_BY[d.id]=d);
const IX_SEV = {contra:["Contraindicated","sev-contra",0], serious:["Serious","sev-serious",1], monitor:["Monitor","sev-monitor",2]};
function ixIds(text){ const t=String(text||""); return t ? IX.drugs.filter(d=>d.re && d.re.test(t)).map(d=>d.id) : []; }
function ixCheck(items){ // items: [{label, text}]
  const tagged = items.map(it=>({...it, ids:ixIds(it.text)}));
  const hits=[], seen=new Set();
  for(let i=0;i<tagged.length;i++) for(let j=i+1;j<tagged.length;j++){
    for(const a of tagged[i].ids) for(const b of tagged[j].ids){
      if(a===b) continue;
      IX.pairs.forEach(p=>{ if((p.a===a&&p.b===b)||(p.a===b&&p.b===a)){ const k=[tagged[i].label,tagged[j].label,p.a,p.b].join("|"); if(!seen.has(k)){ seen.add(k); hits.push({p, x:tagged[i].label, y:tagged[j].label}); } } });
    }
  }
  hits.sort((m,n)=>IX_SEV[m.p.sev][2]-IX_SEV[n.p.sev][2]);
  return {hits, unknown:tagged.filter(t=>!t.ids.length).map(t=>t.label)};
}
const ixCardHTML = h => `<div class="ixc ${IX_SEV[h.p.sev][1]}"><span class="ixtag">${IX_SEV[h.p.sev][0]}</span><h4>${esc(h.x)} + ${esc(h.y)}</h4><p>${esc(h.p.effect)} <b>${esc(h.p.action)}</b></p></div>`;
function ixResultsHTML(items){
  if(items.length<2) return `<p class="hint" style="margin:8px 0 0">Add at least two drugs to check.</p>`;
  const r=ixCheck(items);
  return `<div class="lbl" style="margin:14px 0 8px">${r.hits.length?`${r.hits.length} interaction${r.hits.length>1?"s":""} found`:"No interaction found"} · ${items.length} drugs</div>
    ${r.hits.map(ixCardHTML).join("")||`<div class="ixc sev-none"><span class="ixtag">No interaction</span><p>No significant interaction among these drugs in the dermatology list.</p></div>`}
    ${r.unknown.length?`<p class="hint">Not in the interaction list: ${esc(r.unknown.join(", "))}</p>`:""}
    <p class="hint" style="font-size:11.5px">Checked against dermatology-relevant drugs. Not a complete check for all medicines.</p>`;
}
function ixSuggest(q){
  q=q.toLowerCase().trim(); if(q.length<2) return [];
  const out=[], seen=new Set();
  IX.drugs.forEach(d=>{ if(d.name.toLowerCase().includes(q) && !seen.has(d.name)){ seen.add(d.name); out.push({label:d.name, text:d.name}); } });
  S.brands.forEach(b=>{ const t=[b.product,b.composition].join(" "); if((b.product||"").toLowerCase().includes(q) && !seen.has(b.product) && ixIds(t).length){ seen.add(b.product); out.push({label:b.product, text:t}); } });
  return out.slice(0,8);
}
function ixWidgetHTML(){ return `<div class="box ixbox"><label class="search ixsearch" style="margin:0">${ICON.search}<input id="ixQ" type="search" placeholder="Add drugs to check…" autocomplete="off" aria-label="Add drugs to check"></label><div id="ixSug" class="ixsug"></div><div id="ixChips" class="ixchips"></div></div><div id="ixRes"></div>`; }
function wireIx(root, list){
  const q=root.querySelector("#ixQ"), sug=root.querySelector("#ixSug"), chips=root.querySelector("#ixChips"), res=root.querySelector("#ixRes");
  const draw=()=>{ chips.innerHTML=list.map((it,i)=>`<button class="ixchip" type="button" data-ixrm="${i}">${esc(it.label)} ✕</button>`).join(""); res.innerHTML=ixResultsHTML(list); };
  const add=it=>{ if(!list.some(x=>x.label===it.label)) list.push(it); q.value=""; sug.innerHTML=""; draw(); };
  q.addEventListener("input",()=>{ const s=ixSuggest(q.value); sug.innerHTML=s.map((x,i)=>`<button type="button" class="pick" data-ixs="${i}"><span class="main"><span class="t">${esc(x.label)}</span></span></button>`).join("") + (q.value.trim().length>2?`<button type="button" class="pick" data-ixfree="1"><span class="main"><span class="t">Add “${esc(q.value.trim())}”</span></span></button>`:""); sug._s=s; });
  q.addEventListener("keydown",e=>{ if(e.key==="Enter"&&q.value.trim()){ e.preventDefault(); const s=sug._s||[]; add(s[0]||{label:q.value.trim(), text:q.value.trim()}); } });
  sug.addEventListener("click",e=>{ const b=e.target.closest("[data-ixs],[data-ixfree]"); if(!b) return; add(b.dataset.ixfree?{label:q.value.trim(),text:q.value.trim()}:sug._s[+b.dataset.ixs]); });
  chips.addEventListener("click",e=>{ const b=e.target.closest("[data-ixrm]"); if(b){ list.splice(+b.dataset.ixrm,1); draw(); } });
  draw();
}

function ixPatientHTML(rx, medsText){
  const items=(rx||[]).map(r=>({label:r.drug||r.brand, text:dsRxText ? dsRxText(r) : [r.drug,r.brand].join(" ")})).filter(x=>x.label);
  String(medsText||"").split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).forEach(m=>items.push({label:m+" (current)", text:m}));
  if(items.length<2) return "";
  const r=ixCheck(items); if(!r.hits.length) return "";
  return `<div class="ixauto"><div class="lbl" style="margin:0 0 6px">Drug interactions</div>${r.hits.map(ixCardHTML).join("")}</div>`;
}

function mdLite(src){
  const lines=String(src||"").split("\n"); let html="", list=null;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/_(.+?)_/g,"<i>$1</i>");
  const close=()=>{ if(list){ html+=`</${list}>`; list=null; } };
  lines.forEach(l=>{ const t=l.trim();
    if(!t){ close(); return; }
    if(t.startsWith("## ")){ close(); html+=`<h3 class="rch">${inl(t.slice(3))}</h3>`; return; }
    let m=t.match(/^- (.*)/); if(m){ if(list!=="ul"){ close(); html+="<ul>"; list="ul"; } html+=`<li>${inl(m[1])}</li>`; return; }
    m=t.match(/^\d+\.\s+(.*)/); if(m){ if(list!=="ol"){ close(); html+="<ol>"; list="ol"; } html+=`<li>${inl(m[1])}</li>`; return; }
    close(); html+=`<p>${inl(t)}</p>`; });
  close(); return html;
}

    isAdmin()?`${p.draft?`<button class="btn" id="poOk">✓ Approve</button>`:""}<button class="btn" id="poEdit">Edit</button>`:"");
