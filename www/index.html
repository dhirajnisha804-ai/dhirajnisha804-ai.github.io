/* ---------- banner carousel ---------- */
function carouselItems(){
  const promos=[{k:"ix", small:"NEW TOOL", title:"Drug interaction checker", sub:"Check every prescription for risky combinations", btn:"Try it →", cls:"cb2"},
                {k:"dose", small:"QUICK TOOL", title:"Dose by weight", sub:"mg/kg and m² doses for adults and children", btn:"Open →", cls:"cb3"}];
  const posts=S.posts.filter(p=>p.banner && !p.draft).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,3).map(p=>({post:p.id, small:"RESIDENT CORNER", title:p.title, sub:p.summary, btn:"Read →", cls:"cb1", icon:p.icon}));
  return [...posts, ...promos];
}
function carouselHTML(){ const it=carouselItems(); if(!it.length) return "";
  return `<div class="car" id="car">${it.map((x,i)=>`<button class="ccard ${x.cls}" data-cari="${i}"><small>${esc(x.small)}</small><b class="ct">${esc(x.title)}</b><span class="cs">${esc(x.sub||"")}</span><span class="cbtn">${esc(x.btn)}</span>${x.icon?`<span class="cbig">${esc(x.icon)}</span>`:""}</button>`).join("")}</div><div class="cdots">${it.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`; }
function wireCarousel(){
  const car=$("#car"); if(!car || car.dataset.w) return; car.dataset.w=1; const it=carouselItems(); const dots=[...car.nextElementSibling.children];
  car.addEventListener("scroll",()=>{ const i=Math.round(car.scrollLeft/(car.firstElementChild.offsetWidth+10)); dots.forEach((d,j)=>d.classList.toggle("on",i===j)); },{passive:true});
  car.addEventListener("click",e=>{ const b=e.target.closest("[data-cari]"); if(!b) return; const x=it[+b.dataset.cari]; if(x.post){ openPost(x.post); } else { S.drugTab=x.k; go("meds"); } });
  clearInterval(wireCarousel._t); wireCarousel._t=setInterval(()=>{ if(!document.body.contains(car)) return clearInterval(wireCarousel._t); if(document.hidden || !$("#sheet").hidden) return; const w=car.firstElementChild.offsetWidth+10; const n=car.children.length; const i=Math.round(car.scrollLeft/w); car.scrollTo({left:((i+1)%n)*w, behavior:"smooth"}); }, 5000);
}

    ov.querySelector(".tskip").onclick=done; ov.querySelector("#tNext").onclick=()=>{ if(i<TOUR.length-1){ i++; draw(); } else done(); }; };
  const done=()=>{ try{ localStorage.setItem("drx.tour","1"); }catch{} ov.remove(); setTimeout(showCoach,250); };

/* ---------- voice typing ---------- */
function micBtn(target){ return `<button type="button" class="mic" data-mic="${target}" aria-label="Voice typing">🎤</button>`; }
const VOICE_LANGS=[["en-IN","English"],["hi-IN","हिंदी"],["mr-IN","मराठी"]];
function startVoice(id, btn){
  const el=document.getElementById(id); if(!el) return; let lang; try{ lang=localStorage.getItem("drx.vlang")||"en-IN"; }catch{ lang="en-IN"; }
  const put=t=>{ if(!t) return; el.value=(el.value&&!/\s$/.test(el.value)?el.value+" ":el.value)+t; el.dispatchEvent(new Event("input",{bubbles:true})); };
  if(window.DermaAndroid?.listen){ window.DRX_voiceResult=(fid,t)=>{ btn?.classList.remove("on"); if(t) put(t); }; btn?.classList.add("on"); window.DermaAndroid.listen(id, lang); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ toast("Voice typing works in the Derma Desk app or Chrome"); return; }
  const r=new SR(); r.lang=lang; r.interimResults=false; r.maxAlternatives=1; btn?.classList.add("on");
  r.onresult=e=>put(e.results[0][0].transcript); r.onerror=()=>toast("Couldn’t hear that — try again"); r.onend=()=>btn?.classList.remove("on"); r.start();
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-mic]"); if(!b) return; e.preventDefault(); e.stopPropagation(); startVoice(b.dataset.mic, b); });
document.addEventListener("contextmenu",e=>{ const b=e.target.closest("[data-mic]"); if(!b) return; e.preventDefault(); let cur; try{ cur=localStorage.getItem("drx.vlang")||"en-IN"; }catch{ cur="en-IN"; } const i=(VOICE_LANGS.findIndex(x=>x[0]===cur)+1)%VOICE_LANGS.length; try{ localStorage.setItem("drx.vlang",VOICE_LANGS[i][0]); }catch{} toast("Voice language: "+VOICE_LANGS[i][1]); });

function openCompare(ph){
  if(ph.length<2){ toast("Need at least two photos"); return; }
  const opt=(sel)=>ph.map((x,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(fmtDate(x.date))}${x.tag?" · "+esc(x.tag):""}${x.caption?" · "+esc(x.caption):""}</option>`).join("");
  openSheet2("Compare photos", `<div class="grid" style="gap:8px"><div class="field"><label for="cmA">Before</label><select id="cmA">${opt(ph.length-1)}</select></div><div class="field"><label for="cmB">After</label><select id="cmB">${opt(0)}</select></div></div>
    <div class="chips segs" style="padding-top:8px"><button class="chip" data-cmm="side" aria-pressed="true">Side by side</button><button class="chip" data-cmm="slide" aria-pressed="false">Slider</button></div><div id="cmView" style="margin-top:10px"></div>`);
  let mode="side";
  const draw=()=>{ const a=ph[+$("#cmA").value], b=ph[+$("#cmB").value];
    $("#cmView").innerHTML = mode==="side" ? `<div class="cmside"><figure><img src="/_blob/${esc(a.id)}" alt="Before"><figcaption>${esc(fmtDate(a.date))}</figcaption></figure><figure><img src="/_blob/${esc(b.id)}" alt="After"><figcaption>${esc(fmtDate(b.date))}</figcaption></figure></div>`
      : `<div class="cmslide"><img src="/_blob/${esc(a.id)}" alt="Before"><div class="cmtop" style="width:50%"><img src="/_blob/${esc(b.id)}" alt="After"></div><input type="range" min="0" max="100" value="50" id="cmR" aria-label="Slide to compare"><span class="cml">${esc(fmtDate(a.date))}</span><span class="cmr">${esc(fmtDate(b.date))}</span></div>`;
    const r=$("#cmR"); if(r){ const box=$("#cmView .cmslide"); const top=box.querySelector(".cmtop"); top.querySelector("img").style.width=box.offsetWidth+"px"; r.addEventListener("input",()=>{ top.style.width=r.value+"%"; }); } };
  ["#cmA","#cmB"].forEach(s=>$(s).addEventListener("change",draw));
  $("#sheet2Body").addEventListener("click",e=>{ const b=e.target.closest("[data-cmm]"); if(!b) return; mode=b.dataset.cmm; document.querySelectorAll("[data-cmm]").forEach(x=>x.setAttribute("aria-pressed",x===b)); draw(); });
  draw();
}
/* follow-up camera with ghost overlay of the last photo */
async function openGhostCamera(lastId, onShot){
  if(!navigator.mediaDevices?.getUserMedia){ toast("Live camera isn’t available here — use the Camera button"); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment", width:{ideal:1920}}, audio:false}); }catch{ toast("Camera permission needed"); return; }
  openSheet2("Follow-up photo", `<div class="ghost"><video id="ghV" autoplay playsinline muted></video>${lastId?`<img id="ghI" src="/_blob/${esc(lastId)}" alt="">`:""}</div>
    <div class="field" style="margin-top:8px"><label for="ghO">Ghost strength</label><input type="range" id="ghO" min="0" max="80" value="35"></div>
    <div class="actions" style="margin-top:8px"><button class="btn primary" id="ghShot">📸 Take photo</button></div>`);
  const v=$("#ghV"); v.srcObject=stream; const stop=()=>stream.getTracks().forEach(t=>t.stop());
  const img=$("#ghI"); const op=()=>{ if(img) img.style.opacity=$("#ghO").value/100; }; op(); $("#ghO").addEventListener("input",op);
  const obs=new MutationObserver(()=>{ if($("#sheet2").hidden){ stop(); obs.disconnect(); } }); obs.observe($("#sheet2"),{attributes:true});
  $("#ghShot").onclick=()=>{ const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext("2d").drawImage(v,0,0); c.toBlob(b=>{ if(!b) return; stop(); closeSheet2(); onShot(new File([b],"followup.jpg",{type:"image/jpeg"})); },"image/jpeg",0.9); };
}

async function shrinkProof(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const max=1400, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    let q=0.8, out=c.toDataURL("image/jpeg",q); while(out.length>700000 && q>0.35){ q-=0.1; out=c.toDataURL("image/jpeg",q); } return out; }
  finally{ URL.revokeObjectURL(url); }
}

function showCoach(){
  if(S.view!=="cases"){ go("cases"); }
  const steps=COACH;
  let i=0; const ov=document.createElement("div"); ov.className="coach"; ov.innerHTML=`<div class="chole"></div><div class="ctip"></div>`; document.body.appendChild(ov);
  const hole=ov.querySelector(".chole"), tip=ov.querySelector(".ctip");
  const end=()=>{ ov.remove(); try{ localStorage.setItem("drx.coach","1"); }catch{} window.removeEventListener("resize",draw); if(S.view!=="cases") go("cases"); };
  let dir=1;
  function draw(){
    const [sel,h,p,vw]=steps[i];
    if(vw && S.view!==vw){ go(vw); return setTimeout(draw,120); }
    const el=document.querySelector(sel); if(!el || el.offsetParent===null){ return dir>0 ? next() : (i>0 ? (i--, draw()) : next()); }
    el.scrollIntoView({block:"nearest"}); const r=el.getBoundingClientRect(); const pad=6;
    Object.assign(hole.style,{left:(r.left-pad)+"px", top:(r.top-pad)+"px", width:(r.width+pad*2)+"px", height:(r.height+pad*2)+"px"});
    tip.innerHTML=`<b>${esc(h)}</b><p>${esc(p)}</p><div class="cbar"><span class="cstep">${i+1} / ${steps.length}</span><button type="button" class="tskip" id="cSkip">Skip</button>${i?`<button type="button" class="btn sm" id="cBack">Back</button>`:""}<button type="button" class="btn primary sm" id="cNext">${i===steps.length-1?"Done":"Next"}</button></div>`;
    const below = r.top < window.innerHeight/2;
    tip.style.left="16px"; tip.style.right="16px";
    if(below){ tip.style.top=(r.bottom+pad+12)+"px"; tip.style.bottom="auto"; } else { tip.style.bottom=(window.innerHeight-r.top+pad+12)+"px"; tip.style.top="auto"; }
    tip.querySelector("#cSkip").onclick=end; tip.querySelector("#cNext").onclick=next; tip.querySelector("#cBack")?.addEventListener("click",()=>{ dir=-1; i--; draw(); });
  }
  function next(){ dir=1; if(i<steps.length-1){ i++; draw(); } else end(); }
  window.addEventListener("resize",draw); setTimeout(draw,60);
}

  const drawPhotos = () => { $("#ppPhotos").innerHTML = W.photos.map((x,i)=>`<div class="ph"><img src="/_blob/${esc(x.id)}" alt="${esc(x.caption||"Clinical photo")}" data-lb="${esc(x.id)}" data-cap="${esc(x.caption||"")}"><button class="x" type="button" data-phrm="${i}" aria-label="Remove photo">${ICON.x}</button><input value="${esc(x.caption||"")}" data-phcap="${i}" placeholder="Caption / site" aria-label="Caption"></div>`).join("") + (busy?`<div class="ph"><div class="ph-ph">Uploading ${busy}…</div></div>`:"") || ""; };
  const addPhotos = async files => { for(const f of files){ busy++; drawPhotos(); const r=await uploadFile(f); busy--; if(r){ fresh.add(r.id); W.photos.push({id:r.id, tag:"", caption:"", at:Date.now()}); } drawPhotos(); } };
  ["#ppCam","#ppGal"].forEach(sel=>$(sel).addEventListener("change", e=>{ const f=[...e.target.files]; e.target.value=""; addPhotos(f); }));
  $("#ppPhotos").addEventListener("click", e=>{ const rm=e.target.closest("[data-phrm]"); if(rm){ W.photos.splice(+rm.dataset.phrm,1); drawPhotos(); } });
  $("#ppPhotos").addEventListener("input", e=>{ const i=e.target.dataset.phcap; if(i!=null) W.photos[+i].caption=e.target.value; });
  drawPhotos();
  const safeCtx = () => ({age:$("#ppAge").value, sex:$("#ppSex").value, weight:$("#ppWt").value, preg:$("#ppSex").value==="Male"?"":$("#ppPreg").value, comorb:$("#ppCom").value, meds:$("#ppMeds").value, history:$("#ppHx").value});
  const drawSafe = () => { const el=$("#ppSafeBody"); if(!el) return; const open=[...el.querySelectorAll("details[open]")].map(x=>x.dataset.k); el.innerHTML=hasFull() ? ixPatientHTML(W.rx, $("#ppMeds").value)+safetyForRx(W.rx, safeCtx()) : `<p class="hint" style="margin:0">🔒 Drug safety and interaction alerts are for verified members.</p>`; open.forEach(k=>el.querySelector(`details[data-k="${CSS.escape(k)}"]`)?.setAttribute("open","")); $("#ppPregF").hidden = $("#ppSex").value==="Male"; };
  const drawRx = () => { $("#ppRx").innerHTML = rxTableHTML(W.rx); drawSafe(); };
  wireRxTable($("#ppRx"), () => W.rx, drawRx); drawRx();
  ["#ppAge","#ppWt","#ppCom","#ppMeds","#ppHx"].forEach(sel=>$(sel).addEventListener("input", drawSafe));
  ["#ppSex","#ppPreg"].forEach(sel=>$(sel).addEventListener("change", drawSafe));
  $("#ppSafeBody").addEventListener("click", e=>{ const b=e.target.closest("[data-dsedit]"); if(b){ e.preventDefault(); e.stopPropagation(); openDsEditor(b.dataset.dsedit, null); } });
  $("#ppSafeAll").onclick = () => openDrugSafety();
  S.safeHook = drawSafe;
  $("#ppAdd").onclick = () => openMedPicker(null, item => { W.rx.push(item); drawRx(); });
  $("#ppWtc").onclick = () => !hasFull() ? toast("Dose by weight is for verified members") : openWtCalc(v => { if(v.weight && !$("#ppWt").value){ $("#ppWt").value=v.weight; } W.rx.push(normRx({drug:v.drug, dose:v.dose, freq:v.freq, dur:v.dur, instr:v.instr, route:v.route})); drawRx(); toast("Added to prescription"); });
  $("#ppIx").onclick = () => !hasFull() ? toast("Interaction checker is for verified members") : openIxSheet([...W.rx.map(r=>({label:r.drug||r.brand, text:dsRxText(r)})), ...$("#ppMeds").value.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(m=>({label:m+" (current)", text:m}))].filter(x=>x.label));
  $("#ppGhost")?.addEventListener("click", () => { const last=vs.flatMap(v=>(v.photos||[]).map(x=>x.id))[0]; openGhostCamera(last, f=>addPhotos([f])); });
  $("#ppTpl").onclick = () => openTplPicker(t => { applyTpl(t); drawRx(); toast(`Applied ${t.name}`); });
  $("#ppGuide").onclick = () => openCaseRef($("#ppDx").value.trim());
  const scanApply = (v, meds, keep) => {
    if(v.name) $("#ppName").value=v.name; if(v.age) $("#ppAge").value=v.age; if(v.sex) $("#ppSex").value=v.sex; if(v.date) $("#ppDate").value=v.date;
    if(meds.length){ W.rx.push(...meds); }
    drawRx(); if(keep) addPhotos([keep]);
    const n=Object.keys(v).length+meds.length; toast(n?`Filled ${n} item${n>1?"s":""} from the scan — please check`:"Nothing was filled");
  };
  scanApply.again = () => $("#ppScGal").click();
  ["#ppScCam","#ppScGal"].forEach(sel=>$(sel).addEventListener("change", e=>{ const f=e.target.files[0]; e.target.value=""; if(f) scanRxPhoto(f, scanApply); }));
  const collect = () => { W.name=$("#ppName").value.trim(); W.age=$("#ppAge").value; W.sex=$("#ppSex").value; W.date=$("#ppDate").value||today(); W.complaint=$("#ppCc").value.trim(); W.history=$("#ppHx").value.trim(); W.dx=$("#ppDx").value.trim(); };
  const doSave = async () => {
    if(busy){ toast("Wait for photos to finish uploading"); return null; }
    collect(); if(!W.name){ toast("Add the patient’s name"); $("#ppName").focus(); return null; }
    const pidN = p?.id || newId("people");
    const {id:_p, ...pBase} = p||{};
    const pd = {...pBase, name:W.name, age:W.age, sex:W.sex, weight:$("#ppWt").value, preg:$("#ppSex").value==="Male"?"":$("#ppPreg").value, comorb:$("#ppCom").value.trim(), meds:$("#ppMeds").value.trim(), pid:pBase.pid||nextPid(), createdAt:pBase.createdAt||Date.now(), updatedAt:Date.now()};
    if(!(await save("people", pidN, pd))) return null;
    const vidN = v?.id || newId("visits");
    const {id:_v, ...vBase} = v||{};
    const vd = {...vBase, patientId:pidN, date:W.date, complaint:W.complaint, duration:"", history:W.history, photos:W.photos, dx:W.dx, rx:W.rx, fu:$("#ppFu").value?{...(vBase.fu||{}), date:$("#ppFu").value}:null, status:"completed", createdAt:vBase.createdAt||Date.now(), updatedAt:Date.now()};
    if(!(await save("visits", vidN, vd))) return null;
    const keep=new Set(assetsOfVisit(vd)); [...orig, ...fresh].filter(x=>!keep.has(x)).forEach(delAsset); fresh.clear();
    return {pd:{...pd,id:pidN}, vd:{...vd,id:vidN}};
  };
  $("#ppSave").onclick = async () => { const r=await doSave(); if(r){ toast(isNew?"Patient saved":"Saved"); S.view="patients"; closeSheet(); } };
  if($("#ppPdf")) $("#ppPdf").onclick = async () => { const r=await doSave(); if(r) savePdf(r.vd, r.pd); };
  armDelete($("#ppDel"), async () => {
    for(const x of vs){ assetsOfVisit(x).forEach(delAsset); await remove("visits", x.id); }
    for(const x of scoresOf(p.id)) await remove("scores", x.id);
    fresh.forEach(delAsset); fresh.clear();
    if(await remove("people", p.id)){ toast("Patient deleted"); S.view="patients"; closeSheet(); }
  });
}

/* rx table shared by patient record and template editor: medicine · brand available · cost */
function rxTableHTML(list){
  if(!list.length) return `<p class="hint" style="margin:0">No medicines yet. Use a template or add a medicine.</p>`;
  const total = list.reduce((n,r)=>{ const c=parseFloat(String(r.cost??"").replace(/[^\d.]/g,"")); return n+(isNaN(c)?0:c); },0);
  return `<div class="rxt"><div class="rxt-head"><span></span><span>Medicine</span><span>Brand available</span><span>Cost (₹)</span><span></span></div>
  ${list.map((r,i)=>{ const fq=[r.freq, r.dur?"× "+r.dur:""].filter(Boolean).join(" · "); const rest=[r.dose, r.route && !["Topical","Oral"].includes(r.route) ? r.route : "", r.timing, r.instr].filter(Boolean).join(" · ");
    return `<div class="rxt-row"><span class="n">${i+1}.</span><span class="med"><span class="l1"><span class="d">${esc(r.drug)}</span>${fq?`<span class="fq">${esc(fq)}</span>`:""}</span>${r.generic?`<span class="g">${esc(r.generic)}</span>`:""}${rest?`<span class="sig">${esc(rest)}</span>`:(fq?"":'<span class="sig"><span class="hint">Tap edit to add dose and timing</span></span>')}</span>
    <span class="act"><button class="mini" type="button" data-rxed="${i}" aria-label="Edit">${ICON.edit}</button><button class="mini del" type="button" data-rxrm="${i}" aria-label="Remove">${ICON.x}</button><input class="inp rb" data-rxb="${i}" value="${esc(r.brand||"")}" placeholder="Brand available" aria-label="Brand available for ${esc(r.drug)}"><input class="inp rc" data-rxc="${i}" value="${esc(r.cost??"")}" placeholder="Cost ₹" inputmode="decimal" aria-label="Cost for ${esc(r.drug)}"></span></div>`; }).join("")}
  ${total?`<div class="rxt-total">Approx. total <b>${rupee(Math.round(total))}</b></div>`:""}</div>`;
}
function wireRxTable(box, getList, redraw){
  box.addEventListener("click", e=>{
    const L=getList(); const b=e.target.closest("[data-rxed],[data-rxrm]"); if(!b) return;
    if(b.dataset.rxrm){ L.splice(+b.dataset.rxrm,1); redraw(); }
    else { const i=+b.dataset.rxed; openDrugDetails(L[i], item=>{ L[i]=item; redraw(); }); }
  });
  box.addEventListener("input", e=>{ const L=getList(); const ib=e.target.dataset.rxb, ic=e.target.dataset.rxc; if(ib!=null) L[+ib].brand=e.target.value; if(ic!=null) L[+ic].cost=e.target.value; });
  box.addEventListener("change", e=>{ if(e.target.dataset.rxc!=null) redraw(); });
}

/* ---------- medicine picker & drug details ---------- */
function brandSearch(q, skincareOnly){
  q=q.toLowerCase().trim(); const words=q.split(/\s+/).filter(Boolean);
  let arr=S.brands.filter(b=> skincareOnly ? SKINCARE.has(catOf(b)) : true);
  if(words.length) arr=arr.filter(b=>{ const h=[b.product,b.composition,b.brand,b.company,catOf(b)].join(" ").toLowerCase(); return words.every(w=>h.includes(w)); });
  return arr.sort((a,b)=> (b.preferred?1:0)-(a.preferred?1:0) || (a.product||"").localeCompare(b.product||""));
}
function openMedPicker(_, onDone, {skincare=false}={}){
  openSheet2(skincare?"Add skincare product":"Add medicine", `
    <label class="search" style="margin-top:0">${ICON.search}<input id="mpQ" type="search" placeholder="${skincare?"Search sunscreen, moisturizer, brand…":"Search generic or brand, e.g. tretinoin"}" autocomplete="off" aria-label="Search"></label>
    <div id="mpRes" class="pickres"></div>`);
  const draw = () => {
    const q=$("#mpQ").value; const res=brandSearch(q, skincare).slice(0,40);
    const typed=q.trim();
    // group by composition when searching
    let html="";
    if(typed && !skincare) html += `<button class="pick" data-mpfree="1"><span class="main"><span class="t">Use “${esc(typed)}”</span><span class="s">Prescribe by generic name, without a brand</span></span></button>`;
    if(typed){
      const groups={}; res.forEach(b=>{ const k=(b.composition||b.product||"").trim(); (groups[k] ||= []).push(b); });
      html += Object.entries(groups).map(([k,arr])=>`<div class="lbl" style="margin:8px 0 0">${esc(k)}</div>${arr.map(b=>pickRow(b)).join("")}`).join("");
    } else html += res.map(b=>pickRow(b)).join("");
    $("#mpRes").innerHTML = html || `<div class="empty">No match. Type the full name to prescribe it as written.</div>`;
  };
  const pickRow = b => `<button class="pick" data-mpb="${esc(b.id)}"><span class="main"><span class="t">${b.preferred?"★ ":""}${esc(b.product)}</span><span class="s">${esc([b.composition, b.brand].filter(Boolean).join(" · "))}</span></span><span class="price">${rupee(b.price)}${b.pack?`<small>${esc(b.pack)}</small>`:""}</span></button>`;
  draw(); $("#mpQ").addEventListener("input", draw); setTimeout(()=>$("#mpQ")?.focus(),50);
  $("#mpRes").addEventListener("click", e=>{
    const f=e.target.closest("[data-mpfree]"); if(f){ openDrugDetails({drug:$("#mpQ").value.trim()}, onDone); return; }
    const b=e.target.closest("[data-mpb]"); if(!b) return; const br=S.brands.find(x=>x.id===b.dataset.mpb); if(!br) return;
    const cat=catOf(br); const oral=/oral|Antihistamine|Oral|Supplement|Tofacitinib|Methotrexate|Psoralen/.test(cat) && !/topical/i.test(cat);
    const base={drug:br.composition||br.product, generic:"", brandId:br.id, brand:[br.product, br.brand&&!String(br.product).includes(br.brand)?"("+br.brand+")":""].filter(Boolean).join(" "), cost:br.price??"", route: oral?"Oral":"Topical"};
    if(skincare){ onDone(normRx(base)); closeSheet2(); return; }
    openDrugDetails(base, onDone);
  });
}
function openDrugDetails(item, onDone){
  const r=normRx(item);
  const qb=(name, opts, cur)=>`<div class="qb">${opts.map(o=>`<button type="button" class="chip" data-qb="${name}" data-v="${esc(o)}" aria-pressed="${cur===o}">${esc(o)}</button>`).join("")}</div>`;
  openSheet2("Medicine details", `<div class="stack">
    <div class="field"><label for="ddDrug">Medicine</label><input id="ddDrug" value="${esc(r.drug)}"></div>
    ${r.generic?`<p class="hint" style="margin:-6px 0 0">${esc(r.generic)}</p>`:""}
    <div class="field"><label for="ddDose">Dose</label><input id="ddDose" value="${esc(r.dose)}" placeholder="e.g. Pea-sized amount, 1 tablet, 20 mg"></div>
    ${hasFull()&&wtFor([r.drug,r.generic,r.brand].join(" ")).length?`<details class="wtd" id="ddWtD"><summary>Calculate dose by weight</summary><div id="ddWt" style="margin-top:8px"></div></details>`:""}
    <div class="field"><label for="ddRoute">Route</label><select id="ddRoute"><option value="">—</option>${ROUTES.map(o=>`<option ${r.route===o?"selected":""}>${o}</option>`).join("")}</select></div>
    <div class="field"><label for="ddFreq">Frequency</label>${qb("freq",FREQ,r.freq)}<input id="ddFreq" value="${esc(r.freq)}" placeholder="Custom frequency"></div>
    <div class="field"><label for="ddTime">Timing</label>${qb("timing",TIMING,r.timing)}<input id="ddTime" value="${esc(r.timing)}" placeholder="Custom timing"></div>
    <div class="field"><label for="ddDur">Duration</label>${qb("dur",DURQ,r.dur)}<input id="ddDur" value="${esc(r.dur)}" placeholder="e.g. 8 weeks"></div>
    <div class="grid"><div class="field"><label for="ddBrand">Brand available</label><input id="ddBrand" value="${esc(r.brand)}" placeholder="e.g. Retino-A, A-Ret"></div><div class="field"><label for="ddCost">Cost (₹)</label><input id="ddCost" inputmode="decimal" value="${esc(r.cost)}"></div></div>
    <div class="field"><label for="ddInstr">Instructions ${micBtn("ddInstr")}</label><textarea id="ddInstr" placeholder="e.g. Apply over affected area">${esc(r.instr)}</textarea></div>
    <div class="actions"><button class="btn primary" id="ddSave">Save medicine</button></div>
  </div>`);
  const map={freq:"#ddFreq", timing:"#ddTime", dur:"#ddDur"};
  $("#ddWtD")?.addEventListener("toggle", ev=>{ const box=$("#ddWt"); if(!ev.target.open || box.dataset.on) return; box.dataset.on=1; const L=wtFor([r.drug,r.generic,r.brand].join(" ")); box.innerHTML=wtCalcHTML(L, patientCtx()); wireWtCalc(box, L, v=>{ $("#ddDose").value=v.dose; if(!$("#ddFreq").value) $("#ddFreq").value=v.freq; if(!$("#ddDur").value) $("#ddDur").value=v.dur; if(!$("#ddRoute").value) $("#ddRoute").value=v.route; const ins=$("#ddInstr"); if(!ins.value.includes(v.instr)) ins.value=[ins.value.trim(), v.instr].filter(Boolean).join(" · "); $("#ddWtD").open=false; toast("Dose filled — check before saving"); }); });
  $("#sheet2Body").addEventListener("click", e=>{ const b=e.target.closest("[data-qb]"); if(!b) return; const inp=$(map[b.dataset.qb]); inp.value=b.dataset.v; b.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b)); });
  $("#ddSave").onclick = () => {
    const out={...r, drug:$("#ddDrug").value.trim(), dose:$("#ddDose").value.trim(), route:$("#ddRoute").value, freq:$("#ddFreq").value.trim(), timing:$("#ddTime").value.trim(), dur:$("#ddDur").value.trim(), instr:$("#ddInstr").value.trim(), brand:$("#ddBrand").value.trim(), cost:$("#ddCost").value.trim()};
    if(!out.drug){ toast("Add the medicine name"); return; }
    onDone(out); closeSheet2();
  };
}
function openTplPicker(onPick){
  openSheet2("Use template", `<label class="search" style="margin-top:0">${ICON.search}<input id="tpQ" type="search" placeholder="Search templates" autocomplete="off" aria-label="Search templates"></label><div id="tpRes"></div>`);
  const draw=()=>{ const q=$("#tpQ").value.toLowerCase(); const arr=S.templates.filter(t=>!q||[t.name,t.group].join(" ").toLowerCase().includes(q)); const by={}; arr.forEach(t=>(by[t.group||"Other"] ||= []).push(t));
    $("#tpRes").innerHTML = Object.keys(by).sort().map(g=>`<div class="group"><h3>${esc(g)}</h3><div class="list">${by[g].sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<button class="row" data-tp="${esc(t.id)}"><span class="main"><span class="t">${esc(t.name)}</span><span class="s">${esc((t.rx||[]).map(r=>r.drug).join(" · "))}</span></span></button>`).join("")}</div></div>`).join("") || `<div class="empty">No templates match.</div>`; };
  draw(); $("#tpQ").addEventListener("input", draw);
  $("#tpRes").addEventListener("click", e=>{ const b=e.target.closest("[data-tp]"); if(!b) return; const t=S.templates.find(x=>x.id===b.dataset.tp); if(!t) return; if(isLadder(t)){ closeSheet2(); setTimeout(()=>openLadder(t,{onPick}),60); } else { onPick(t); closeSheet2(); } });
}

const P = { open:false, ctx:{}, key:null, st:{}, rec:null, res:null };

  $("#pnlTitle").textContent=title; $("#pnlBack").hidden=!back; P.back=back||null;

function recompute(){
  const def=CALCS[P.key]; if(!def) return; const res=def.calc(P.st); P.res=res;
  const v=res.values[P.rec]; const max=SCORE_TYPES[P.rec]?.max ?? def.max;

  const b=bandOf(v, bandsForType(P.rec)); const pill=$("#srB");
  if(b){ pill.hidden=false; pill.textContent=b[1]; pill.className="pill "+(b[2]===OK?"":b[2]); } else pill.hidden=true;

async function saveScore(pid){

/* ---------- score trends (patient profile) ---------- */
function scoresOf(pid){ return (S.scores||[]).filter(s=>s.patientId===pid).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0)); }
function responseBadges(type, pct){
  const marks = type==="PASI" ? [50,75,90,100] : type==="EASI" ? [50,75,90] : (type==="SCORAD"||type==="VASI"||type==="NAPSI") ? [50,75] : (type==="MASI"||type==="mMASI") ? [50] : null; if(!marks) return "";
  return `<div class="rbadges">${marks.map(m=>`<span class="rbadge ${pct>=m?"on":""}" title="${pct>=m?"Achieved":"Not yet"}: ≥ ${m}% improvement from baseline">${pct>=m?"✓ ":""}${type} ${m}</span>`).join("")}</div>`;
}
function trendSVG(list, type){
  const W=320, H=128, L=30, R=14, T=16, B=26; const n=list.length;
  const vmax=Math.max(1, ...list.map(s=>+s.value||0)); const raw=vmax*1.15, mag=Math.pow(10,Math.floor(Math.log10(raw))); const top=[1,2,2.5,4,5,10].map(m=>m*mag).find(m=>m>=raw)||10*mag;
  const x=i=> n===1 ? (L+(W-L-R)/2) : L+i*(W-L-R)/(n-1); const y=v=> T+(H-T-B)*(1-(+v||0)/top);
  const pts=list.map((s,i)=>[x(i),y(s.value)]);
  const ticks=[0, top/2, top].map(t=>Math.round(t*10)/10);
  const lbl=i=>{ const d=list[i].date||""; const [yy,mm,dd]=d.split("-"); return d?`${+dd} ${MON[+mm-1]}`:""; };
  const showLbl = i => i===0 || i===n-1 || n<=6;
  return `<svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(SCORE_TYPES[type].n)} trend: ${list.map(s=>`${fmtDate(s.date)} ${fmtScore(s.value)}`).join(", ")}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="tg"/><text x="${L-6}" y="${y(t)+3.5}" class="ta" text-anchor="end">${fmtScore(t)}</text>`).join("")}
    ${n>1?`<line x1="${L}" x2="${W-R}" y1="${y(list[0].value)}" y2="${y(list[0].value)}" class="tb"/>`:""}
    ${n>1?`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" class="tl"/>`:""}
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" class="tp"/>${showLbl(i)?`<text x="${p[0]}" y="${p[1]-9}" class="tv" text-anchor="${n>1&&i===0?"start":n>1&&i===n-1?"end":"middle"}">${fmtScore(list[i].value)}</text>`:""}<text x="${p[0]}" y="${H-8}" class="ta" text-anchor="${n>1&&i===0?"start":n>1&&i===n-1?"end":"middle"}">${showLbl(i)?lbl(i):""}</text><circle cx="${p[0]}" cy="${p[1]}" r="14" class="th" tabindex="0" data-tip="${esc(fmtDate(list[i].date))} · ${esc(SCORE_TYPES[type].n)} ${fmtScore(list[i].value)}"/>`).join("")}
  </svg>`;
}
function scoreCardsHTML(pid){
  const all=scoresOf(pid); if(!all.length) return `<p class="hint" style="margin:0">No scores yet. Tap “+ Score” to calculate one; repeat at each visit to see the trend.</p>`;
  const types=SCORE_ORDER.filter(t=>all.some(s=>s.type===t));
  return types.map(t=>{ const list=all.filter(s=>s.type===t); const base=list[0], last=list[list.length-1];
    const delta=last.value-base.value; const pct = base.value>0 ? (base.value-last.value)/base.value*100 : null;
    const b=bandOf(last.value, bandsForType(t));
    return `<div class="scard ${hueOf(t)}"><div class="scard-h"><div><div class="scard-n">${esc(SCORE_TYPES[t].n)}</div>${b?`<span class="pill ${b[2]===OK?"":b[2]}">${esc(b[1])}</span>`:""}</div>
      <div class="scard-v"><b>${fmtScore(last.value)}</b><small>latest · ${esc(fmtDate(last.date))}</small></div></div>
      ${(()=>{ const ip=interpOf(t,last.value); return ip?`<div class="scard-i">${esc(ip.text)}</div>`:""; })()}
      ${list.length>1?`<div class="scard-d">Baseline ${fmtScore(base.value)} (${esc(fmtDate(base.date))}) → <b>${delta>0?"+":""}${fmtScore(delta)}</b>${pct!=null?` · <b class="${pct>0?"imp":pct<0?"wor":""}">${pct>0?"↓ "+fmtScore(pct)+"% improvement":pct<0?"↑ "+fmtScore(-pct)+"% worse":"no change"}</b>`:""}</div>${pct!=null?responseBadges(t,pct):""}`:`<div class="scard-d">Baseline recorded. Add the same score at the next visit to see change.</div>`}
      <div class="trendwrap">${trendSVG(list,t)}<div class="ttip" hidden></div></div>
      <div class="slist">${list.slice().reverse().map(s=>`<div class="slist-r"><span>${esc(fmtDate(s.date))}</span><b>${fmtScore(s.value)}</b>${s===base&&list.length>1?`<span class="pill">baseline</span>`:""}<button class="x" type="button" data-scdel="${esc(s.id)}" aria-label="Delete ${esc(SCORE_TYPES[t].n)} ${fmtScore(s.value)} on ${esc(fmtDate(s.date))}">${ICON.x}</button></div>`).join("")}</div></div>`;
  }).join("");
}
function wireScoreCards(box){
  box.addEventListener("click", async e=>{ const d=e.target.closest("[data-scdel]"); if(!d) return;
    if(!d.classList.contains("armed")){ d.classList.add("armed"); d.title="Tap again to delete"; toast("Tap × again to delete this score"); setTimeout(()=>d.classList.remove("armed"),3000); return; }
    if(await remove("scores", d.dataset.scdel)) toast("Score deleted"); });
  const show=(c)=>{ const w=c.closest(".trendwrap"), tip=w.querySelector(".ttip"); const r=c.getBoundingClientRect(), wr=w.getBoundingClientRect(); tip.textContent=c.dataset.tip; tip.hidden=false; tip.style.left=Math.min(Math.max(r.left-wr.left+r.width/2, 60), wr.width-60)+"px"; tip.style.top=(r.top-wr.top-6)+"px"; };
  const hide=(c)=>{ c.closest(".trendwrap")?.querySelector(".ttip")?.setAttribute("hidden",""); };
  box.addEventListener("pointerover", e=>{ const c=e.target.closest(".th"); if(c) show(c); });
  box.addEventListener("pointerout", e=>{ const c=e.target.closest(".th"); if(c) hide(c); });
  box.addEventListener("focusin", e=>{ const c=e.target.closest(".th"); if(c) show(c); });
  box.addEventListener("focusout", e=>{ const c=e.target.closest(".th"); if(c) hide(c); });
}

function dsList(){ const ov=S.dsOver||{}; const out=DS_DEFAULTS.map(d=>ov[d.k]?{...d,...ov[d.k],k:d.k,edited:true,builtin:true}:{...d,builtin:true}); Object.values(ov).forEach(o=>{ if(o.custom && !DS_DEFAULTS.some(d=>d.k===o.k)) out.push({...o,edited:true}); }); return out.sort((x,y)=>String(x.name||"").localeCompare(String(y.name||""))); }
function dsRe(src){ try{ return new RegExp(src,"i"); }catch{ return null; } }
function dsRules(text){ return String(text||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const red=l.startsWith("!"); const [pat,...m]=l.replace(/^!/,"").split("=>"); return {re:dsRe(pat.trim()), msg:m.join("=>").trim()||pat.trim(), lv:red?"danger":"warn"}; }).filter(r=>r.re); }

function rxSystemic(r){ if(r.route==="Topical") return false; if(r.route==="Oral"||r.route==="Injection") return true; return !DS_TOPICAL.test(dsRxText(r)); }

/* patient-specific alerts */
function dsAlerts(d, ctx, otherText){
  const a=[], R=d.rules||{}; const age=parseFloat(ctx.age); const fem=ctx.sex==="Female"; const preg=ctx.preg||"";

  else if(R.terato && cba && preg!=="Breastfeeding") a.push({lv:"danger", msg:R.terato+(isNaN(age)?" (age not recorded)":"")});
  if(preg==="Breastfeeding"){ if(R.lactAvoid) a.push({lv:"danger", msg:`Breastfeeding: ${d.lact||"avoid"}`}); else if(d.lact) a.push({lv:"warn", msg:`Breastfeeding: ${d.lact}`}); }
  if(R.male && ctx.sex==="Male") a.push({lv:"warn", msg:R.male});
  if(R.minAge && !isNaN(age) && age<R.minAge) a.push({lv:R.minAgeWarn?"warn":"danger", msg:R.ageMsg||`Under ${R.minAge} years: not recommended`});
  if(R.elderly && !isNaN(age) && age>=65) a.push({lv:"warn", msg:R.elderly});
  const cm=[ctx.comorb, ctx.history].filter(Boolean).join(" \n "); if(cm) dsRules(R.comorb).forEach(r=>{ if(r.re.test(cm)) a.push({lv:r.lv, msg:r.msg}); });

  const w=parseFloat(ctx.weight); if(R.wt){ if(!isNaN(w)&&w>0){ const f=x=>Math.round(x*w*10)/10; a.push({lv:"info", msg:`Dose at ${w} kg: ${R.wt.lo>0&&R.wt.lo!==R.wt.hi?`${f(R.wt.lo)}–${f(R.wt.hi)}`:R.wt.lo===R.wt.hi?`≈ ${f(R.wt.hi)}`:`≤ ${f(R.wt.hi)}`} ${R.wt.unit} (${R.wt.lo&&R.wt.lo!==R.wt.hi?R.wt.lo+"–":R.wt.lo===R.wt.hi?"":"≤ "}${R.wt.hi} per kg)`}); } else a.push({lv:"info", msg:"Add weight to see the weight-based dose range"}); }
  if((R.terato||R.pregAvoid) && !ctx.sex) a.push({lv:"info", msg:"Record sex and age to check pregnancy risk"});
  return a;
}

    ${ta("deIx","Interaction rules (checked against current medicines and other prescribed drugs)",R.ix||"","warfarin => Warfarin: INR rises")}
    <div class="grid" style="gap:8px">${inp("deWlo","Dose per kg — low",R.wt?.lo??"")}${inp("deWhi","Dose per kg — high / max",R.wt?.hi??"")}${inp("deWu","Dose unit",R.wt?.unit||"mg/day")}</div>
    <p class="hint">Rule format: <code>word1|word2 => message</code>, one per line; start the line with <code>!</code> for a red alert.</p></div>`,
    `<div class="sres-act">${k&&base&&d.edited?`<button class="btn sm" type="button" id="deReset">Reset to default</button>`:""}${k&&d.custom?`<button class="btn sm danger" type="button" id="deDel">Delete</button>`:""}<button class="btn primary" type="button" id="deSave" style="margin-left:auto">Save</button></div>`, {back});
  const lines=id=>$("#"+id).value.split("\n").map(x=>x.trim()).filter(Boolean);
  $("#deSave").onclick=async()=>{ const name=$("#deName").value.trim(); if(!name){ toast("Add the drug name"); return; }
    const key=k||("c-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")); const lo=parseFloat($("#deWlo").value), hi=parseFloat($("#deWhi").value);
    const doc={k:key, name, cls:$("#deCls").value.trim(), match:$("#deMatch").value.trim()||name.toLowerCase(), ci_abs:lines("deAbs"), ci_rel:lines("deRel"), baseline:lines("deBase"), monitor:lines("deMon"), inter:lines("deInt"), preg:$("#dePreg").value.trim(), lact:$("#deLact").value.trim(), dose:$("#deDose").value.trim(),
      rules:{pregAvoid:$("#dePA").checked, lactAvoid:$("#deLA").checked, terato:$("#deTer").value.trim(), male:$("#deMale").value.trim(), minAge:parseFloat($("#deMin").value)||0, ageMsg:$("#deMinMsg").value.trim(), elderly:$("#deOld").value.trim(), comorb:$("#deCom").value.trim(), ix:$("#deIx").value.trim(), ...(isNaN(hi)?{}:{wt:{lo:isNaN(lo)?0:lo, hi, unit:$("#deWu").value.trim()||"mg/day"}})},
      custom: !DS_DEFAULTS.some(x=>x.k===key), updatedAt:Date.now()};
    if(!dsRe(doc.match)){ toast("Detection words contain an invalid pattern"); return; }
    if(await save("drugsafety", key, doc)){ S.dsOver={...(S.dsOver||{}), [key]:doc}; toast("Saved — verify against current guidelines"); back?back():panelClose(); S.safeHook?.(); } };
  if($("#deReset")) $("#deReset").onclick=async()=>{ if(await remove("drugsafety", k)){ const o={...(S.dsOver||{})}; delete o[k]; S.dsOver=o; toast("Reset to default"); back?back():panelClose(); S.safeHook?.(); } };
  armDelete($("#deDel"), async()=>{ if(await remove("drugsafety", k)){ const o={...(S.dsOver||{})}; delete o[k]; S.dsOver=o; toast("Drug removed"); back?back():panelClose(); S.safeHook?.(); } });
}

/* ---------- global events ---------- */
function wireShell(){
  const qc=$("#qCases"); if(qc) qc.addEventListener("input", fillCases);
  const qp=$("#qPatients"); if(qp) qp.addEventListener("input", fillPatients);
  const qm=$("#qMed"); if(qm) qm.addEventListener("input", ()=>{ S.medShow=60; fillMeds(); });
  const qt=$("#qTpl"); if(qt) qt.addEventListener("input", fillTemplates);
  const qpo=$("#qPost"); if(qpo) qpo.addEventListener("input", fillCorner);
}
document.addEventListener("click", async e => {
  const lb=e.target.closest("[data-lb]"); if(lb && lb.tagName!=="A"){ openLightbox(lb.dataset.lb, lb.dataset.cap); return; }
  const t=e.target.closest("[data-act],[data-pid],[data-visit],[data-pt],[data-pf],[data-mm],[data-mc],[data-star],[data-br],[data-tpl],[data-copy],[data-case],[data-cf],[data-newtplg],[data-dtab],[data-csec],[data-post]");
  if(!t || !t.isConnected) return;
  if(t.closest("#sheet2")) return;
  const inSheet = !!t.closest("#sheet");
  if(t.dataset.pid){ openPatientPage(t.dataset.pid); return; }
  if(t.dataset.visit){ const v=S.visits.find(x=>x.id===t.dataset.visit); if(v) openVisitView(v); return; }
  if(inSheet && !t.dataset.act && !t.dataset.copy) return;
  if(t.dataset.newtplg){ openTemplateEditor(null, {group:t.dataset.newtplg}); return; }
  if(t.dataset.case){ openCase(+t.dataset.case); return; }
  if(t.dataset.dtab){ S.drugTab=t.dataset.dtab; try{ localStorage.setItem("drx.dtab",S.drugTab); }catch{} render(true); secureForView(); return; }
  if(t.dataset.csec){ S.cornerTab=t.dataset.csec; fillCorner(); return; }
  if(t.dataset.post){ openPost(t.dataset.post); return; }
  if(t.dataset.cf){ S.caseF=t.dataset.cf; fillCases(); return; }
  if(t.dataset.pt){ S.ptTab=t.dataset.pt; fillProfile(); return; }
  if(t.dataset.pf){ S.pFilter=t.dataset.pf; fillPatients(); return; }
  if(t.dataset.mm){ S.medMode=t.dataset.mm; S.medCat="All"; S.medShow=60; fillMeds(); return; }
  if(t.dataset.mc){ S.medCat=t.dataset.mc; S.medShow=60; fillMeds(); return; }
  if(t.dataset.star){ const b=S.brands.find(x=>x.id===t.dataset.star); if(b){ const v=!b.preferred; t.setAttribute("aria-pressed", v); await patch("brands", b.id, {preferred:v}); toast(v?"Marked as preferred ★":"Removed from preferred"); } return; }
  if(t.dataset.br){ openBrandEditor(S.brands.find(x=>x.id===t.dataset.br)); return; }
  if(t.dataset.tpl){ const tp=S.templates.find(x=>x.id===t.dataset.tpl); if(isLadder(tp)) openLadder(tp); else openTemplateEditor(tp); return; }
  if(t.dataset.copy){ copyText(t.dataset.copy); return; }
  const a=t.dataset.act;
  if(a==="newconsult"||a==="newpatient") openPatientPage(null);
  else if(a==="editpatient") openPatientPage(S.pid);
  else if(a==="consult-this") openPatientPage(S.pid);
  else if(a==="today") showToday();
  else if(a==="fu-due") showFollowList("due");
  else if(a==="fu-over") showFollowList("over");
  else if(a==="go-patients"){ if(inSheet) closeSheet(); go("patients"); }
  else if(a==="go-meds"){ if(inSheet) closeSheet(); go("meds"); }
  else if(a==="go-templates"){ if(inSheet) closeSheet(); go("templates"); }
  else if(a==="scores") openScoreList({});
  else if(a==="drugsafety") openDrugSafety();
  else if(a==="newbrand") openBrandEditor(null);
  else if(a==="newtpl") openTemplateEditor(null);
  else if(a==="medmore"){ S.medShow+=60; fillMeds(); }
  else if(a==="settings") openSettings();
  else if(a==="signature") openSignature();
  else if(a==="photolib") openPhotoLibrary();
  else if(a==="cases") openCases();
  else if(a==="backup") exportBackup();
  else if(a==="sync") openSync();
  else if(a==="help") openHelp();
  else if(a==="newpost") openPostEditor(null);
  else if(a==="acct") openAccountSheet();
  else if(a==="approvals") openApprovals();
  else if(a==="compare") openCompare(S._cmp||[]);
  else if(a==="dsadd") openDsEditor(null, ()=>render(true));
  else if(a==="tour") { closeSheet(); showTour(true); }
  else if(a==="reviewq") openReviewQueue();
  else if(a==="wtcalc") { if(hasFull()) openWtCalc(null, "", true); else toast("Dose by weight is for verified members"); }
  else if(a==="exportanon") exportAnon();
});
/* ---------- data ---------- */
bootTips();
if(ACC()){ ACC().onAuth(()=>{ if(ACC().authReady) gate(); }); ACC().onRole(()=>{ gate(); watchUsersIfAdmin(); }); if(ACC().authReady){ gate(); watchUsersIfAdmin(); } }
render(true);
setTimeout(()=>{ hideBoot(); setTimeout(()=>showTour(false),400); }, 1200);
(async () => { try{ S.downloads = await window.claude?.use?.("downloads"); }catch{ S.downloads=null; } })();
(async () => { try{ S.assets = await window.claude?.use?.("assets"); }catch{ S.assets=null; } })();
(async () => {
  let db=null; try{ db = await window.claude?.use?.("db"); }catch{}
  if(!db){ S.noDb=true; S.loaded={people:true,visits:true,templates:true,brands:true,posts:true}; render(true); hideBoot(); return; }
  S.db=db;
  let t=null; const soon=()=>{ clearTimeout(t); t=setTimeout(()=>{ if($("#sheet").hidden) render(); else if(S.view) render(); },60); };
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id, ...d.data()})); S.loaded[key]=true; soon(); }, ()=>{});
  sub("people","people"); sub("visits","visits"); sub("templates","templates"); sub("brands","brands"); sub("posts","posts"); loadReviewed();
  db.collection("drugsafety").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]={...d.data(), k:d.id}; }); S.dsOver=o; S.safeHook?.(); }, ()=>{});
  db.collection("scores").onSnapshot(snap=>{ S.scores=snap.docs.map(d=>({id:d.id, ...d.data()})); S.loaded.scores=true; S.scoreHook?.(); }, ()=>{});
  db.doc("settings/clinic").onSnapshot(d=>{ S.settings = d.exists?{...d.data()}:{}; soon(); }, ()=>{});
})();
})();
</script>
